  <rect x="60" y="444" width="1160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="470" font-family="'Courier New',Courier,monospace" font-size="16" fill="#1e40af">"AI 키워드로 네이버 뉴스 3개 가져와서 요약하고,</text>
  <text x="84" y="492" font-family="'Courier New',Courier,monospace" font-size="16" fill="#1e40af">관련 이미지는 Pexels에서, 음성은 타입캐스트로 만들어줘"</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">API 각각의 Skill을 만들면 Claude가 알아서 조합해 실행한다</text>
