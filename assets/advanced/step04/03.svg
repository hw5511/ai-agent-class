<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 04</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">네이버 오픈 API  +  타입캐스트 TTS</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">한국어 검색·번역과 고품질 음성 합성을 에이전트에 연결합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">네이버 오픈 API  —  검색 · 번역 · 쇼핑</text>
  <rect x="60" y="272" width="1160" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="302" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#2563eb">"네이버 검색 API Skill 만들어줘. Client-Id랑 Secret은 환경변수로 받게 해줘."</text>
  <text x="60" y="344" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">headers = {"X-Naver-Client-Id": ID, "X-Naver-Client-Secret": SECRET}</text>
  <text x="60" y="372" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">res = requests.get("https://openapi.naver.com/v1/search/news.json", ...</text>

  <line x1="60" y1="398" x2="1220" y2="398" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">타입캐스트 TTS API  —  한국어 고품질 음성</text>
  <rect x="60" y="444" width="1160" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="474" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#2563eb">"typecast-python 설치하고 TTS Skill 만들어줘. actor_id는 파라미터로."</text>
  <text x="60" y="516" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">tc = TypeCast(api_token="...")  →  tc.tts("안녕하세요", actor_id="...")</text>

  <rect x="60" y="560" width="820" height="52" rx="10" fill="#eff6ff"/>
  <text x="470" y="591" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">네이버 · 타입캐스트 모두 계정 가입 후 즉시 발급 가능 (카드 불필요)</text>
  <rect x="900" y="560" width="360" height="52" rx="10" fill="#1e293b"/>
  <text x="920" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">API 발급</text>
  <text x="920" y="602" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#818cf8">developers.naver.com · typecast.ai</text>
</svg>