  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">사이트 소개</text>
  <rect x="60" y="266" width="1160" height="70" rx="8" fill="#f8fafc"/>
  <text x="84" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">github.com/yybmion/public-apis-4Kr</text>
  <text x="84" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">카테고리별 공개 API 정리 (국내 서비스 중심) — 인증 방식·무료 여부·설명 포함</text>
  <line x1="60" y1="354" x2="1220" y2="354" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">실습 STEPS</text>
  <circle cx="84" cy="420" r="14" fill="#eff6ff"/>
  <text x="84" y="426" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">1</text>
  <text x="110" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">위 GitHub 링크 접속 → 목록에서 써보고 싶은 API 하나 선택</text>
  <circle cx="84" cy="468" r="14" fill="#eff6ff"/>
  <text x="84" y="474" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">2</text>
  <text x="110" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"[선택한 API] 키 발급 방법 알려줘" → API 키 발급</text>
  <circle cx="84" cy="516" r="14" fill="#eff6ff"/>
  <text x="84" y="522" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">3</text>
  <text x="110" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"[API URL] 읽고 CLI Skill 만들어줘" → Claude가 Skill 자동 제작</text>
