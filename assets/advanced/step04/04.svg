<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 04</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">네이버 오픈 API 종류</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">7개 카테고리, 30개 이상의 API를 무료로 제공합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="60" y="228" width="340" height="44" rx="6" fill="#eff6ff"/>
  <text x="80" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">인증</text>
  <text x="160" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">네이버 로그인 / 회원 정보 조회</text>
  <rect x="60" y="280" width="340" height="58" rx="6" fill="#f8fafc"/>
  <text x="80" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">AI / 번역</text>
  <text x="80" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">Papago 번역 / Clova STT / Clova TTS</text>
  <text x="80" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">Clova Face Recognition (얼굴 인식)</text>
  <rect x="60" y="346" width="340" height="44" rx="6" fill="#f8fafc"/>
  <text x="80" y="373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">지도 / 위치</text>
  <text x="80" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">지도 API / 지오코딩 (주소↔좌표 변환)</text>
  <rect x="420" y="228" width="380" height="162" rx="6" fill="#f8fafc"/>
  <text x="440" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">검색  (12종)</text>
  <text x="440" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">블로그 · 뉴스 · 책 · 백과사전 · 영화</text>
  <text x="440" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">카페글 · 지식iN · 지역 · 웹문서</text>
  <text x="440" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">이미지 · 쇼핑 · 전문자료</text>
  <text x="440" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">콘텐츠 작성</text>
  <text x="440" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">블로그 글쓰기 / 카페 게시판 / 캘린더 일정</text>
  <rect x="820" y="228" width="400" height="44" rx="6" fill="#f8fafc"/>
  <text x="840" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">유틸리티</text>
  <text x="840" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">단축 URL (me2.do) / 캡차 / 공유하기</text>
  <rect x="820" y="280" width="400" height="110" rx="6" fill="#eff6ff"/>
  <text x="840" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">데이터랩  (이번 실습)</text>
  <text x="840" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">통합 검색어 트렌드 비교</text>
  <text x="840" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">쇼핑인사이트 카테고리 트렌드</text>
  <text x="840" y="373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">POST 방식 / JSON 응답</text>
  <line x1="60" y1="410" x2="1220" y2="410" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">비로그인 방식 (Client ID + Secret만 필요): 검색 · 데이터랩 · 번역 · 단축URL</text>
  <text x="60" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">로그인 방식 (OAuth 토큰 필요): 블로그 글쓰기 · 카페 · 캘린더 · 회원 정보</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">이번 강의는 비로그인 방식만 사용 — 키 2개로 바로 시작</text>
</svg>
