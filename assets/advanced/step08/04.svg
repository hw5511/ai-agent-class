<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Claude 분석  →  python-pptx PPT 보고서</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">ADV 01 python-pptx Skill로 임원 보고용 PPT를 만듭니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">분석 + PPT 생성 코드</text>
  <rect x="60" y="268" width="1160" height="210" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="292" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"># 1. Claude 데이터 분석</text>
  <text x="76" y="312" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">analysis = subprocess.run([</text>
  <text x="96" y="332" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">'claude', '-p',</text>
  <text x="96" y="352" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">f'다음 주간 데이터로 보고서 작성:\n{tasks}\n{docs}\n'</text>
  <text x="96" y="372" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"> '핵심 성과·이슈·다음 주 계획을 마크다운으로 작성'</text>
  <text x="76" y="392" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">], capture_output=True, text=True).stdout</text>
  <text x="76" y="412" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="432" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"># 2. PPT 생성  (ADV 01 python-pptx Skill 재사용)</text>
  <text x="76" y="452" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">make_ppt(title='주간 업무 보고',</text>
  <text x="96" y="472" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">sections=parse_markdown(analysis),</text>
  <text x="96" y="490" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">output='weekly_report.pptx')</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">ADV 01 python-pptx Skill을 보고서 자동화에 그대로 재사용합니다</text>
</svg>