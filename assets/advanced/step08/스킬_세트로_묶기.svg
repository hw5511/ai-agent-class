  <text x="290" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">색 · 타이포 · 시그니처</text>
  <text x="120" y="376" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── interface.md</text>
  <text x="290" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">접근성 · 포커스 · 카피</text>
  <text x="120" y="400" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── testing.md</text>
  <text x="290" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Vitest</text>
  <text x="120" y="424" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">└── verify.md</text>
  <text x="290" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">브라우저로 눈 확인</text>

  <rect x="60" y="462" width="500" height="38" rx="6" fill="#eff6ff"/>
  <text x="84" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1d4ed8">컴포넌트 · 스타일 · 폼 · CLI 는 공식 shadcn 스킬이 맡습니다</text>
  <text x="600" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">층이 다르면 겹쳐 쓸 수 있습니다</text>

  <rect x="600" y="242" width="620" height="52" rx="8" fill="#eff6ff"/>
