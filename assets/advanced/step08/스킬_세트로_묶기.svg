<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">스킬 세트로 묶기 — react-shadcn-kit</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">여러 스킬에서 필요한 부분만 뽑아 하나로 묶었습니다. 7회차 reference 라우팅과 같은 구조입니다</text>
  <line x1="60" y1="200" x2="1220" y2="200" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">세트 구조</text>
  <rect x="60" y="242" width="500" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="274" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#374151">react-shadcn-kit/</text>
  <text x="96" y="300" font-family="'Courier New',Courier,monospace" font-size="13" fill="#1d4ed8">├── SKILL.md</text>
  <text x="290" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">스택 기본값 + 라우팅</text>
  <text x="96" y="326" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">└── reference/</text>
  <text x="120" y="352" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── stack.md</text>
  <text x="290" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">스캐폴딩</text>
  <text x="120" y="376" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── components.md</text>
  <text x="290" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">컴포넌트 선택 · 작성</text>
  <text x="120" y="400" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── design.md</text>
  <text x="290" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">색 · 타이포 · 시그니처</text>
  <text x="120" y="424" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── interface.md</text>
  <text x="290" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">접근성 · 포커스 · 카피</text>
  <text x="120" y="448" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── testing.md</text>
  <text x="290" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Vitest</text>
  <text x="120" y="472" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── verify.md</text>
  <text x="290" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">브라우저로 눈 확인</text>
  <text x="120" y="496" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">└── process.md</text>
  <text x="290" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">계획 → 조각 → 검증</text>

  <text x="600" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">층이 다르면 겹쳐 쓸 수 있습니다</text>

  <rect x="600" y="242" width="620" height="52" rx="8" fill="#eff6ff"/>
  <text x="624" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">프로세스</text>
  <text x="740" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">계획 · TDD · 완료 전 검증</text>
  <text x="740" y="284" font-family="'Courier New',Courier,monospace" font-size="11" fill="#60a5fa">obra/superpowers</text>

  <rect x="600" y="304" width="620" height="52" rx="8" fill="#f0fdf4"/>
  <text x="624" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">스택</text>
  <text x="740" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">Vite · Vitest 빌드와 테스트 도구</text>
  <text x="740" y="346" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4ade80">antfu/skills</text>

  <rect x="600" y="366" width="620" height="52" rx="8" fill="#fef3c7"/>
  <text x="624" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">미감</text>
  <text x="740" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#b45309">색 · 타이포 · 템플릿 티 안 나게</text>
  <text x="740" y="408" font-family="'Courier New',Courier,monospace" font-size="11" fill="#d97706">anthropics/skills · frontend-design</text>

  <rect x="600" y="428" width="620" height="52" rx="8" fill="#fce7f3"/>
  <text x="624" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#be185d">검증</text>
  <text x="740" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#be185d">접근성 규칙 · 브라우저 확인</text>
  <text x="740" y="470" font-family="'Courier New',Courier,monospace" font-size="11" fill="#ec4899">vercel-labs/web-interface-guidelines</text>

  <rect x="60" y="508" width="1160" height="46" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="84" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#b91c1c">같은 층에 둘을 깔면 충돌합니다 — 예: Tailwind 를 쓰면서 UnoCSS 스킬을 함께 깔면 Claude 가 매번 다른 것을 고릅니다</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">스킬은 많이 까는 게 아니라 층을 맞추는 것입니다 — 겹치는 순간 싸웁니다</text>
</svg>
