  <text x="740" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">공식 shadcn 스킬이 맡습니다</text>
  <text x="740" y="284" font-family="'Courier New',Courier,monospace" font-size="11" fill="#60a5fa">shadcn-ui/ui  ·  rules 6장</text>

