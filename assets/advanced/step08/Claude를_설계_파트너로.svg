<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Claude를 설계 파트너로 쓰는 법</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">혼자 고민하지 말고 Claude와 함께 설계합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="60" y="228" width="530" height="290" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="325" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#dc2626">기존 방식</text>
  <text x="80" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">혼자 CLAUDE.md를 처음부터 작성</text>
  <text x="80" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#9ca3af">뭘 써야 할지 막막함</text>
  <text x="80" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#9ca3af">트리거/스킬/규칙을 직접 구상해야 함</text>
  <text x="80" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#9ca3af">"어떻게 쓰면 Claude가 잘 이해할까?"</text>
  <text x="80" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#dc2626">-&gt; 비개발자에게 너무 막막한 시작점</text>
  <rect x="630" y="228" width="590" height="290" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="925" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">논의 프롬프트 방식</text>
  <text x="650" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Claude에게 내 상황을 설명한다</text>
  <text x="650" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">Claude가 8요소를 하나씩 물어봄</text>
  <text x="650" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">대화하며 구조가 자연스럽게 잡힘</text>
  <text x="650" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">"이런 자동화 원해요. 어떻게 설계할까요?"</text>
  <text x="650" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#16a34a">-&gt; CLAUDE.md를 Claude가 직접 써줌</text>
  <text x="60" y="544" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">논의 프롬프트 시작 예시</text>
  <rect x="60" y="554" width="1160" height="36" rx="4" fill="#1e293b"/>
  <text x="80" y="577" font-family="'Courier New',Courier,monospace" font-size="13" fill="#94a3b8">나는 회의록을 자동 정리하고 담당자별 업무를 Notion에 등록하고 싶어. 하네스 구조 잡아줘.</text>
  <rect x="60" y="598" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="629" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">Claude가 질문하며 8요소를 함께 채워줍니다</text>
</svg>
