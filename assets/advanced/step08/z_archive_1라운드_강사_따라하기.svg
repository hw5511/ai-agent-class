<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <rect x="148" y="44" width="96" height="24" rx="12" fill="#16a34a"/>
  <text x="196" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">1라운드</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">1라운드 — 강사 하네스로 먼저 체험</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">내 것을 만들기 전에 강사 세팅으로 전체 흐름을 먼저 경험합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 왼쪽: 준비 방법 -->
  <text x="60" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">준비 방법</text>
  <rect x="60" y="260" width="520" height="220" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="80" y="278" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="295" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="116" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">강사가 공유한 CLAUDE.md + 스킬 파일 복사</text>
  <rect x="80" y="316" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="333" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="116" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">내 .claude/ 폴더에 붙여넣기</text>
  <rect x="80" y="354" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="116" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">아래 명령어로 실행</text>
  <rect x="80" y="396" width="480" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="320" y="419" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" fill="#2563eb">신상품 기획회의 자동화 처리해줘</text>
  <rect x="80" y="448" width="480" height="20" rx="4" fill="#f0fdf4"/>
  <text x="320" y="462" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#16a34a">강사 세팅 그대로 — 내 API 계정으로 실행됩니다</text>

  <!-- 오른쪽: 체험 포인트 -->
  <text x="620" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">체험 포인트</text>
  <rect x="620" y="260" width="600" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">CLAUDE.md가 동작하는 순간</text>
  <text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">파일 하나로 Claude의 행동이 완전히 달라지는 것 확인</text>
  <rect x="620" y="322" width="600" height="52" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">스킬 파이프라인 실행</text>
  <text x="640" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">회의록→Notion→조사→보고까지 스킬이 연결되는 과정 관찰</text>
  <rect x="620" y="384" width="600" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="640" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">결과물 확인</text>
  <text x="640" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">Notion 등록 / 시트 생성 / 이메일 발송 직접 확인</text>
  <rect x="620" y="446" width="600" height="36" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="920" y="469" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">1라운드 완료 → 2라운드: 나만의 하네스 직접 설계</text>

  <rect x="60" y="516" width="1160" height="36" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="539" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e">내 것이 아니어도 괜찮습니다 — 흐름을 체험하는 것이 먼저입니다</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">하네스가 어떻게 작동하는지 눈으로 확인한 다음 내 것을 설계합니다</text>
</svg>
