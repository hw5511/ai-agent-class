<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">폴링이란?</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">에이전트가 10초마다 Notion을 확인하며 새 할 일을 기다립니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Analogy -->
  <rect x="60" y="232" width="490" height="296" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="305" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">일상 비유</text>
  <text x="80" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">직원이 메모판을 보고 새 업무를 기다리는 상황</text>
  <text x="80" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">"10초마다 메모판 확인"</text>
  <text x="80" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">"새 메모 없음 → 다시 10초 대기"</text>
  <text x="80" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">"새 메모 발견 → 즉시 처리 시작"</text>
  <text x="80" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e">담당자 에이전트 5명이 각자 메모판을 봅니다</text>

  <!-- Arrow -->
  <text x="578" y="388" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" fill="#d1d5db">&#8594;</text>

  <!-- Right: Actual flow -->
  <rect x="600" y="232" width="620" height="296" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="910" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">실제 동작</text>

  <!-- Step 1 -->
  <rect x="620" y="282" width="28" height="28" rx="14" fill="#2563eb"/>
  <text x="634" y="301" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="660" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">notion_poller.py 실행 → 10초 대기</text>

  <!-- Step 2 -->
  <rect x="620" y="330" width="28" height="28" rx="14" fill="#2563eb"/>
  <text x="634" y="349" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="660" y="349" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Notion DB 조회 → 내 이름 + 상태 "시작 전" 확인</text>

  <!-- Step 3 -->
  <rect x="620" y="378" width="28" height="28" rx="14" fill="#16a34a"/>
  <text x="634" y="397" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="660" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#16a34a">새 task 발견 → 상태를 "진행 중"으로 변경</text>

  <!-- Step 4 -->
  <rect x="620" y="426" width="28" height="28" rx="14" fill="#16a34a"/>
  <text x="634" y="445" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="660" y="445" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#16a34a">스킬 호출 → 산출물 생성 → 상태 "완료"</text>

  <!-- Step 5 -->
  <rect x="620" y="474" width="28" height="28" rx="14" fill="#2563eb"/>
  <text x="634" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="660" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">다시 10초 대기 → 반복</text>

  <!-- Bottom bar -->
  <rect x="60" y="556" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">폴링 = 에이전트가 10초마다 Notion을 확인하며 새 task를 기다리는 것</text>
</svg>
