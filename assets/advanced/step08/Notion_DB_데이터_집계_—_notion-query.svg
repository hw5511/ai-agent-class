<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Notion DB 데이터 집계  —  notion-query</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">여러 DB에서 데이터를 수집해서 보고서 소스를 만듭니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">집계 코드</text>
  <rect x="60" y="268" width="1160" height="200" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="292" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">import subprocess</text>
  <text x="76" y="312" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="332" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">def query(db, filters, cols):</text>
  <text x="96" y="352" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">r = subprocess.run(</text>
  <text x="116" y="372" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">['python', 'notion_query.py', db, '-f', filters, '-c', cols],</text>
  <text x="116" y="392" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">capture_output=True, text=True, encoding='utf-8'</text>
  <text x="96" y="412" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">)</text>
  <text x="96" y="432" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">return r.stdout</text>
  <text x="76" y="452" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="460" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">tasks = query('ai-tasks', '상태=완료', '이름,담당자,완료일')   # 완료 태스크 집계</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">ADV 05 폴링 구조를 데이터 집계 방식으로 응용합니다</text>
</svg>