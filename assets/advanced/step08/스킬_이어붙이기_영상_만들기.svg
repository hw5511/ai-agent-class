<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">스킬 이어붙이기 — 자막에서 영상까지</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">스킬 하나가 다 해주지 않습니다. 두 개를 파이프라인으로 이어 실제 산출물을 만듭니다</text>
  <line x1="60" y1="200" x2="1220" y2="200" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">파이프라인</text>

  <rect x="60" y="244" width="200" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#374151">SRT 자막</text>
  <text x="160" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">대본 5장면</text>

  <path d="M268 292 H292" stroke="#94a3b8" stroke-width="2"/>
  <path d="M285 286 L293 292 L285 298" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="300" y="244" width="200" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="400" y="284" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#1d4ed8">srt-whiteboard</text>
  <text x="400" y="308" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">손이 그려나감</text>
  <text x="400" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#60a5fa">Python · OpenCV</text>

  <path d="M508 292 H532" stroke="#94a3b8" stroke-width="2"/>
  <path d="M525 286 L533 292 L525 298" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="540" y="244" width="200" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#374151">씬 MP4 5개</text>
  <text x="640" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">각 9.2초</text>

  <path d="M748 292 H772" stroke="#94a3b8" stroke-width="2"/>
  <path d="M765 286 L773 292 L765 298" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="780" y="244" width="200" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="880" y="284" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#1d4ed8">Remotion</text>
  <text x="880" y="308" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">타임라인 편집</text>
  <text x="880" y="328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#60a5fa">React · 헤드리스 크롬</text>

  <path d="M988 292 H1012" stroke="#94a3b8" stroke-width="2"/>
  <path d="M1005 286 L1013 292 L1005 298" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="1020" y="244" width="200" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="1120" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">완성 MP4</text>
  <text x="1120" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">48초</text>

  <text x="60" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">역할이 겹치지 않습니다</text>

  <rect x="60" y="396" width="566" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="424" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#1d4ed8">srt-whiteboard</text>
  <text x="84" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">자막 순서대로 요소를 하나씩 그린다</text>
  <text x="84" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">선을 먼저 긋고 색을 나중에 칠한다</text>
  <text x="84" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">단계마다 멈춰 확인받는 설계</text>

  <rect x="654" y="396" width="566" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="678" y="424" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#1d4ed8">Remotion</text>
  <text x="678" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">TransitionSeries 로 5개 클립 배치</text>
  <text x="678" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">전환 · 타이틀 · 자막 띠 · 최종 인코딩</text>
  <text x="678" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">클립 끝을 드래그하면 뒤가 밀린다</text>

  <rect x="60" y="530" width="1160" height="30" rx="6" fill="#fffbeb"/>
  <text x="80" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e">주의 — srt-whiteboard 는 파이썬을 실행하고, SKILL.md 에 "출력을 중국어로 쓰라"는 조항이 있습니다. 설치 전 열어보고 그 줄을 고쳐야 합니다</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">스킬 하나로 안 되면 두 개를 잇습니다 — 접합부는 파일입니다 (여기서는 SRT 와 MP4)</text>
</svg>
