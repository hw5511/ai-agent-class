<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">시연: Claude와 하네스 구조 논의</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">8요소를 직접 설명해주면 — Claude가 질문하며 구조를 완성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">논의 프롬프트 — 8요소를 직접 설명하며 입력</text>
  <rect x="60" y="254" width="1160" height="148" rx="8" fill="#1e293b"/>
  <text x="80" y="276" font-family="'Courier New',Courier,monospace" font-size="13" fill="#94a3b8">$ 나는 신상품 기획 회의가 끝나면 자동으로 처리하고 싶어.</text>
  <text x="80" y="295" font-family="'Courier New',Courier,monospace" font-size="12" fill="#64748b">  트리거: 회의 후 Docs URL 전달   /   Context: 담당자 목록(이름&#xB7;담당업무) &#xB7; 임원 이메일</text>
  <text x="80" y="314" font-family="'Courier New',Courier,monospace" font-size="12" fill="#64748b">  Input: 구글 Docs 회의록 (날것 메모 + 음성 변환본)</text>
  <text x="80" y="333" font-family="'Courier New',Courier,monospace" font-size="12" fill="#64748b">  Logic: 회의록 정리 &#x2192; Notion 업무 등록 &#x2192; 데이터랩 조사 &#x2192; Gmail 보고</text>
  <text x="80" y="352" font-family="'Courier New',Courier,monospace" font-size="12" fill="#64748b">  State: Notion 태스크 상태   /   Output: 조사결과 시트 + 최종 보고 Docs</text>
  <text x="80" y="371" font-family="'Courier New',Courier,monospace" font-size="12" fill="#64748b">  Rules: 담당자 누락 시 중단   /   Report: 임원에게 Gmail 발송</text>
  <text x="80" y="390" font-family="'Courier New',Courier,monospace" font-size="12" fill="#94a3b8">  &#x2192; 하네스 8요소로 CLAUDE.md 설계해줘.</text>
  <text x="60" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude 응답 (구체화 질문)</text>
  <rect x="60" y="438" width="1160" height="150" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">Claude:</text>
  <text x="80" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">1. Context — 담당자 목록을 CLAUDE.md에 미리 정의할까요? (예: 홍길동 - 시장조사 담당)</text>
  <text x="80" y="513" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">2. State — Notion 프로젝트 ID를 알려주시면 태스크를 자동 등록하겠습니다.</text>
  <text x="80" y="537" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">3. Report — 임원 이메일 주소를 CLAUDE.md의 report_to에 넣겠습니다.</text>
  <text x="80" y="561" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">4. Logic — 데이터랩 조사와 웹 조사 두 가지 모두 사용할까요?</text>
  <rect x="60" y="612" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="643" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">8요소를 직접 설명하면 — Claude가 내용을 확인하며 CLAUDE.md를 완성합니다</text>
</svg>
