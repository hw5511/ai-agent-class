    <rect x="894" y="228" width="166" height="230" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="977" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#581c87">최주임</text>
    <text x="977" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#7e22ce">디자인</text>
    <line x1="908" y1="298" x2="1046" y2="298" stroke="#e9d5ff" stroke-width="1"/>
    <text x="977" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">AI 이미지 시안</text>
    <text x="977" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">Stability SD3</text>
    <text x="977" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">→ Drive</text>
    <text x="977" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#7c3aed">stability-image-gen</text>
    <text x="977" y="428" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#7c3aed">← 방금 만든 스킬!</text>
