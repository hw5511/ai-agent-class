  <text x="206" y="348" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#d1d5db">&#8594;</text>

  <!-- Notion DB -->
  <g clip-path="url(#cp-notion)">
    <rect x="218" y="288" width="130" height="90" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="283" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d">Notion</text>
    <text x="283" y="336" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#15803d">Work DB</text>
    <text x="283" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">10초 폴링</text>
  </g>

