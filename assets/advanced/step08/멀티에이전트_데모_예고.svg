<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="cp-pm"><rect x="60" y="228" width="140" height="230" rx="10"/></clipPath>
    <clipPath id="cp-notion"><rect x="218" y="288" width="130" height="90" rx="8"/></clipPath>
    <clipPath id="cp-a1"><rect x="366" y="228" width="166" height="230" rx="10"/></clipPath>
    <clipPath id="cp-a2"><rect x="542" y="228" width="166" height="230" rx="10"/></clipPath>
    <clipPath id="cp-a3"><rect x="718" y="228" width="166" height="230" rx="10"/></clipPath>
    <clipPath id="cp-a4"><rect x="894" y="228" width="166" height="230" rx="10"/></clipPath>
    <clipPath id="cp-a5"><rect x="1070" y="228" width="150" height="230" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">시연: 멀티 에이전트 협업 데모</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">6명이 동시에 움직입니다 — 각자 역할을 확인하세요</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- PM card -->
  <g clip-path="url(#cp-pm)">
    <rect x="60" y="228" width="140" height="230" rx="10" fill="#1e40af"/>
    <text x="130" y="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">PM</text>
    <text x="130" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfdbfe">회의록 수신</text>
    <text x="130" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfdbfe">액션아이템 분석</text>
    <text x="130" y="324" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfdbfe">Notion DB 등록</text>
    <text x="130" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#93c5fd">docs / notion-api</text>
    <text x="130" y="374" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#93c5fd">calendar</text>
  </g>

