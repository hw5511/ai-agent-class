  <!-- Bottom banner -->
  <rect x="60" y="482" width="1160" height="40" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="507" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#15803d">회의록 하나 → PM이 분석 → 5명이 동시에 자기 일 시작 (Notion DB 10초 폴링)</text>

  <rect x="60" y="538" width="1160" height="52" rx="10" fill="#1e40af"/>
  <text x="640" y="569" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">지금부터 실제 VSCode 화면으로 전환합니다</text>
</svg>
