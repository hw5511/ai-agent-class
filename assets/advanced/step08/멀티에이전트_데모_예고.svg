    <text x="801" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">정대리</text>
    <text x="801" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#1e40af">개발</text>
    <line x1="732" y1="298" x2="870" y2="298" stroke="#bfdbfe" stroke-width="1"/>
    <text x="801" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">개발 일정표</text>
    <text x="801" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">외주 컨택 이메일</text>
    <text x="801" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">→ Sheets / Gmail</text>
    <text x="801" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#1e40af">sheets / gmail</text>
  </g>

  <!-- 최주임 -->
