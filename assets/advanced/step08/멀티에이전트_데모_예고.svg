    <rect x="1070" y="228" width="150" height="230" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="1145" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#7c2d12">김대표</text>
    <text x="1145" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#c2410c">경영</text>
    <line x1="1084" y1="298" x2="1206" y2="298" stroke="#fed7aa" stroke-width="1"/>
    <text x="1145" y="320" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">이사회 보고서</text>
    <text x="1145" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">발표자료</text>
    <text x="1145" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">→ Slides</text>
    <text x="1145" y="410" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#c2410c">slides</text>
