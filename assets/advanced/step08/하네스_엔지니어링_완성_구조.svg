<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">하네스 엔지니어링 완성 구조</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">에이전트를 자율 실행 시스템으로 만드는 8가지 요소</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="60" y="228" width="240" height="28" rx="6" fill="#eff6ff"/>
  <text x="180" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">BEFORE  준비</text>
  <rect x="60" y="264" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">트리거</text>
  <text x="90" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">언제 시작하나</text>
  <rect x="60" y="334" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">Context</text>
  <text x="90" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">무엇을 알고 있나 (CLAUDE.md)</text>
  <rect x="60" y="404" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">Input</text>
  <text x="90" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">이번에 필요한 재료</text>
  <rect x="330" y="228" width="240" height="28" rx="6" fill="#f0fdf4"/>
  <text x="450" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">DURING  실행</text>
  <rect x="330" y="264" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="360" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">Logic</text>
  <text x="360" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">어떻게 처리하나 (스킬/MCP/CLI)</text>
  <rect x="330" y="334" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="360" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">State</text>
  <text x="360" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">진행 상황 추적 (Notion Status)</text>
  <rect x="600" y="228" width="240" height="28" rx="6" fill="#fef3c7"/>
  <text x="720" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">AFTER  완료</text>
  <rect x="600" y="264" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="630" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">Output</text>
  <text x="630" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">무엇이 만들어졌나</text>
  <rect x="600" y="334" width="240" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="630" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">Report</text>
  <text x="630" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">어디로 보내나 (Gmail/Notion)</text>
  <rect x="870" y="228" width="370" height="28" rx="6" fill="#fdf4ff"/>
  <text x="1055" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9333ea">CONTROL  제어</text>
  <rect x="870" y="264" width="370" height="130" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="900" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9333ea">Rules</text>
  <text x="900" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">프로그래밍적 제어</text>
  <text x="900" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">settings.json  allowedTools 제한</text>
  <text x="900" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">hooks  실행 전/후 자동 제어</text>
  <text x="900" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">agent_scope  허용 범위 경계</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">8요소가 갖춰지면 에이전트는 자율 실행 시스템이 됩니다</text>
</svg>
