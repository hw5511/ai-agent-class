<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 08</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">ELI5 — 상대에 맞춰 설명하기</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">같은 내용을 다섯 살에게, 팀장에게, 부모님에게 각각 다르게 설명해 주는 스킬</text>
  <line x1="60" y1="200" x2="1220" y2="200" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">이렇게 말하면 발동합니다</text>
  <rect x="60" y="242" width="560" height="140" rx="8" fill="#0f172a"/>
  <text x="84" y="274" font-family="'Courier New',Courier,monospace" font-size="14" fill="#a5f3fc">이 에러 우리 팀장한테 설명해줘</text>
  <text x="84" y="302" font-family="'Courier New',Courier,monospace" font-size="14" fill="#e2e8f0">git 충돌이 뭔지 5학년한테 설명해줘</text>
  <text x="84" y="330" font-family="'Courier New',Courier,monospace" font-size="14" fill="#e2e8f0">이 코드 우리 엄마한테 설명해줘</text>
  <text x="84" y="364" font-family="'Courier New',Courier,monospace" font-size="12" fill="#94a3b8">듣는 사람만 바꿔 말하면 나머지는 알아서 맞춰집니다</text>

  <text x="660" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">무엇이 바뀌는가</text>
  <rect x="660" y="242" width="560" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="684" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">어휘</text>
  <text x="760" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">아이에겐 전문용어 없이, 엔지니어에겐 정확히</text>
  <text x="684" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">비유</text>
  <text x="760" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">다섯 살은 장난감, 팀장은 비용과 일정</text>
  <text x="684" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">깊이</text>
  <text x="760" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">짧게 끝낼지, 예외까지 파고들지</text>
  <text x="684" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">관점</text>
  <text x="760" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">팀장은 리스크, 디자이너는 사용자 경험</text>

  <text x="60" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">지원하는 상대</text>
  <rect x="60" y="430" width="272" height="66" rx="8" fill="#eff6ff"/>
  <text x="84" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">나이</text>
  <text x="84" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">5 · 10 · 15 · 20 · 30 · 40+</text>

  <rect x="348" y="430" width="272" height="66" rx="8" fill="#f0fdf4"/>
  <text x="372" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">학년</text>
  <text x="372" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#16a34a">초 · 중 · 고 · 대학 · 대학원</text>

  <rect x="636" y="430" width="272" height="66" rx="8" fill="#fef3c7"/>
  <text x="660" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">직무</text>
  <text x="660" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#b45309">팀장 · 엔지니어 · 디자이너 · PM</text>

  <rect x="924" y="430" width="296" height="66" rx="8" fill="#fce7f3"/>
  <text x="948" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#be185d">관계</text>
  <text x="948" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#be185d">배우자 · 부모님 · 아이 · 친구</text>

  <rect x="60" y="514" width="1160" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="539" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">레포 전체가 파일 9개 — SKILL.md 116줄에 평가 스크립트까지. 오늘 통째로 열어서 안을 들여다볼 수 있는 크기입니다.</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">설치하기 전에 SKILL.md 를 먼저 열어봅니다 — 이 스킬은 그게 가능한 크기입니다</text>
</svg>
