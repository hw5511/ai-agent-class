<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 02</text>
  <text x="60" y="130" font-family="-apple-system,sans-serif" font-size="40" font-weight="700" fill="#171717">Playwright MCP 설치와 핵심 툴</text>
  <text x="60" y="178" font-family="-apple-system,sans-serif" font-size="19" fill="#6b7280">Claude Code에서 브라우저를 직접 제어하는 MCP 서버입니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="256" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="270" width="1160" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="300" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"Playwright MCP 설치해줘"</text>
  <line x1="60" y1="338" x2="1220" y2="338" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="374" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">핵심 툴 (기본 포함)</text>
  <text x="60" y="412" font-family="-apple-system,sans-serif" font-size="17" fill="#374151">browser_navigate               URL로 이동</text>
  <text x="60" y="444" font-family="-apple-system,sans-serif" font-size="17" fill="#374151">browser_snapshot               페이지 요소 구조 분석  (액션 전 필수)</text>
  <text x="60" y="476" font-family="-apple-system,sans-serif" font-size="17" fill="#374151">browser_take_screenshot        스크린샷 저장</text>
  <text x="60" y="508" font-family="-apple-system,sans-serif" font-size="17" fill="#374151">browser_click / browser_type / browser_fill_form    클릭, 입력</text>
  <text x="60" y="540" font-family="-apple-system,sans-serif" font-size="17" fill="#374151">browser_console_messages       콘솔 에러 조회</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="594" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" fill="#2563eb">browser_snapshot 이 스크린샷보다 권장됩니다</text>
  <text x="640" y="612" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#6b7280">접근성 트리 기반으로 Claude가 요소를 정확히 파악하고 조작합니다</text>
</svg>