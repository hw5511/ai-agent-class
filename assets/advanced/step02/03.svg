<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 02</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Playwright MCP 설치</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">명령어 하나로 Claude Code에 Playwright MCP를 연결합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">설치 명령어 — 터미널에서 실행</text>
  <rect x="60" y="278" width="1160" height="60" rx="8" fill="#0f172a"/>
  <text x="84" y="315" font-family="'Courier New',Courier,monospace" font-size="20" fill="#a5f3fc">claude mcp add playwright npx @playwright/mcp@latest</text>
  <line x1="60" y1="364" x2="1220" y2="364" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">설치 후 확인</text>
  <circle cx="84" cy="438" r="14" fill="#eff6ff"/>
  <text x="84" y="444" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">1</text>
  <text x="110" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">Claude Code를 재시작 (또는 /mcp 명령으로 상태 확인)</text>
  <circle cx="84" cy="488" r="14" fill="#eff6ff"/>
  <text x="84" y="494" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">2</text>
  <text x="110" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"playwright MCP 설치됐어?" 라고 물어보기</text>
  <circle cx="84" cy="538" r="14" fill="#eff6ff"/>
  <text x="84" y="544" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">3</text>
  <text x="110" y="544" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">browser_navigate, browser_snapshot 등 툴 목록 확인</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">MCP = AI가 브라우저 조작 도구를 직접 사용할 수 있게 해주는 연결 규약</text>
</svg>
