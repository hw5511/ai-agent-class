<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 02</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">웹 자동화, 어디까지 가능한가</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">기술적으로 가능한 것과 해도 되는 것은 다릅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 좌: 가능한 것 -->
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a" letter-spacing="0.08em">활용 가능</text>
  <text x="60" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">내가 만든 웹사이트 자동 테스트</text>
  <text x="60" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">앱스토어 제출용 스크린샷 자동 캡처</text>
  <text x="60" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">공개 허용 사이트 데이터 수집  (robots.txt 허용)</text>
  <text x="60" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">내 계정 업무 자동화  (반복 작업 처리)</text>

  <line x1="60" y1="432" x2="1220" y2="432" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 우: 주의 필요 -->
  <text x="60" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#dc2626" letter-spacing="0.08em">주의 필요</text>
  <text x="60" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">이용약관에 크롤링 금지가 명시된 사이트</text>
  <text x="60" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">사람인이 잡코리아 크롤링으로 합의금 120억 지급  (대법원 2017년 확정)</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#fef2f2"/>
  <text x="640" y="594" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#dc2626">이 강의에서 배운 기술은 개인 업무 자동화 · 허용된 공개 데이터 · 본인 소유 사이트에만 사용하세요</text>
  <text x="640" y="612" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#ef4444">무단 수집으로 인한 법적 책임은 수강생 본인에게 있습니다</text>
</svg>
