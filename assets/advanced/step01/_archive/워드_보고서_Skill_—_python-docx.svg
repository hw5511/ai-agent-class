<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 01</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">워드 보고서 Skill  —  python-docx</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">보고서_템플릿.docx 양식에 분석 결과를 자동으로 채웁니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="278" width="1160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="309" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"python-docx 설치하고 워드 보고서 생성 Skill 만들어줘"</text>
  <line x1="60" y1="350" x2="1220" y2="350" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">템플릿 치환 패턴</text>
  <text x="60" y="422" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">doc = Document('보고서_템플릿.docx')</text>
  <text x="60" y="458" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">for p in doc.paragraphs:</text>
  <text x="60" y="494" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">    if '[보고서 제목]' in p.text:</text>
  <text x="60" y="530" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">        p.runs[0].text = '실제 보고서 제목'  /  doc.save('out.docx')</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">템플릿 구성: 표지·목차·개요·현황분석·결론 / 플레이스홀더 [  ] 방식</text>
</svg>
