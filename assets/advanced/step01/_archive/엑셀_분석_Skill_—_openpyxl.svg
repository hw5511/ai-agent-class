<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 01</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">엑셀 분석 Skill  —  openpyxl</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">매출데이터_템플릿.xlsx를 읽어 데이터를 분석합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="278" width="1160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="309" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"openpyxl 설치하고 엑셀 파일 읽는 Skill 만들어줘"</text>
  <line x1="60" y1="350" x2="1220" y2="350" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">핵심 코드</text>
  <text x="60" y="422" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">wb = load_workbook('매출데이터_템플릿.xlsx')</text>
  <text x="60" y="458" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">ws = wb['매출 데이터']</text>
  <text x="60" y="494" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">for row in ws.iter_rows(min_row=5, values_only=True):</text>
  <text x="60" y="530" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">    print(row)  # No, 날짜, 거래처, 제품명, 매출액 ...</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">시트 구성: 매출 데이터 (35행) / 월별 요약 (15행) / 사용 안내</text>
</svg>
