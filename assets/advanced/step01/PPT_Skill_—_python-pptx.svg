<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 01</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">PPT Skill  —  python-pptx</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">회사_범용_템플릿.pptx를 기반으로 발표 자료를 자동 생성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="278" width="1160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="309" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"python-pptx 설치하고 PPT 자동 생성 Skill 만들어줘"</text>
  <line x1="60" y1="350" x2="1220" y2="350" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">템플릿 활용 패턴</text>
  <text x="60" y="422" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">prs = Presentation('회사_범용_템플릿.pptx')</text>
  <text x="60" y="458" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">slide = prs.slides[3]  # 내용 슬라이드 (9장 구성)</text>
  <text x="60" y="494" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">for shape in slide.shapes:</text>
  <text x="60" y="530" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">    if shape.has_text_frame: shape.text_frame.text = '새 내용'</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">템플릿 9장: 표지·목차·섹션·내용·요약·데이터·로드맵·팀·마무리</text>
</svg>
