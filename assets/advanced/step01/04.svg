<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 01</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">PPT Skill  —  python-pptx</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">프레젠테이션 파일을 Python으로 자동 생성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="278" width="1160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="309" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"python-pptx 설치하고 PPT 자동 생성 Skill 만들어줘"</text>
  <line x1="60" y1="350" x2="1220" y2="350" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">핵심 코드</text>
  <text x="60" y="430" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">prs = Presentation()</text>
  <text x="60" y="466" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">slide = prs.slides.add_slide(prs.slide_layouts[5])</text>
  <text x="60" y="502" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">tf = slide.shapes.add_textbox(Inches(1), Inches(1), Inches(8), Inches(2))</text>
  <text x="60" y="538" font-family="'Courier New',Courier,monospace" font-size="19" fill="#374151">tf.text_frame.text = "내용"  /  prs.save("out.pptx")</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">import: from pptx import Presentation  /  from pptx.util import Inches, Pt</text>
</svg>