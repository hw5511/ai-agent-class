<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">python-pptx로 1080×1080 카드 이미지 생성</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">ADV 01 python-pptx Skill을 정방형 카드용으로 수정합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">1080×1080 정방형 설정 + 카드 생성</text>
  <rect x="60" y="268" width="1160" height="220" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="292" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">from pptx import Presentation</text>
  <text x="76" y="312" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">from pptx.util import Emu, Pt</text>
  <text x="76" y="332" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="352" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">prs = Presentation()</text>
  <text x="76" y="372" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">prs.slide_width  = Emu(9144000)   # 1080px 정방형</text>
  <text x="76" y="392" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">prs.slide_height = Emu(9144000)</text>
  <text x="76" y="412" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="432" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">for card in cards:</text>
  <text x="96" y="452" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">slide = prs.slides.add_slide(blank_layout)</text>
  <text x="96" y="472" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">add_bg_image(slide, pexels_img)   # ADV 04 Pexels API 재사용</text>
  <text x="96" y="492" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">add_text_overlay(slide, card['title'], card['body'])</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">ADV 01 python-pptx Skill  +  ADV 04 Pexels API Skill 재사용</text>
</svg>