<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="cp-input"><rect x="60" y="232" width="140" height="262" rx="10"/></clipPath>
    <clipPath id="cp-pm"><rect x="218" y="232" width="140" height="262" rx="10"/></clipPath>
    <clipPath id="cp-notion"><rect x="376" y="305" width="120" height="52" rx="8"/></clipPath>
    <clipPath id="cp-a1"><rect x="550" y="232" width="158" height="46" rx="8"/></clipPath>
    <clipPath id="cp-a2"><rect x="550" y="286" width="158" height="46" rx="8"/></clipPath>
    <clipPath id="cp-a3"><rect x="550" y="340" width="158" height="46" rx="8"/></clipPath>
    <clipPath id="cp-a4"><rect x="550" y="394" width="158" height="46" rx="8"/></clipPath>
    <clipPath id="cp-a5"><rect x="550" y="448" width="158" height="46" rx="8"/></clipPath>
    <clipPath id="cp-output"><rect x="730" y="232" width="490" height="262" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">시연 시나리오: 신상품 기획회의</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">회의록 하나 → PM 분석 → 5명 담당자 동시 처리 → 산출물 완성</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- INPUT -->
  <g clip-path="url(#cp-input)">
    <rect x="60" y="232" width="140" height="262" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e40af">INPUT</text>
    <text x="130" y="292" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">회의록</text>
    <text x="130" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">Google Docs</text>
    <text x="130" y="334" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">날것 메모</text>
    <text x="130" y="354" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">+ 음성 변환본</text>
  </g>

  <!-- Arrow INPUT → PM -->
  <text x="207" y="364" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#d1d5db">&#8594;</text>

  <!-- PM -->
  <g clip-path="url(#cp-pm)">
    <rect x="218" y="232" width="140" height="262" rx="10" fill="#1e40af"/>
    <text x="288" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">PM</text>
    <text x="288" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#bfdbfe">회의록 분석</text>
    <text x="288" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#bfdbfe">액션아이템 추출</text>
    <text x="288" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#bfdbfe">담당자 분류</text>
    <text x="288" y="350" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#bfdbfe">Notion DB 등록</text>
    <text x="288" y="380" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#93c5fd">5개 task 생성</text>
  </g>

  <!-- Arrow PM → Notion -->
  <text x="365" y="334" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#d1d5db">&#8594;</text>

  <!-- Notion DB -->
  <g clip-path="url(#cp-notion)">
    <rect x="376" y="305" width="120" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="436" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">Notion</text>
    <text x="436" y="346" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#15803d">Work DB</text>
  </g>

  <!-- Fan-out lines from Notion DB right edge to 5 agents -->
  <!-- Notion DB right edge: x=496, y=331 (center) -->
  <line x1="496" y1="331" x2="550" y2="255" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="496" y1="331" x2="550" y2="309" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="496" y1="331" x2="550" y2="363" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="496" y1="331" x2="550" y2="417" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="496" y1="331" x2="550" y2="471" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Agent boxes (x=550, w=158, h=46, gap=8) -->
  <!-- 박부장: y=232 -->
  <g clip-path="url(#cp-a1)">
    <rect x="550" y="232" width="158" height="46" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="629" y="252" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">박부장 (마케팅)</text>
    <text x="629" y="270" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">시장조사 + 경쟁사 분석 → Sheets</text>
  </g>

  <!-- 이과장: y=286 -->
  <g clip-path="url(#cp-a2)">
    <rect x="550" y="286" width="158" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="629" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#14532d">이과장 (마케팅)</text>
    <text x="629" y="324" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">인플루언서 리스트 + 예산안 → Gmail</text>
  </g>

  <!-- 정대리: y=340 -->
  <g clip-path="url(#cp-a3)">
    <rect x="550" y="340" width="158" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="629" y="360" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">정대리 (개발)</text>
    <text x="629" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">개발 일정표 + 외주 컨택 → Sheets</text>
  </g>

  <!-- 최주임: y=394 -->
  <g clip-path="url(#cp-a4)">
    <rect x="550" y="394" width="158" height="46" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="629" y="414" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#581c87">최주임 (디자인)</text>
    <text x="629" y="432" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">AI 이미지 시안 → Drive (SD3)</text>
  </g>

  <!-- 김대표: y=448 -->
  <g clip-path="url(#cp-a5)">
    <rect x="550" y="448" width="158" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="629" y="468" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#7c2d12">김대표 (경영)</text>
    <text x="629" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">이사회 보고서 + 발표자료 → Slides</text>
  </g>

  <!-- Arrow agents → OUTPUT -->
  <text x="718" y="364" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#d1d5db">&#8594;</text>

  <!-- OUTPUT -->
  <g clip-path="url(#cp-output)">
    <rect x="730" y="232" width="490" height="262" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="975" y="262" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">산출물 (동시 완성)</text>
    <line x1="750" y1="272" x2="1210" y2="272" stroke="#e2e8f0" stroke-width="1"/>
    <text x="750" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">- 시장조사 구글 시트</text>
    <text x="750" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">- 인플루언서 리스트 + 예산안 이메일</text>
    <text x="750" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">- 개발 일정표 + 외주사 컨택 이메일</text>
    <text x="750" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">- 제품 이미지 시안 PNG (AI 생성)</text>
    <text x="750" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">- 이사회 보고서 + 발표자료 Slides</text>
    <line x1="750" y1="418" x2="1210" y2="418" stroke="#e2e8f0" stroke-width="1"/>
    <text x="750" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#15803d">Notion DB 상태: 전체 완료</text>
    <text x="750" y="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">메모에 각 결과 링크 기록</text>
    <text x="750" y="482" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">소요: 회의록 투입 후 약 5분</text>
  </g>

  <!-- Yellow note -->
  <rect x="60" y="514" width="1160" height="34" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="536" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e">Step5 notion-api + Step6 각 SKILL.md + 오늘 만든 PM Work DB — 이 세 가지가 조립된 결과입니다</text>

  <rect x="60" y="562" width="1160" height="50" rx="10" fill="#2563eb"/>
  <text x="640" y="592" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">회의록 하나 → 5명이 동시에 자기 일 → 모든 산출물 완성</text>
</svg>
