<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 준비 — Notion에 오늘 task 4개 등록</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">4가지 케이스를 각 1개씩 오늘 날짜로 등록합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">등록할 task 목록 (마감일 = 오늘, 상태 = 시작 전)</text>
  <rect x="60" y="268" width="1160" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="80" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">케이스 1 — 캘린더</text>
  <text x="250" y="292" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">"팀장님과 신규 프로젝트 킥오프 미팅 일정 확인"</text>
  <text x="80" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Work DB | 유형: 미팅</text>
  <rect x="60" y="334" width="1160" height="56" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="80" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">케이스 2 — 데이터랩</text>
  <text x="270" y="358" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">"경쟁사 AI 도구 도입 사례 조사"</text>
  <text x="80" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Work DB | 유형: 리서치</text>
  <rect x="60" y="400" width="1160" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="80" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">케이스 3 — 시트</text>
  <text x="250" y="424" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">"이번달 업무 성과 정리 시트 작성"</text>
  <text x="80" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Work DB | 유형: 문서</text>
  <rect x="60" y="466" width="1160" height="56" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="80" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9333ea">케이스 4 — 이메일</text>
  <text x="260" y="490" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">"거래처 담당자에게 프로젝트 진행 현황 이메일 발송"</text>
  <text x="80" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Work DB | 유형: 이메일</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">4개 모두 마감일 = 오늘, 상태 = 시작 전 으로 설정</text>
</svg>
