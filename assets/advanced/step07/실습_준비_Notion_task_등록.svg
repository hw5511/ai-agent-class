  <text x="690" y="282" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">팀장님과 신규 프로젝트 킥오프 미팅 일정 확인</text>
  <text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ reference/meeting.md 절차 실행</text>
