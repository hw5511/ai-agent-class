<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <rect x="148" y="44" width="96" height="24" rx="12" fill="#16a34a"/>
  <text x="196" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">1라운드</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">1라운드 준비 — 템플릿 복제 + 더미 데이터 확인</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">강사 템플릿을 Duplicate하면 더미 task 9개가 이미 준비됩니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 왼쪽: 복제 방법 -->
  <text x="60" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">복제 방법</text>
  <rect x="60" y="260" width="520" height="270" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="80" y="278" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="295" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="116" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">아래 템플릿 링크 열기</text>
  <rect x="80" y="312" width="480" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="290" y="333" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2563eb">notion.so/345ea273...</text>
  <rect x="80" y="360" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="377" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="116" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">오른쪽 상단 ··· → Duplicate 클릭</text>
  <rect x="80" y="400" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="417" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="116" y="417" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">내 워크스페이스로 이동 후 Work DB 확인</text>
  <rect x="80" y="442" width="24" height="24" rx="12" fill="#2563eb"/>
  <text x="92" y="459" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="116" y="459" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">더미 task 마감일을 오늘로 수정</text>
  <text x="320" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">( 상태 = 시작 전 확인 )</text>

