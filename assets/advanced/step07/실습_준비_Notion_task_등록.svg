  <text x="640" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">리서치</text>
  <text x="700" y="344" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">경쟁사 AI 도구 도입 사례 조사</text>
  <text x="640" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ reference/research.md 절차 실행</text>
  <rect x="620" y="384" width="600" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="640" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">문서</text>
  <text x="680" y="406" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">이번달 업무 성과 정리 시트 작성</text>
  <text x="640" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ reference/docs.md 절차 실행</text>
  <rect x="620" y="446" width="600" height="52" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="640" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9333ea">이메일</text>
  <text x="695" y="468" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">거래처 담당자에게 진행 현황 이메일 발송</text>
  <text x="640" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ reference/email.md 절차 실행</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">복제 완료 + 더미 task 마감일 오늘로 수정 → 다음 슬라이드에서 실습 명령 실행</text>
</svg>
