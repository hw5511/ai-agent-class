<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">reference/ 라우팅 — 유형별 처리 방법</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">처리 절차는 유형별 문서로 쪼개고, SKILL.md 에는 어느 문서를 볼지만 적습니다</text>
  <line x1="60" y1="200" x2="1220" y2="200" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스킬 폴더 구조</text>
  <rect x="60" y="242" width="560" height="222" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="276" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#374151">.claude/skills/notion-work/</text>
  <text x="92" y="302" font-family="'Courier New',Courier,monospace" font-size="13" fill="#1d4ed8">├── SKILL.md</text>
  <text x="300" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">라우팅 표만 — 짧게 유지</text>
  <text x="92" y="328" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">└── reference/</text>
  <text x="116" y="354" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── meeting.md</text>
  <text x="300" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">미팅 → 캘린더 등록 절차</text>
  <text x="116" y="380" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── research.md</text>
  <text x="300" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">리서치 → 데이터랩 조사 절차</text>
  <text x="116" y="406" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">├── docs.md</text>
  <text x="300" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">문서 → 시트 생성 절차</text>
  <text x="116" y="432" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">└── email.md</text>
  <text x="300" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">이메일 → 메일 작성·발송 절차</text>

  <text x="660" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">SKILL.md 안에 들어가는 라우팅</text>
  <rect x="660" y="242" width="560" height="222" rx="8" fill="#0f172a"/>
  <text x="684" y="274" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">## 유형별 처리 라우팅</text>
  <text x="684" y="300" font-family="'Courier New',Courier,monospace" font-size="12" fill="#94a3b8">task 의 '유형' 속성을 읽고 아래 문서를 열어</text>
  <text x="684" y="320" font-family="'Courier New',Courier,monospace" font-size="12" fill="#94a3b8">그 절차대로 실행한다.</text>
  <text x="684" y="356" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e2e8f0">- 유형 = 미팅</text>
  <text x="856" y="356" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">&#8594; reference/meeting.md</text>
  <text x="684" y="380" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e2e8f0">- 유형 = 리서치</text>
  <text x="856" y="380" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">&#8594; reference/research.md</text>
  <text x="684" y="404" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e2e8f0">- 유형 = 문서</text>
  <text x="856" y="404" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">&#8594; reference/docs.md</text>
  <text x="684" y="428" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e2e8f0">- 유형 = 이메일</text>
  <text x="856" y="428" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">&#8594; reference/email.md</text>
  <text x="684" y="452" font-family="'Courier New',Courier,monospace" font-size="12" fill="#94a3b8">처리 전 상태 = '진행 중', 완료 후 = '완료'</text>

  <rect x="60" y="486" width="1160" height="66" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="84" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e">SKILL.md 는 항상 읽히지만 reference/ 문서는 해당 유형을 만났을 때만 열립니다 — 컨텍스트를 아끼고, 절차를 고치기도 쉽습니다</text>
  <text x="84" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e">유형이 늘어나면 reference/ 에 문서 한 장을 추가하고 SKILL.md 라우팅에 한 줄만 더하면 됩니다</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">스킬 1개 + 유형별 문서 4장 — 이제 한 마디로 오늘 할 일이 전부 처리됩니다</text>
</svg>
