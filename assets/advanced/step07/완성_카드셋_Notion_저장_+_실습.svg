  <text x="60" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#6b7280">인스타그램에 업로드 가능한 1080×1080 카드셋이 Notion에 저장됩니다</text>
