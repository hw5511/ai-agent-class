  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">CLAUDE.md에 Channel/Stage -&gt; 스킬 매핑 규칙으로 작성합니다</text>
