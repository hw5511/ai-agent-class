<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">CLAUDE.md 처리 규칙 작성</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">분류 규칙 + Status 업데이트 규칙을 하나의 지시문으로 통합합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="60" y="232" width="1160" height="290" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="264" font-family="'Courier New',Courier,monospace" font-size="14" fill="#171717">## PM 에이전트 처리 규칙</text>
  <text x="80" y="292" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151"></text>
  <text x="80" y="314" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">'Work에서 오늘 처리해야 하는 것들 찾아서 처리해줘' 명령 수신 시:</text>
  <text x="80" y="338" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">1. notion-work 스킬로 오늘 마감일인 Work DB task 목록 조회</text>
  <text x="80" y="362" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">2. 각 task를 순서대로 처리 (처리 전 상태='진행 중', 완료 후 상태='완료')</text>
  <text x="80" y="386" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151"></text>
  <text x="80" y="408" font-family="'Courier New',Courier,monospace" font-size="13" fill="#171717">task 유형별 실행 스킬:</text>
  <text x="80" y="430" font-family="'Courier New',Courier,monospace" font-size="13" fill="#2563eb">- 유형 = '미팅'   -&gt; google-calendar 스킬: 태스크명에서 일정 파악 후 캘린더 등록</text>
  <text x="80" y="452" font-family="'Courier New',Courier,monospace" font-size="13" fill="#d97706">- 유형 = '리서치' -&gt; naver-datalab 스킬: 핵심 키워드 조사 후 결과를 메모에 저장</text>
  <text x="80" y="474" font-family="'Courier New',Courier,monospace" font-size="13" fill="#16a34a">- 유형 = '문서'   -&gt; google-sheets 스킬: 관련 데이터 정리 시트 생성</text>
  <text x="80" y="496" font-family="'Courier New',Courier,monospace" font-size="13" fill="#9333ea">- 유형 = '이메일' -&gt; gmail 스킬: 태스크명 기반으로 이메일 작성 후 발송</text>
  <text x="80" y="518" font-family="'Courier New',Courier,monospace" font-size="13" fill="#dc2626">3. 오류 발생 시: 메모에 '[오류] 사유' 기록 후 상태는 그대로 두고 다음 task 진행</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">이 지시문 하나로 PM 에이전트 전체 동작이 정의됩니다</text>
</svg>
