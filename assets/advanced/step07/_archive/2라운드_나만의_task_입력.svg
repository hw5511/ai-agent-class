<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <rect x="148" y="44" width="96" height="24" rx="12" fill="#f59e0b"/>
  <text x="196" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">2라운드</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">2라운드 준비 — 나만의 task 직접 입력</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">1라운드 완료 후 내 실제 업무 상황에 맞는 task 4개를 직접 등록합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 왼쪽: 입력 방법 -->
  <text x="60" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">입력 방법</text>
  <rect x="60" y="260" width="520" height="230" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="80" y="278" width="24" height="24" rx="12" fill="#f59e0b"/>
  <text x="92" y="295" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="116" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">내 Work DB에서 + New 클릭</text>
  <rect x="80" y="316" width="24" height="24" rx="12" fill="#f59e0b"/>
  <text x="92" y="333" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="116" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">task명, 유형, 마감일(오늘), 상태(시작 전) 입력</text>
  <rect x="80" y="354" width="24" height="24" rx="12" fill="#f59e0b"/>
  <text x="92" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="116" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">유형 4가지(미팅/리서치/문서/이메일) 각 1개씩</text>
  <rect x="80" y="392" width="24" height="24" rx="12" fill="#f59e0b"/>
  <text x="92" y="409" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="116" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">입력 완료 후 실습 명령 실행</text>
  <rect x="80" y="432" width="480" height="40" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="320" y="452" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="13" fill="#d97706">마감일 = 오늘, 상태 = 시작 전 (필수)</text>
  <text x="320" y="468" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">오늘 마감이 아니면 에이전트가 조회하지 않습니다</text>

  <!-- 오른쪽: 나만의 task 예시 -->
  <text x="620" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">나만의 task 예시 (실제 업무로 바꿔서 입력)</text>
  <rect x="620" y="260" width="600" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">미팅</text>
  <text x="690" y="282" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">ex) "오후 3시 팀 주간 미팅 일정 캘린더 등록"</text>
  <text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ 캘린더에 실제 일정이 생성됩니다</text>
  <rect x="620" y="322" width="600" height="52" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#d97706">리서치</text>
  <text x="700" y="344" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">ex) "최신 AI 마케팅 도구 트렌드 조사"</text>
  <text x="640" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ 조사 결과가 메모에 저장됩니다</text>
  <rect x="620" y="384" width="600" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="640" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#16a34a">문서</text>
  <text x="680" y="406" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">ex) "이번 주 업무 일지 구글 시트로 작성"</text>
  <text x="640" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ 구글 시트가 자동 생성됩니다</text>
  <rect x="620" y="446" width="600" height="52" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="640" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9333ea">이메일</text>
  <text x="695" y="468" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">ex) "고객사에 프로젝트 완료 보고 이메일 발송"</text>
  <text x="640" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">→ 이메일이 실제로 발송됩니다</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#fef3c7"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#d97706">내 실제 업무 task를 입력하면 에이전트가 실제로 처리합니다 — 진짜 결과물이 만들어집니다</text>
</svg>
