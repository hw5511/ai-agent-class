<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Status 자동 업데이트 설계</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Claude가 처리 전/후에 Notion Status를 직접 변경합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">CLAUDE.md Status 업데이트 규칙</text>
  <rect x="60" y="268" width="1160" height="160" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="300" font-family="'Courier New',Courier,monospace" font-size="14" fill="#171717">## Status 자동 업데이트 규칙</text>
  <text x="80" y="328" font-family="'Courier New',Courier,monospace" font-size="14" fill="#374151"></text>
  <text x="80" y="352" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">task를 처리할 때 반드시 아래 순서로 Status를 변경한다:</text>
  <text x="80" y="376" font-family="'Courier New',Courier,monospace" font-size="13" fill="#d97706">1. 처리 시작 직전 -&gt; notion-work/personal 스킬로 Status = '진행중' 변경</text>
  <text x="80" y="400" font-family="'Courier New',Courier,monospace" font-size="13" fill="#16a34a">2. 처리 완료 직후 -&gt; Status = '완료' 변경</text>
  <text x="80" y="416" font-family="'Courier New',Courier,monospace" font-size="13" fill="#dc2626">3. 오류 발생 시   -&gt; 메모에 '[오류] 사유' 기록 후 다음 task 진행</text>
  <line x1="60" y1="452" x2="1220" y2="452" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">처리 흐름 예시</text>
  <rect x="60" y="498" width="340" height="52" rx="8" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="230" y="522" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="13" fill="#854d0e">Status = "진행중" 변경</text>
  <text x="230" y="540" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">Notion API 호출</text>
  <text x="418" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#d1d5db">&#8594;</text>
  <rect x="436" y="498" width="340" height="52" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="606" y="522" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">스킬 실행 (캘린더 등록 등)</text>
  <text x="606" y="540" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">실제 작업 수행</text>
  <text x="794" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#d1d5db">&#8594;</text>
  <rect x="812" y="498" width="408" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="1016" y="522" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="13" fill="#16a34a">Status = "완료" 변경</text>
  <text x="1016" y="540" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">Notion API 호출</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">Status 규칙 덕분에 Notion이 실시간 작업 현황판이 됩니다</text>
</svg>
