<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#171717">GWS CLI Skill 문서화</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Claude가 사용법 문서를 Skill로 만들어 자연어 요청을 gws 명령으로 자동 변환합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude에게 이렇게 요청하세요</text>
  <rect x="60" y="278" width="1160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="309" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#2563eb">"gws CLI 사용법 정리해서 gws_skill.md Skill 문서로 만들어줘"</text>
  <line x1="60" y1="354" x2="1220" y2="354" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Skill 문서에 포함될 내용</text>
  <rect x="60" y="408" width="530" height="130" rx="8" fill="#f8fafc"/>
  <text x="84" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#374151">gws 핵심 명령 패턴</text>
  <text x="84" y="456" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">gws drive files list --params '{"pageSize":5}'</text>
  <text x="84" y="476" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">gws gmail messages list --params '{"q":"is:unread"}'</text>
  <text x="84" y="496" font-family="'Courier New',Courier,monospace" font-size="13" fill="#374151">gws calendar events list --calendarId primary</text>
  <rect x="630" y="408" width="590" height="130" rx="8" fill="#f8fafc"/>
  <text x="654" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#374151">수강생 자연어 → Claude가 변환</text>
  <text x="654" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">"내 드라이브 최근 파일 보여줘"</text>
  <text x="654" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">"안 읽은 메일 목록 뽑아줘"</text>
  <text x="654" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">"오늘 일정 알려줘"</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">Skill 문서 생성 후 Claude가 자연어 요청을 gws 명령으로 즉시 변환·실행합니다</text>
</svg>
