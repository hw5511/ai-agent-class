<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="700" fill="#171717">YouTube API Skill 직접 만들기</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">gws CLI가 지원하지 않는 API도 Skill로 만들면 Claude가 자연어로 사용합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">WHY  —  gws youtube는 미지원</text>
  <rect x="60" y="278" width="540" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="84" y="308" font-family="'Courier New',Courier,monospace" font-size="15" fill="#dc2626">gws youtube videos list  -->  Unknown service 'youtube'</text>
  <rect x="640" y="278" width="580" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="664" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#16a34a">해결: google-api-python-client로 Skill 직접 제작!</text>
  <line x1="60" y1="350" x2="1220" y2="350" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">PROMPT  —  Claude에게 Skill 제작 요청</text>
  <rect x="60" y="400" width="1160" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="428" font-family="'Courier New',Courier,monospace" font-size="14" fill="#1e40af">"유튜브 채널 분석 Skill을 만들어줘.</text>
  <text x="84" y="452" font-family="'Courier New',Courier,monospace" font-size="14" fill="#1e40af">gws에서 쓰는 client_secret.json을 재사용하고,</text>
  <text x="84" y="476" font-family="'Courier New',Courier,monospace" font-size="14" fill="#1e40af">google-api-python-client로 채널 정보/인기 영상/검색 기능을 넣어줘"</text>
  <line x1="60" y1="520" x2="1220" y2="520" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Claude가 자동 생성하는 파일</text>
  <text x="84" y="580" font-family="'Courier New',Courier,monospace" font-size="16" fill="#374151">youtube_skill.py   - 채널 분석 / 영상 검색 / 좋아요 조회 기능</text>
  <text x="84" y="608" font-family="'Courier New',Courier,monospace" font-size="16" fill="#374151">SKILL.md           - Claude가 사용법을 자동으로 참조하는 문서</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">gws가 안 되면 직접 만든다 = AI 에이전트 활용의 핵심</text>
</svg>
