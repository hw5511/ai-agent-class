<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">subprocess 파이프라인  +  통합 실습</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Python에서 gws를 호출해 Google 서비스를 자동화합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">gws를 Python subprocess로 호출</text>
  <text x="60" y="296" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">import subprocess, json</text>
  <text x="60" y="328" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">result = subprocess.run(</text>
  <text x="60" y="358" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">    ['gws', 'drive', 'files', 'list', '--params', '{"pageSize":5}'],</text>
  <text x="60" y="388" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">    capture_output=True, text=True, encoding='utf-8'</text>
  <text x="60" y="418" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">)</text>
  <text x="60" y="450" font-family="'Courier New',Courier,monospace" font-size="17" fill="#374151">files = json.loads(result.stdout)</text>
  <line x1="60" y1="476" x2="1220" y2="476" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">통합 실습</text>
  <text x="60" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"Drive에서 오늘 수정된 파일 목록을 Gmail로 자동 발송해줘"</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">gws + subprocess + Claude = 코드 없이 Google Workspace 자동화</text>
</svg>