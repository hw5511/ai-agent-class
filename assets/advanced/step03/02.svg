<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">GWS CLI 설치</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">gcloud + GWS CLI 두 가지를 설치합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">STEP 1  —  gcloud SDK 설치 (Windows)</text>
  <text x="60" y="296" font-family="'Courier New',Courier,monospace" font-size="18" fill="#374151">choco install gcloudsdk -y</text>
  <text x="60" y="326" font-family="'Courier New',Courier,monospace" font-size="15" fill="#6b7280">export PATH="$PATH:/c/ProgramData/chocolatey/lib/gcloudsdk/tools/google-cloud-sdk/bin"</text>
  <line x1="60" y1="356" x2="1220" y2="356" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">STEP 2  —  GWS CLI 설치 + 인증</text>
  <text x="60" y="432" font-family="'Courier New',Courier,monospace" font-size="18" fill="#374151">npm install -g @googleworkspace/cli</text>
  <text x="60" y="466" font-family="'Courier New',Courier,monospace" font-size="18" fill="#374151">gcloud auth login --launch-browser</text>
  <text x="60" y="500" font-family="'Courier New',Courier,monospace" font-size="18" fill="#374151">gcloud projects create MY-PROJECT-ID --name="gws-workspace"</text>
  <text x="60" y="534" font-family="'Courier New',Courier,monospace" font-size="18" fill="#374151">gcloud config set project MY-PROJECT-ID</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#fef3c7"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#92400e">gcloud PATH가 현재 셸에 안 보이면 export PATH로 수동 추가 필요</text>
</svg>