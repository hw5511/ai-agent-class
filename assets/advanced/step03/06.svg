  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#059669">발송된 메일을 Gmail에서 직접 열어 확인해보세요</text>
