<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="700" fill="#171717">gws auth login  —  인증 완료 확인</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">8개 서비스 스코프 인증이 완료되면 Claude가 gws 명령을 바로 사용할 수 있습니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">최종 인증 명령어</text>
  <rect x="60" y="278" width="1160" height="56" rx="8" fill="#0f172a"/>
  <text x="84" y="312" font-family="'Courier New',Courier,monospace" font-size="17" fill="#a5f3fc">gws auth login -s drive,gmail,calendar,docs,sheets,slides,forms,tasks</text>
  <line x1="60" y1="358" x2="1220" y2="358" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">브라우저 동의 화면 — Playwright가 자동 처리 (수동 진행 시 직접 클릭)</text>
  <circle cx="84" cy="430" r="14" fill="#eff6ff"/>
  <text x="84" y="436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">1</text>
  <text x="110" y="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"Google에서 확인하지 않은 앱" 경고 → 고급 클릭</text>
  <circle cx="84" cy="474" r="14" fill="#eff6ff"/>
  <text x="84" y="480" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">2</text>
  <text x="110" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">"gws CLI(으)로 이동(안전하지 않음)" 클릭</text>
  <circle cx="84" cy="518" r="14" fill="#eff6ff"/>
  <text x="84" y="524" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">3</text>
  <text x="110" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">권한 체크박스 모두 선택 → 계속 → 인증 완료</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="584" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">완료 확인:  gws auth status</text>
  <text x="640" y="604" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#2563eb">테스트:  gws drive files list --params 'pageSize'</text>
</svg>
