<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 05</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Notion DB 폴링  —  대기 항목 감지</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">notion-query로 상태=할일 항목을 주기적으로 확인합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">폴링 구조</text>
  <text x="60" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">notion-query 필터로 대기 항목 조회  →  처리  →  상태를 완료로 업데이트</text>
  <rect x="60" y="308" width="1160" height="36" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="331" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">python notion_query.py ai-tasks -f '상태=할일' -c '이름,내용'</text>
  <line x1="60" y1="364" x2="1220" y2="364" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">주기 실행</text>
  <rect x="60" y="416" width="560" height="120" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="438" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">import time</text>
  <text x="76" y="458" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">while True:</text>
  <text x="96" y="478" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">tasks = poll_tasks()</text>
  <text x="96" y="498" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">if tasks: run_workflow(tasks)</text>
  <text x="96" y="518" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">time.sleep(60)  # 60초 대기</text>
  <text x="60" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#6b7280">항목이 없으면 60초 대기 / 있으면 즉시 처리</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">항목이 없으면 60초 대기, 있으면 즉시 처리합니다</text>
</svg>