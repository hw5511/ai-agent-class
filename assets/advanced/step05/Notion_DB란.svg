<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 05</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Notion DB란?</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">표처럼 보이지만 훨씬 강력한 구조화 데이터 저장소입니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">DB가 필요한 이유</text>
  <rect x="60" y="270" width="530" height="130" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="80" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#dc2626">단순 문서 (기존 방식)</text>
  <text x="80" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">읽기는 쉽지만 검색·필터 불가</text>
  <text x="80" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">AI가 조건부로 항목을 골라낼 수 없음</text>
  <text x="80" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">자동화 연결 불가</text>
  <rect x="620" y="270" width="600" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="640" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">Notion DB (이번 방식)</text>
  <text x="640" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">상태별 필터 → AI가 '할일' 항목만 자동 조회</text>
  <text x="640" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">속성(Status, Date, Relation)으로 구조화</text>
  <text x="640" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">MCP API 연결 → 자동화 파이프라인 구성</text>
  <line x1="60" y1="422" x2="1220" y2="422" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">핵심 속성</text>
  <rect x="60" y="470" width="240" height="72" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#171717">Title (제목)</text>
  <text x="80" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">각 행의 고유 식별자</text>
  <rect x="320" y="470" width="240" height="72" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="340" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#171717">Status (상태)</text>
  <text x="340" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">할일 / 진행중 / 완료</text>
  <rect x="580" y="470" width="240" height="72" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#171717">Date (날짜)</text>
  <text x="600" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">생성·마감·업데이트 시각</text>
  <rect x="840" y="470" width="240" height="72" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="860" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#171717">Relation (관계)</text>
  <text x="860" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Tasks ↔ Docs 연결</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="591" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#2563eb">AI 에이전트는 DB의 Status 속성을 보고 어떤 행동을 할지 결정합니다</text>
  <text x="640" y="611" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#3b82f6">Status = '할일' → 자동 감지 → 워크플로우 실행 → Status = '완료'</text>
</svg>
