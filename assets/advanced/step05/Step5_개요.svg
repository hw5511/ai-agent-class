<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 05</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Step 5: Notion DB + 에이전트 연결</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">AI가 스스로 읽고 쓰는 외부 기억 장치를 만들어봅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">이번 Step에서 배우는 것</text>
  <rect x="60" y="268" width="540" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">01</text>
  <text x="116" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Notion이란 무엇인가  +  데이터베이스가 필요한 이유</text>
  <text x="116" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">AI의 외부 기억 장치로서의 Notion DB</text>
  <rect x="60" y="340" width="540" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">02</text>
  <text x="116" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Notion MCP  vs  Notion API</text>
  <text x="116" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">두 연결 방식의 차이와 이번 수업 방향</text>
  <rect x="60" y="412" width="540" height="60" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="437" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">03</text>
  <text x="116" y="437" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">API 토큰 발급  +  Integration 연결</text>
  <text x="116" y="459" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">Notion에서 API 접근 권한 설정하기</text>
  <rect x="640" y="268" width="580" height="204" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="930" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">실습 목표</text>
  <text x="670" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Claude에게 API 키를 주면</text>
  <text x="670" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Notion 조회 스킬을 자동으로 만들어줍니다</text>
  <text x="670" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">notion-query.py  자동 생성</text>
  <text x="670" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">DB 구조 파악  --&gt;  데이터 채우기</text>
  <text x="670" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">스킬 등록  --&gt;  재사용 가능</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Notion DB + API 연결을 완성하면 AI가 스스로 데이터를 다룹니다</text>
</svg>
