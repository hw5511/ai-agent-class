<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">수집 단계  —  웹 크롤링  /  API</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">RSS · 공개 API · 웹 크롤링으로 트렌드 데이터를 수집합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">방법 1  —  RSS 피드 수집</text>
  <text x="60" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">feedparser  —  뉴스·블로그 RSS를 구조화된 데이터로 파싱</text>
  <text x="60" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">키워드 필터로 관심 분야만 추출  →  JSON 파일로 저장</text>
  <line x1="60" y1="358" x2="1220" y2="358" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">방법 2  —  공개 API 활용</text>
  <text x="60" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">NewsAPI · GitHub Trending API · ADV 04 네이버 검색 API 재사용</text>
  <text x="60" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">requests 라이브러리로 데이터 수집  →  pandas로 정리</text>
  <line x1="60" y1="498" x2="1220" y2="498" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="538" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">방법 3  —  웹 크롤링</text>
  <text x="60" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">BeautifulSoup  /  Playwright  —  공개 페이지 데이터 수집</text>
  <rect x="60" y="600" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="631" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">수집 방법을 혼합해 다양한 소스에서 데이터를 확보합니다</text>
</svg>