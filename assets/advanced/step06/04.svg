<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">조사 결과  —  Notion Docs DB 저장</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">notion-create-pages로 결과 페이지를 자동 생성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">저장 구조</text>
  <text x="60" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">페이지명: 조사 주제  /  프로젝트 relation: Tasks DB 항목 연결  /  내용: 조사 결과 마크다운</text>
  <line x1="60" y1="314" x2="1220" y2="314" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">Notion MCP 호출 패턴</text>
  <rect x="60" y="360" width="1160" height="130" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="382" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"># mcp__notion__notion-create-pages 사용</text>
  <text x="76" y="402" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">mcp__notion__notion-create-pages:</text>
  <text x="96" y="422" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">data_source_id = 'Docs DB ID'</text>
  <text x="96" y="442" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">properties:</text>
  <text x="116" y="462" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">Name: topic           # 조사 주제</text>
  <text x="116" y="482" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">Status: 'active'      # 저장 상태</text>
  <text x="96" y="502" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">content: research_result   # claude -p 결과</text>
  <text x="60" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#6b7280">Notion MCP는 ADV 06 MCP 강의에서 설치한 것을 그대로 사용합니다</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">Notion Docs DB에 자동으로 조사 결과 페이지가 생성됩니다</text>
</svg>