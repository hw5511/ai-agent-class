<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">CLAUDE.md에 분류 규칙을 작성합니다</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">트리거 키워드 -&gt; DB 매핑 지시문을 자연어로 작성합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">CLAUDE.md 지시문 예시</text>
  <rect x="60" y="268" width="1160" height="250" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="300" font-family="'Courier New',Courier,monospace" font-size="15" fill="#171717">## 메모 분류 규칙</text>
  <text x="80" y="330" font-family="'Courier New',Courier,monospace" font-size="14" fill="#374151"></text>
  <text x="80" y="354" font-family="'Courier New',Courier,monospace" font-size="14" fill="#374151">사용자가 메모를 입력하면 아래 규칙에 따라 분류하고 Notion에 저장한다:</text>
  <text x="80" y="382" font-family="'Courier New',Courier,monospace" font-size="14" fill="#374151"></text>
  <text x="80" y="406" font-family="'Courier New',Courier,monospace" font-size="13" fill="#2563eb">- '개인:'으로 시작 -&gt; notion-personal 스킬 실행 -&gt; Personal Tasks DB 저장</text>
  <text x="80" y="428" font-family="'Courier New',Courier,monospace" font-size="13" fill="#d97706">- '업무:' 또는 '학교:'로 시작 -&gt; notion-work 스킬 실행 -&gt; Work Tasks DB 저장</text>
  <text x="80" y="450" font-family="'Courier New',Courier,monospace" font-size="13" fill="#16a34a">- '메모:'로 시작 -&gt; notion-notes 스킬 실행 -&gt; Notes DB 저장</text>
  <text x="80" y="472" font-family="'Courier New',Courier,monospace" font-size="13" fill="#9333ea">- '배움:'으로 시작 -&gt; notion-docs 스킬 실행 -&gt; Docs DB 저장</text>
  <text x="80" y="494" font-family="'Courier New',Courier,monospace" font-size="14" fill="#374151"></text>
  <text x="80" y="514" font-family="'Courier New',Courier,monospace" font-size="13" fill="#6b7280">저장 완료 후 '저장됨: [DB명]' 한 줄만 출력한다.</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">자연어 지시문 하나로 Claude의 행동 전체를 설계합니다</text>
</svg>
