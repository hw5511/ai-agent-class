<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">스키마란?</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">데이터베이스에 어떤 정보를 담을지 미리 정해두는 설계도입니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 비유: 엑셀 헤더 -->
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">쉬운 비유</text>
  <rect x="60" y="270" width="560" height="110" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#171717">엑셀 표의 첫 번째 행(헤더) = 스키마</text>
  <!-- 엑셀 헤더 모형 -->
  <rect x="80" y="318" width="120" height="30" rx="0" fill="#2563eb"/>
  <text x="140" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">제목</text>
  <rect x="200" y="318" width="120" height="30" rx="0" fill="#2563eb"/>
  <text x="260" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">상태</text>
  <rect x="320" y="318" width="120" height="30" rx="0" fill="#2563eb"/>
  <text x="380" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">마감일</text>
  <rect x="440" y="318" width="120" height="30" rx="0" fill="#2563eb"/>
  <text x="500" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">중요도</text>
  <text x="80" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">이 헤더 이름 목록이 바로 스키마입니다</text>

  <!-- 3가지 핵심 요소 -->
  <text x="660" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스키마의 3가지 요소</text>
  <rect x="660" y="270" width="560" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="680" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">컬럼 이름</text>
  <text x="800" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Title, Status, Due Date ...</text>
  <text x="680" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">데이터 타입</text>
  <text x="800" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">텍스트, 선택, 날짜, 숫자 ...</text>
  <text x="680" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">선택 옵션</text>
  <text x="800" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">할일 / 진행중 / 완료</text>

  <!-- 왜 스키마를 먼저 정하나 -->
  <line x1="60" y1="406" x2="1220" y2="406" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">왜 스키마를 먼저 정하나요?</text>

  <rect x="60" y="454" width="350" height="90" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="235" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#dc2626">스키마 없이 저장하면</text>
  <text x="235" y="512" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">데이터가 제각각 — 나중에</text>
  <text x="235" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">검색·정렬이 불가능해짐</text>

  <rect x="450" y="454" width="350" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="625" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#16a34a">스키마 정의 후 저장하면</text>
  <text x="625" y="512" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">구조화된 데이터 — 필터·정렬·</text>
  <text x="625" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">자동화 연결 모두 가능</text>

  <rect x="840" y="454" width="380" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="1030" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">Claude에게 스키마를 주면</text>
  <text x="1030" y="512" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">Notion DB를 자동으로 생성</text>
  <text x="1030" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">속성 하나하나 설정 불필요</text>

  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">스키마를 먼저 설계하면 Claude가 DB를 자동으로 만들어줍니다</text>
</svg>
