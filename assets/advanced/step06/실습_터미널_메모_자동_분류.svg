  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 — 터미널 메모 -&gt; Notion 자동 저장</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">트리거 키워드 입력 -&gt; Claude 분류 -&gt; 스킬 실행 -&gt; Notion 저장</text>
