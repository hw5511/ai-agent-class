  <text x="160" y="354" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">1. 입력</text>
  <text x="160" y="378" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="12" fill="#6b7280">배움: Notion API</text>
  <text x="160" y="398" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="12" fill="#6b7280">필터가 자유롭다</text>
  <text x="278" y="372" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#d1d5db">&#8594;</text>
  <rect x="296" y="268" width="200" height="200" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="396" y="354" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">2. Claude 분류</text>
  <text x="396" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">"배움:" 감지</text>
  <text x="396" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">-> Docs DB</text>
