  <text x="60" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Claude에게 스킬 4개 제작 의뢰  -&gt;  CLAUDE.md 분류 규칙 작성  -&gt;  4가지 트리거 테스트</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#2563eb"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">터미널 한 줄 입력만으로 메모가 자동 분류 저장됩니다</text>
