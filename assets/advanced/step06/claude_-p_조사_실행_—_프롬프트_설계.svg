<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#2563eb"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">ADV 06</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">claude -p 조사 실행  —  프롬프트 설계</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">ADV 04에서 만든 네이버 API Skill을 포함한 조사 프롬프트를 만듭니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">조사 프롬프트 패턴</text>
  <rect x="60" y="268" width="1160" height="160" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="290" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">topic = '리서치: AI 에이전트 최신 동향'  # Notion Tasks에서 읽어온 값</text>
  <text x="76" y="310" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151"></text>
  <text x="76" y="330" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">prompt = f'''</text>
  <text x="96" y="350" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">주제: {topic}</text>
  <text x="96" y="370" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">1. 네이버 뉴스 API로 최신 기사 5개 수집  (ADV 04 Skill 재사용)</text>
  <text x="96" y="390" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">2. 핵심 내용 요약 500자 이내</text>
  <text x="96" y="410" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">3. 인사이트 3가지  →  마크다운으로 출력</text>
  <text x="76" y="428" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">'''</text>
  <line x1="60" y1="448" x2="1220" y2="448" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">실행 코드</text>
  <rect x="60" y="488" width="1160" height="52" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="510" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#374151">result = subprocess.run(['claude', '-p', prompt], capture_output=True, text=True, encoding='utf-8').stdout</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#eff6ff"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#2563eb">ADV 04 네이버 검색 API Skill을 그대로 재사용합니다</text>
</svg>