  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">실습 A — 거래처 검증기 완성 (AI 슬롯 0개)</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">런타임 AI 없이 완결되는 파이프라인을 완성하고, 하나의 중간 데이터에서 출구 2개를 뽑아낸다.</text>
