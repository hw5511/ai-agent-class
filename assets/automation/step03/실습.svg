  <text x="60" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" fill="#374151">챗봇 껍데기는 만들지 않고 2시간 전부를 재료 손질에 쓴다. 카테고리별 건수 통계까지 확인한다.</text>
