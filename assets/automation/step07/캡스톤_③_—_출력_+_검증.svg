  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">템플릿 주입으로 출구를 완성하고, 재실행·정확도 검증을 통과한다.</text>
