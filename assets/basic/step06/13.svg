  <text x="60" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#374151">/mcp 입력  ->  notion 서버가 connected 상태이면 성공</text>
  <line x1="60" y1="334" x2="1220" y2="334" stroke="#e5e7eb" stroke-width="1"/>
