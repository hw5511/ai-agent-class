<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 05</text>
  <rect x="152" y="44" width="52" height="24" rx="12" fill="#2563eb"/>
  <text x="178" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">실습</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Hooks 실습</text>
  <text x="60" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">두 가지 Hook을 직접 설정합니다</text>
  <line x1="60" y1="196" x2="1220" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 실습 1: BurntToast PC 알림 -->
  <rect x="60" y="210" width="1160" height="218" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="60" y="210" width="6" height="218" rx="3" fill="#2563eb"/>
  <rect x="80" y="222" width="58" height="22" rx="11" fill="#2563eb"/>
  <text x="109" y="237" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">실습 1</text>
  <text x="150" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#1d40af">BurntToast PC 알림  —  응답 완료 시 윈도우 알림 팝업</text>
  <text x="80" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">1</text>
  <text x="102" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">claude 실행</text>
  <text x="80" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">2</text>
  <text x="102" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">아래 프롬프트 입력</text>
  <rect x="102" y="314" width="1090" height="44" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="647" y="341" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#1d4ed8">settings.json에 Claude 응답이 완료될 때마다 BurntToast로 PC 알림이 뜨는 Hook을 추가해줘</text>
  <text x="80" y="381" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">3</text>
  <text x="102" y="381" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">Claude에게 아무 질문 입력 후 완료 시 알림 팝업 확인</text>
  <text x="1192" y="412" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#93c5fd">Stop 이벤트</text>

  <!-- 실습 2: 위험 명령 차단 -->
  <rect x="60" y="446" width="1160" height="218" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <rect x="60" y="446" width="6" height="218" rx="3" fill="#f97316"/>
  <rect x="80" y="458" width="58" height="22" rx="11" fill="#f97316"/>
  <text x="109" y="473" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">실습 2</text>
  <text x="150" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#c2410c">위험 명령 차단  —  폴더 삭제 · 강제 리셋 실행 전 차단</text>
  <text x="80" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">1</text>
  <text x="102" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">아래 프롬프트 입력</text>
  <rect x="102" y="519" width="1090" height="44" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
  <text x="647" y="546" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#c2410c">폴더 전체 삭제 명령이나 git 강제 리셋 같은 위험한 명령 실행 전에 차단하는 Hook을 추가해줘</text>
  <text x="80" y="585" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">2</text>
  <text x="102" y="585" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">Claude에게 위험한 명령 실행 요청 후 차단 메시지 확인</text>
  <text x="80" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#9ca3af" font-weight="600">3</text>
  <text x="102" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">settings.json hooks 항목에서 차단 스크립트 내용 확인</text>
  <text x="1192" y="648" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#fdba74">PreToolUse 이벤트  —  exit 2로 차단</text>

  <!-- 하단 노트 -->
  <rect x="60" y="678" width="1160" height="28" rx="8" fill="#f3f4f6"/>
  <text x="640" y="697" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">Hook 스크립트는 Claude가 자동 작성  —  프롬프트 한 줄로 설정 완료</text>
</svg>
