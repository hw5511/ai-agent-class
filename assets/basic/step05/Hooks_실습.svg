<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 05</text>
  <rect x="152" y="44" width="52" height="24" rx="12" fill="#2563eb"/>
  <text x="178" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">실습</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Hooks 실습</text>
  <text x="60" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Stop Hook — Claude 응답이 완료되면 PC에 알림 팝업을 띄웁니다</text>
  <line x1="60" y1="196" x2="1220" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 실습: BurntToast PC 알림 -->
  <rect x="60" y="248" width="1160" height="312" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="60" y="248" width="6" height="312" rx="3" fill="#2563eb"/>
  <text x="96" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#1d40af">BurntToast PC 알림  —  응답 완료 시 윈도우 알림 팝업</text>

  <text x="96" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#9ca3af" font-weight="600">1</text>
  <text x="122" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#374151">claude 실행</text>

  <text x="96" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#9ca3af" font-weight="600">2</text>
  <text x="122" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#374151">아래 프롬프트 입력</text>
  <rect x="122" y="410" width="1064" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="654" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#1d4ed8">settings.json에 Claude 응답이 완료될 때마다 BurntToast로 PC 알림이 뜨는 Hook을 추가해줘</text>

  <text x="96" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#9ca3af" font-weight="600">3</text>
  <text x="122" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#374151">Claude에게 아무 질문 입력 후, 완료될 때 알림 팝업이 뜨는지 확인</text>

  <rect x="96" y="522" width="118" height="26" rx="13" fill="#dbeafe"/>
  <text x="155" y="540" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Stop 이벤트</text>

  <rect x="60" y="600" width="1160" height="48" rx="10" fill="#f3f4f6"/>
  <text x="640" y="629" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">BurntToast 모듈이 없으면 Claude가 Install-Module로 먼저 설치합니다</text>
</svg>
