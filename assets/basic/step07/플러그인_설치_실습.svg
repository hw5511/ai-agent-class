<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 07</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">플러그인 설치 실습</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">공식 마켓플레이스에서 직접 설치해 사용합니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">① 탐색 · 설치</text>
  <text x="60" y="296" font-family="'Courier New',Courier,monospace" font-size="18" fill="#1d4ed8">/plugin → Discover 탭에서 commit-commands 선택</text>
  <text x="60" y="330" font-family="'Courier New',Courier,monospace" font-size="18" fill="#1d4ed8">/plugin install commit-commands@claude-plugins-official</text>
  <text x="60" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">② 활성화</text>
  <text x="60" y="420" font-family="'Courier New',Courier,monospace" font-size="18" fill="#1d4ed8">/reload-plugins</text>
  <text x="60" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">③ 사용</text>
  <text x="60" y="510" font-family="'Courier New',Courier,monospace" font-size="18" fill="#1d4ed8">/commit-commands:commit 으로 커밋 자동화 체험</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#f3f4f6"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">설치한 플러그인의 스킬은 네임스페이스(plugin-name:)로 호출합니다</text>
</svg>
