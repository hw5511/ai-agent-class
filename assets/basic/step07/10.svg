<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 07</text>
  <rect x="150" y="44" width="44" height="24" rx="12" fill="#22c55e"/>
  <text x="172" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.02em">실습</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">스킬 활용 — 반복 사용과 리사이즈</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">짧은 명령 한 줄로 다양한 카드뉴스를 뽑아냅니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">호출 예시</text>
  <rect x="60" y="272" width="1160" height="136" rx="8" fill="#f8fafc"/>
  <text x="80" y="308" font-family="'Courier New',Courier,monospace" font-size="16" fill="#374151">/cardnews 배경=남색 제목="AI가 바꾸는 세상" 본문="두 줄 설명 텍스트"</text>
  <text x="80" y="340" font-family="'Courier New',Courier,monospace" font-size="16" fill="#374151">/cardnews 배경=흰색 글자=검정 제목="오늘의 뉴스" 사이즈=1080x1350</text>
  <text x="80" y="372" font-family="'Courier New',Courier,monospace" font-size="16" fill="#374151">/cardnews 배경=#FF6B35 제목="SALE 50%" 리사이즈=썸네일</text>
  <text x="80" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">  ↳ 1080x1080 원본 + 360x360 썸네일 동시 저장</text>
  <line x1="60" y1="432" x2="1220" y2="432" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">스킬 옵션 목록</text>
  <rect x="60" y="480" width="340" height="52" rx="8" fill="#f8fafc"/>
  <text x="80" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">배경색 / 글자색 / 강조색</text>
  <rect x="420" y="480" width="340" height="52" rx="8" fill="#f8fafc"/>
  <text x="440" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">폰트 크기 3종 (제목/부제/본문)</text>
  <rect x="780" y="480" width="440" height="52" rx="8" fill="#f8fafc"/>
  <text x="800" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">정렬(중앙/좌/우) / 사이즈 / 리사이즈</text>
  <rect x="60" y="568" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="599" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Skill = 반복 작업을 한 줄 명령으로 — 핵심은 재사용 가능한 자동화입니다</text>
</svg>
