<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Claude in Chrome 설치 · 사용</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#6b7280">Chrome 확장 설치 후 claude --chrome 으로 연결</text>
  <line x1="60" y1="196" x2="1220" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 설치 -->
  <text x="60" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">설치</text>
  <text x="60" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#9ca3af" font-weight="600">1</text>
  <text x="90" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">Chrome 웹스토어에서 <tspan font-weight="700">'Claude'</tspan> 확장 설치  (버전 1.0.36 이상)</text>
  <text x="60" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#9ca3af" font-weight="600">2</text>
  <text x="90" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">Claude Code 실행 시 <tspan font-family="'Courier New',Courier,monospace" font-weight="700" fill="#dc2626">--chrome</tspan> 플래그 추가</text>
  <rect x="90" y="322" width="700" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="347" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="17" fill="#1d4ed8">claude --chrome</text>

  <line x1="60" y1="388" x2="1220" y2="388" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 활성화 -->
  <text x="60" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">기본 활성화 (매번 --chrome 입력 생략)</text>
  <text x="60" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">/chrome  →  "Enabled by default" 선택</text>
  <text x="60" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#374151">/config  →  Claude in Chrome enabled by default  <tspan font-weight="700">ON</tspan></text>

  <line x1="60" y1="508" x2="1220" y2="508" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 실습 예시 -->
  <text x="60" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">실습 예시</text>
  <rect x="60" y="552" width="1160" height="52" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="640" y="579" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#0369a1">"google.com에서 'AI 에이전트' 검색하고 첫 번째 결과 제목 알려줘"</text>
  <text x="640" y="596" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">Claude가 Chrome을 실행해 검색 → 결과를 터미널에 요약</text>

  <!-- 하단 링크 박스 -->
  <rect x="60" y="628" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="659" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#ffffff">확장 설치 →  claude.com/claude-for-chrome</text>
</svg>
