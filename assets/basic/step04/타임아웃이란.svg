<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 04</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">타임아웃이란?</text>
  <text x="60" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" fill="#6b7280">Bash 명령 실행 시간 제한 — 초과 시 Foreground 작업이 강제 종료됩니다</text>
  <line x1="60" y1="212" x2="1220" y2="212" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 기본값 설명 -->
  <text x="60" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">기본 타임아웃</text>
  <text x="60" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#374151">기본값 <tspan font-family="'Courier New',Courier,monospace" fill="#dc2626">120,000ms (2분)</tspan> — 2분이 지나면 Foreground 작업 강제 종료</text>
  <line x1="60" y1="318" x2="1220" y2="318" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 해결책 2가지 -->
  <text x="60" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">해결책</text>

  <rect x="60" y="368" width="548" height="110" rx="10" fill="#eff6ff"/>
  <text x="80" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">방법 1 — 작업을 백그라운드로 전환</text>
  <text x="80" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">오래 걸리는 작업은 처음부터 백그라운드로 요청하거나</text>
  <text x="80" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">Ctrl+B 로 실행 중 전환 — 타임아웃 제한 없이 계속 실행</text>

  <rect x="632" y="368" width="548" height="110" rx="10" fill="#f0fdf4"/>
  <text x="652" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">방법 2 — settings.json에서 타임아웃 직접 설정</text>
  <text x="652" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">bash.timeout 값(ms)을 늘려서 Foreground 최대 유지 시간 조정</text>
  <text x="652" y="452" font-family="'Courier New',Courier,monospace" font-size="14" fill="#15803d">18,000,000ms = 5시간  /  3,600,000ms = 1시간</text>

  <line x1="60" y1="504" x2="1220" y2="504" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 프롬프트 예시 -->
  <text x="60" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">settings.json 적용 프롬프트</text>
  <rect x="60" y="548" width="1160" height="44" rx="8" fill="#f0fdf4"/>
  <text x="80" y="575" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#15803d">settings.json 의 bash timeout을 18000000 (5시간) 으로 설정해줘</text>

  <rect x="60" y="600" width="1160" height="44" rx="8" fill="#fefce8"/>
  <text x="80" y="627" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#92400e">긴 빌드·테스트·데이터 처리 작업은 타임아웃을 늘리거나 백그라운드로 전환하여 안전하게 실행하세요</text>
</svg>
