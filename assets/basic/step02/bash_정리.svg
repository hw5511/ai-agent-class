<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 6</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Bash 툴 정리</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">Bash 로 배운 네 가지를 정리합니다</text>
  <text x="60" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">이번 파트에서 배운 것</text>
  <text x="92" y="220" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="220" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">명령 실행</text>
  <text x="248" y="220" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">터미널 명령어를 AI 가 대신 씁니다</text>
  <text x="92" y="264" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="264" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">컴퓨터 전체</text>
  <text x="248" y="264" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">파일 안이 아니라 컴퓨터 자체를 다룹니다</text>
  <text x="92" y="308" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="308" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">설치·실행·조회</text>
  <text x="248" y="308" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">새 프로그램 설치부터 시스템 조회까지</text>
  <text x="92" y="352" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="352" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">툴 연결</text>
  <text x="248" y="352" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">다른 툴과 이어져 하나의 일을 해냅니다</text>
  <rect x="60" y="468" width="1160" height="54" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="88" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">오늘 실습을 마쳤다면 /clear 를 입력해 새 채팅방으로 정리합니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">컴퓨터를 직접 다루는 힘 — 오늘 배운 것 중 가장 강력한 툴입니다</text>
