<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 6</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">지금 폴더에 뭐가 있지?</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">파일 목록을 확인하고, 사람 말로 풀어서 설명해달라고 시킵니다</text>
  <text x="60" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트</text>
  <rect x="60" y="208" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="234" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="234" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">현재 폴더의 파일 목록을 설명해줘</text>
  <line x1="640" y1="258" x2="640" y2="287" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 283L640 298L647 283Z" fill="#1d4ed8"/>
  <text x="60" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">Bash 로 확인하고, 사람 말로 설명합니다</text>
  <rect x="60" y="338" width="1160" height="270" rx="10" fill="#1f2937"/>
  <text x="92" y="376" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Bash(dir)</text>
  <text x="92" y="404" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ 6개 항목을 찾았습니다</text>
  <line x1="92" y1="422" x2="1188" y2="422" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="452" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#67e8f9">자기소개서.txt   강아지.svg   포스터.html</text>
  <text x="92" y="480" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#67e8f9">계산기.html   테트리스.html   practice_files/</text>
  <line x1="92" y1="498" x2="1188" y2="498" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="528" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">자기소개서 초안, 강아지 그림, 포스터 웹페이지,</text>
  <text x="92" y="556" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">계산기, 테트리스 게임까지 — 지금까지 만든 게</text>
  <text x="92" y="584" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">다 있네요. practice_files 폴더도 그대로 있고요.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">목록만 던지지 않고, 무엇인지 풀어서 설명해준다는 게 핵심입니다</text>
</svg>
