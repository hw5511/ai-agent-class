<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 2</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">CLAUDE.md 란?</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">에이전트에게 매번 말하지 않아도 되는 상시 지시서</text>
  <rect x="60" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="190" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="224" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">매번 말하기 (반복)</text>
  <rect x="84" y="262" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="104" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">"너는 ㅇㅇ야"</text>
  <text x="104" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">"~요를 ~용용으로 붙여"</text>
  <text x="104" y="338" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">"그 말투 잊지 마"</text>
  <text x="104" y="362" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">... 새 대화마다 다시 설명</text>
  <text x="84" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">대화가 끝나면 사라진다</text>
  <rect x="660" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="190" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="224" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">CLAUDE.md 파일 하나</text>
  <rect x="684" y="262" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="704" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">이름: 'ㅇㅇ'</text>
  <text x="704" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">역할: ai 에이전트 수업 도우미</text>
  <text x="704" y="338" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">말투: ~요 → ~용용</text>
  <text x="704" y="362" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">한 번만 적으면 끝</text>
  <text x="684" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">세션이 시작될 때마다 자동으로 읽힌다</text>
  <rect x="60" y="534" width="1160" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="564" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">즉, CLAUDE.md 는 매번 타이핑하던 지시를 파일로 옮겨 "항상 켜진 규칙"으로 만든 것입니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">대화마다 반복해서 시키던 것을 파일 하나에 적어두는 것입니다</text>
</svg>
