  <text x="1041.3333333333333" y="300.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#15803d">고치고</text>
  <text x="1041.3333333333333" y="328.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#15803d">마음에 안 드는 부분을 다시 요청합니다</text>
