  <text x="238.66666666666666" y="328.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1d4ed8">일단 결과물을 만듭니다</text>
  <line x1="427.3333333333333" y1="310.0" x2="442.3333333333333" y2="310.0" stroke="#6b7280" stroke-width="2.5"/>
