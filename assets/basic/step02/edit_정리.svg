<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Edit 툴 정리</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">오늘 배운 Edit 툴을 정리합니다</text>
  <text x="60" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">기억할 점</text>
  <rect x="60" y="204" width="1160" height="40" rx="8" fill="#f8fafc"/>
  <text x="88" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#0a0a0a">① Write 는 새로 만들기, Edit 는 있는 것 고치기</text>
  <rect x="60" y="258" width="1160" height="40" rx="8" fill="#f8fafc"/>
  <text x="88" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#0a0a0a">② 고칠 부분만 바뀌고 나머지는 그대로</text>
  <rect x="60" y="312" width="1160" height="40" rx="8" fill="#f8fafc"/>
  <text x="88" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#0a0a0a">③ 만들고 → 보고 → 고치고 를 반복해 완성합니다</text>
  <rect x="60" y="366" width="1160" height="40" rx="8" fill="#f8fafc"/>
  <text x="88" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#0a0a0a">④ 말로 고칠 수 있으니 코드를 몰라도 다듬을 수 있습니다</text>
  <rect x="60" y="440" width="1160" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="88" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">/clear 로 정리하고 다음 실습으로</text>
  <text x="88" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">/clear 는 지금 채팅방을 나가고 새 채팅방으로 가는 것입니다.</text>
</svg>
