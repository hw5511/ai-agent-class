<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 02</text>
  <rect x="150" y="44" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d1d5db" stroke-width="1"/>
  <text x="176" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#d97706">실습</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="36" font-weight="700" fill="#171717">Bash 실습</text>
  <line x1="60" y1="160" x2="1220" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 실습 항목 1 -->
  <rect x="60" y="172" width="560" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="82" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">1  폴더 생성</text>
  <text x="82" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">'work 폴더를 만들고 그 안에 docs 폴더도 만들어줘'</text>
  <!-- 실습 항목 2 -->
  <rect x="660" y="172" width="560" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="682" y="195" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">2  이동 · 복사 · 제거</text>
  <text x="682" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">'note.txt를 docs 폴더로 이동' / '복사해서 backup.txt로' / '삭제해줘'</text>
  <!-- 실습 항목 3 -->
  <rect x="60" y="238" width="560" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="82" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">3  크롬 실행 — 특정 페이지 열기</text>
  <text x="82" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">'크롬으로 https://news.naver.com/ 열어줘'</text>
  <!-- 실습 항목 4 -->
  <rect x="660" y="238" width="560" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="682" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">4  특정 폴더 열기</text>
  <text x="682" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">'C:\i-agent 폴더를 탐색기로 열어줘'</text>
  <!-- 연습해보세요 섹션 -->
  <rect x="60" y="308" width="120" height="22" rx="11" fill="#059669"/>
  <text x="120" y="323" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">연습해보세요</text>
  <rect x="60" y="336" width="1160" height="312" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <line x1="640" y1="346" x2="640" y2="638" stroke="#d1fae5" stroke-width="1"/>
  <text x="80" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• '카카오톡 실행해줘'</text>
  <text x="80" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">  (C:\Program Files (x86)\Kakao\KakaoTalk\KakaoTalk.exe)</text>
  <text x="80" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• 'BurntToast로 토스트 알림 보내줘 — 내용: 실습 완료!'</text>
  <text x="80" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• '현재 폴더의 파일 목록을 보여줘'</text>
  <text x="80" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• 'Python 스크립트(dice.py)를 실행해줘'</text>
  <text x="655" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• 'Python Tkinter 클리커 게임 만들어서 바로 실행해줘'</text>
  <text x="655" y="397" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• '크롬으로 유튜브 열어줘'</text>
  <text x="655" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• '바탕화면에 메모장 바로가기 만들어줘'</text>
  <text x="655" y="461" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">• '현재 시스템 정보(OS, RAM, CPU)를 알려줘'</text>
  <!-- 하단 박스 -->
  <rect x="60" y="660" width="1160" height="48" rx="10" fill="#f3f4f6"/>
  <text x="640" y="690" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">Bash 명령어를 몰라도 됩니다 — 원하는 동작을 말로 설명하면 됩니다</text>
</svg>
