<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 3</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Read 툴 정리</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">Read 로 배운 네 가지를 정리합니다</text>
  <text x="60" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">이번 파트에서 배운 것</text>
  <text x="92" y="208" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="208" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">직접 읽기</text>
  <text x="248" y="208" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">Read 는 텍스트 · 이미지 · PDF 를 직접 열어 읽습니다</text>
  <text x="92" y="248" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="248" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">드래그&amp;드롭</text>
  <text x="248" y="248" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">파일이나 폴더를 건네면 그대로 전달됩니다</text>
  <text x="92" y="288" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="288" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">이름 짓기</text>
  <text x="248" y="288" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">읽었기 때문에 내용에 맞는 이름을 지을 수 있습니다</text>
  <text x="92" y="328" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="328" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">동일 방식</text>
  <text x="248" y="328" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">파일 하나든 폴더 전체든 방식은 같습니다</text>
  <rect x="60" y="372" width="1160" height="104" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="88" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">/clear 로 정리하고 다음으로</text>
  <text x="88" y="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">/clear 는 지금 채팅방을 나가고 새 채팅방으로 가는 것입니다.</text>
  <text x="88" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">입력하면 대화를 정리하고 다음 실습으로 이어갑니다.</text>
  <rect x="60" y="512" width="1160" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">다음 시간</text>
  <text x="88" y="568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">에이전트가 파일을 직접 만드는 Write 툴을 다룹니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">파일 하나든 폴더 전체든, 원리는 같습니다</text>
</svg>
