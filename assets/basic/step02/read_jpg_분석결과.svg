  <text x="92" y="519" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#67e8f9">따뜻한 자연광 아래 찍은 요리 재료</text>
  <text x="92" y="543" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#67e8f9">사진으로 보입니다.</text>
