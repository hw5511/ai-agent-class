  <text x="92" y="303" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">나무 도마 위에 적양파를 반으로 잘라</text>
  <text x="92" y="327" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">올려두었습니다.</text>
