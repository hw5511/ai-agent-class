  <text x="92" y="375" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#6b7280">뒤쪽에는 파슬리·파스닙·양배추·당근 같은</text>
  <text x="92" y="399" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#6b7280">채소들이 놓여 있습니다.</text>
