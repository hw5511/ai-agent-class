  <text x="84" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">내용을 확인했습니다</text>
  <rect x="668" y="210" width="552" height="170" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
