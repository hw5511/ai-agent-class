<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 3</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">압축 풀기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">agent1 폴더 안에서 zip을 풀면 practice_files 폴더가 생깁니다</text>
  <rect x="60" y="200" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="200" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="234" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Windows</text>
  <rect x="84" y="272" width="512" height="106" rx="8" fill="#1f2937"/>
  <text x="104" y="300" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">read_practice.zip 우클릭</text>
  <text x="104" y="324" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">→ "압축 풀기"</text>
  <text x="104" y="348" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">(또는 "모두 압축 해제")</text>
  <text x="84" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">practice_files 폴더가 같은 자리에 생깁니다</text>
  <rect x="660" y="200" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="200" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="234" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS</text>
  <rect x="684" y="272" width="512" height="106" rx="8" fill="#1f2937"/>
  <text x="704" y="300" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">read_practice.zip 더블클릭</text>
  <text x="704" y="324" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">→ 자동으로 압축 해제</text>
  <text x="704" y="348" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">(별도 메뉴 없음)</text>
  <text x="684" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">더블클릭 한 번으로 practice_files 폴더가 생깁니다</text>
  <rect x="60" y="520" width="1160" height="78" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="88" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#78350f">압축을 풀면 zip 파일과 같은 자리에 practice_files 폴더가 새로 생깁니다.</text>
  <text x="88" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#78350f">이 폴더가 agent1 폴더 안에 있는지 다시 한번 확인하세요.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">위치는 상관없습니다 — agent1 폴더 안이기만 하면 됩니다</text>
</svg>
