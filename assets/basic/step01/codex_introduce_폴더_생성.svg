<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a">introduce 폴더 만들기</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">현재 codex 폴더 아래에 새 폴더를 만들어 달라고 요청합니다</text>

  <rect x="60" y="180" width="1160" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.6">요청 문장</text>
  <text x="88" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#111827">현재 폴더에 'introduce' 폴더를 만들어줘.</text>

  <rect x="60" y="306" width="1160" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="306" width="1160" height="38" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="330" width="1160" height="14" fill="#f3f4f6"/>
  <text x="86" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563">Codex CLI · 폴더 생성</text>
  <rect x="86" y="362" width="1068" height="56" rx="8" fill="#374151"/>
  <text x="108" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#bfdbfe">사용자</text>
  <text x="108" y="407" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#f9fafb">현재 폴더에 'introduce' 폴더를 만들어줘.</text>
  <rect x="86" y="434" width="1068" height="72" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="109" cy="458" r="6" fill="#22c55e"/>
  <text x="128" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#15803d">완료</text>
  <text x="108" y="489" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">introduce 폴더를 codex 작업 폴더 안에 만들었습니다.</text>

  <rect x="86" y="522" width="1068" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <path d="M113 539h13l4 4v14h-17z" fill="#facc15" stroke="#eab308" stroke-width="0.8"/>
  <text x="142" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#374151">codex</text>
  <path d="M171 539h14l4 4v14h-18z" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="201" y="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">introduce</text>
  <text x="640" y="652" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">폴더가 codex 폴더 안에 만들어졌는지 탐색기에서도 살펴봅니다</text>
