  <text x="177" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 터미널 입력 설정</text>
  <rect x="140" y="118" width="1000" height="520" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M150 119h980a9 9 0 0 1 9 9v23H141v-23a9 9 0 0 1 9-9z" fill="#f3f4f6"/>
<circle cx="162" cy="135" r="5" fill="#ef4444"/><circle cx="180" cy="135" r="5" fill="#f59e0b"/><circle cx="198" cy="135" r="5" fill="#22c55e"/>
<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >Claude Code · 터미널 입력 설정</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="187" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="500" fill="#f3f4f6" >Claude Code의 권장 터미널 설정을 적용할까요?</text><text x="172" y="226" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#cbd5e1" >Shift + Enter를 줄 바꿈으로 사용할 수 있습니다.</text><text x="172" y="252" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#9ca3af" >입력과 편집을 편하게 해주는 설정입니다.</text><rect x="166" y="292" width="826" height="35" rx="4" fill="#1d4ed8"/><text x="186" y="316" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="600" fill="#ffffff" >&gt;  1. 예, 권장 설정 사용</text><text x="186" y="354" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#d1d5db" >   2. 아니요, 나중에 /terminal-setup으로 설정</text><text x="172" y="413" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#93c5fd" >Enter 선택     Esc 건너뛰기</text><line x1="172" y1="452" x2="1098" y2="452" stroke="#4b5563"/><text x="172" y="492" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#9ca3af" >이 설정은 CLI의 터미널 입력 동작을 조정합니다.</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">권장 설정을 선택하거나 필요하면 나중에 적용할 수 있습니다.</text>
</svg>

