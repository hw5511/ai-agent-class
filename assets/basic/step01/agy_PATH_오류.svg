  <text x="177" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">agy 명령을 찾을 수 없을 때</text>
  <rect x="140" y="118" width="1000" height="520" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M150 119h980a9 9 0 0 1 9 9v23H141v-23a9 9 0 0 1 9-9z" fill="#f3f4f6"/>
<circle cx="162" cy="135" r="5" fill="#ef4444"/><circle cx="180" cy="135" r="5" fill="#f59e0b"/><circle cx="198" cy="135" r="5" fill="#22c55e"/>
<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >PowerShell · 에이전트1</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="190" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="400" fill="#e5e7eb" >PS C:\Users\student\에이전트1&gt; agy --version</text><text x="172" y="228" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15.5" font-weight="400" fill="#f87171" >agy : 'agy' 용어를 cmdlet 또는 실행할 수 있는 프로그램으로</text><text x="172" y="254" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15.5" font-weight="400" fill="#f87171" >인식하지 못합니다. 이름이나 경로를 확인한 뒤 다시 시도하십시오.</text><text x="172" y="302" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="600" fill="#fca5a5" >CommandNotFoundException</text><rect x="164" y="352" width="910" height="118" rx="8" fill="#1f2937" stroke="#374151"/><text x="190" y="389" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#93c5fd" >원인</text><text x="190" y="421" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#e5e7eb" >설치는 성공했지만, 현재 PowerShell 프로세스가</text><text x="190" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#e5e7eb" >%LOCALAPPDATA%\agy\bin 경로를 아직 읽지 못한 상태입니다.</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">실행 파일 설치 성공과 현재 셸의 PATH 반영은 별개의 단계입니다.</text>
</svg>

