<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <rect x="228" y="44" width="102" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="279" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#92400e">안 될 때만</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">알아서 찾아서 PATH에 등록하기</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">경로를 외울 필요 없이, 세 CLI 를 직접 찾아 사용자 PATH 에 넣어 줍니다</text>

  <text x="60" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">하는 일 — 세 단계</text>
  <rect x="60" y="198" width="373" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="92" cy="228" r="14" fill="#eff6ff"/>
  <text x="92" y="233" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#2563eb">1</text>
  <text x="118" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">이미 되는 건 건너뜁니다</text>
  <text x="84" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">PATH 에 이미 있으면 아무것도 하지</text>
  <text x="84" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">않습니다.</text>

  <rect x="453" y="198" width="373" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="485" cy="228" r="14" fill="#eff6ff"/>
  <text x="485" y="233" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#2563eb">2</text>
  <text x="511" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">실행 파일을 찾습니다</text>
  <text x="477" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">기본 설치 위치를 먼저 보고, 없으면</text>
  <text x="477" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">홈 폴더를 뒤져서 찾아냅니다.</text>

  <rect x="846" y="198" width="374" height="92" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="878" cy="228" r="14" fill="#dcfce7"/>
  <text x="878" y="233" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">3</text>
  <text x="904" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">중복 없이 등록합니다</text>
  <text x="870" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#166534">여러 번 실행해도 같은 경로가 두 번</text>
  <text x="870" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#166534">들어가지 않습니다.</text>

  <text x="60" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">실행하면 이렇게 나옵니다</text>
  <rect x="60" y="344" width="1160" height="180" rx="10" fill="#1f2937"/>
  <text x="88" y="378" font-family="'Courier New',Courier,monospace" font-size="14" fill="#93c5fd">OK   agy    - 이미 PATH 에 있습니다</text>
  <text x="88" y="406" font-family="'Courier New',Courier,monospace" font-size="14" fill="#e5e7eb">FIND codex  - %LOCALAPPDATA%\Programs\OpenAI\Codex\bin</text>
  <text x="88" y="434" font-family="'Courier New',Courier,monospace" font-size="14" fill="#e5e7eb">FIND claude - %USERPROFILE%\.local\bin</text>
  <line x1="88" y1="452" x2="1192" y2="452" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="88" y="478" font-family="'Courier New',Courier,monospace" font-size="14" fill="#86efac">ADDED ...\Codex\bin | ...\.local\bin</text>
  <text x="88" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">MISS 라고 나오면 그 CLI 는 아직 설치가 안 된 것입니다 — 설치부터 다시 하세요</text>

  <rect x="60" y="546" width="1160" height="84" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <circle cx="89" cy="574" r="12" fill="#f59e0b"/>
  <text x="89" y="579" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">!</text>
  <text x="116" y="573" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">실행한 '다음에' VS Code 를 완전히 껐다 켭니다</text>
  <text x="116" y="597" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#78350f">File &gt; Exit 로 종료 → 다시 실행 → 새 터미널. macOS 는 새 터미널만 열면 됩니다.</text>
  <text x="116" y="618" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#78350f">그래도 안 되면 다음 두 장에서 경로를 직접 넣습니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">명령은 액션박스에서 통째로 복사해 붙여넣으세요</text>
</svg>
