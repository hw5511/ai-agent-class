<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">PATH 한 번에 잡기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">설치한 자리를 알아서 찾아 등록합니다. 경로를 외울 필요가 없습니다</text>

  <rect x="60" y="168" width="1160" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">액션박스의 명령을 터미널에 통째로 붙여넣으세요</text>
  <text x="88" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e40af">지금 이 터미널에 바로 반영되고, 다음에도 유지되도록 영구 등록까지 합니다</text>

  <text x="60" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">실행하면 이렇게 나옵니다</text>
  <rect x="60" y="292" width="1160" height="268" rx="10" fill="#1f2937"/>
  <text x="92" y="326" font-family="'Courier New',Courier,monospace" font-size="14" fill="#4b5563">────────────────────────────────────────────────</text>
  <text x="92" y="364" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="364" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">agy</text>
  <text x="248" y="364" font-family="'Courier New',Courier,monospace" font-size="16" fill="#4ade80">사용 가능!  1.2.5</text>
  <text x="92" y="406" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#f87171">[ ]</text>
  <text x="140" y="406" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#f87171">codex</text>
  <text x="248" y="406" font-family="'Courier New',Courier,monospace" font-size="16" fill="#f87171">아직 설치되지 않았습니다</text>
  <text x="92" y="448" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#f87171">[ ]</text>
  <text x="140" y="448" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#f87171">claude</text>
  <text x="248" y="448" font-family="'Courier New',Courier,monospace" font-size="16" fill="#f87171">아직 설치되지 않았습니다</text>
  <text x="92" y="494" font-family="'Courier New',Courier,monospace" font-size="14" fill="#4b5563">────────────────────────────────────────────────</text>
  <text x="92" y="532" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#fbbf24">1/3 확인됨.</text>

  <rect x="60" y="578" width="1160" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="612" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#374151">지금은 agy 하나만 초록이면 됩니다. codex 와 claude 는 곧 설치합니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">버전이 찍히면 진짜 실행되는 것까지 확인된 것입니다</text>
</svg>
