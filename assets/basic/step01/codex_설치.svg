<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Codex CLI 설치</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">두 번째 설치입니다. 이것까지 끝나면 PATH 를 한 번에 정리합니다</text>
  <rect x="60" y="172" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="172" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="206" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Windows · PowerShell</text>
  <rect x="84" y="244" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="104" y="272" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">powershell -NoProfile -ExecutionPolicy ByPass -c `</text>
  <text x="104" y="296" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">  "irm https://chatgpt.com/codex/install.ps1 | iex"</text>
  <rect x="660" y="172" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="172" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="206" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS · 터미널</text>
  <rect x="684" y="244" width="512" height="58" rx="8" fill="#1f2937"/>
  <text x="704" y="272" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">curl -fsSL https://chatgpt.com/codex/install.sh | sh</text>
  <rect x="60" y="508" width="1160" height="106" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="88" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">-NoProfile 을 빼지 마세요</text>
  <text x="88" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#78350f">프로필에 StrictMode 가 켜져 있으면 설치 스크립트가 중간에 멈춥니다.</text>
  <text x="88" y="592" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#78350f">(OSArchitecture 속성을 찾을 수 없습니다 — 실제로 수업에서 났던 오류입니다)</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">설치 위치 — Windows %LOCALAPPDATA%\Programs\OpenAI\Codex\bin · macOS ~/.local/bin</text>
</svg>
