<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a">Codex CLI 설치</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">현재 터미널에서 운영체제에 맞는 공식 설치 명령을 실행합니다</text>

  <rect x="60" y="180" width="560" height="350" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="180" width="560" height="50" rx="12" fill="#eff6ff"/>
  <rect x="60" y="216" width="560" height="14" fill="#eff6ff"/>
  <text x="88" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Windows · PowerShell</text>
  <text x="88" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#4b5563">VS Code 터미널이 PowerShell인지 확인한 뒤 입력</text>
  <rect x="84" y="296" width="512" height="118" rx="8" fill="#1f2937"/>
  <text x="108" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="0.6">POWERSHELL</text>
  <text x="108" y="360" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e5e7eb">irm https://chatgpt.com/codex/</text>
  <text x="108" y="383" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e5e7eb">install.ps1 | iex</text>
  <text x="88" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">설치가 끝날 때까지 터미널을 닫지 않습니다</text>
  <rect x="88" y="477" width="188" height="28" rx="14" fill="#f3f4f6"/>
  <text x="182" y="495" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#6b7280">한 번 실행하고 기다리기</text>

  <rect x="660" y="180" width="560" height="350" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="180" width="560" height="50" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="216" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS · zsh</text>
  <text x="688" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#4b5563">VS Code 터미널이 zsh인지 확인한 뒤 입력</text>
  <rect x="684" y="296" width="512" height="118" rx="8" fill="#1f2937"/>
  <text x="708" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" letter-spacing="0.6">ZSH</text>
  <text x="708" y="360" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e5e7eb">curl -fsSL https://chatgpt.com/</text>
  <text x="708" y="383" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e5e7eb">codex/install.sh | sh</text>
  <text x="688" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">설치가 끝날 때까지 터미널을 닫지 않습니다</text>
  <rect x="688" y="477" width="188" height="28" rx="14" fill="#f3f4f6"/>
  <text x="782" y="495" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#6b7280">한 번 실행하고 기다리기</text>

  <rect x="60" y="554" width="1160" height="72" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="91" cy="590" r="15" fill="#1d4ed8"/>
  <text x="91" y="595" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">i</text>
  <text x="120" y="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#374151">설치 명령은 OS별로 다릅니다</text>
  <text x="120" y="606" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">내 컴퓨터에 해당하는 한 줄만 실행하고 완료 메시지를 확인합니다</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">Codex 설치에는 Node.js와 npm을 따로 준비할 필요가 없습니다</text>
</svg>
