<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">터미널과 AI CLI 상태</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">화면과 입력 방식으로 현재 상태를 구분합니다</text>

  <rect x="60" y="180" width="560" height="372" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="180" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="214" width="560" height="14" fill="#f3f4f6"/>
  <circle cx="86" cy="204" r="8" fill="#9ca3af"/>
  <text x="106" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">일반 터미널</text>
  <rect x="84" y="250" width="512" height="158" rx="8" fill="#1f2937"/>
  <text x="108" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.6">POWERSHELL</text>
  <text x="108" y="318" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e5e7eb">PS C:\Users\student\에이전트1&gt;</text>
  <rect x="109" y="329" width="7" height="16" fill="#93c5fd"/>
  <text x="84" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">무엇을 입력하나요?</text>
  <text x="84" y="469" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">설치·실행 명령:  <tspan font-family="'Courier New',Courier,monospace" fill="#1d4ed8">agy</tspan></text>
  <text x="84" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">실행 전에는 경로와 프롬프트가 보입니다</text>
  <rect x="84" y="512" width="204" height="24" rx="12" fill="#f3f4f6"/>
  <text x="186" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#6b7280">명령을 입력하는 출발점</text>

  <rect x="660" y="180" width="560" height="372" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="660" y="180" width="560" height="48" rx="12" fill="#eff6ff"/>
  <rect x="660" y="214" width="560" height="14" fill="#eff6ff"/>
  <circle cx="686" cy="204" r="8" fill="#3b82f6"/>
  <text x="706" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">AI CLI 실행 중</text>
  <rect x="684" y="250" width="512" height="158" rx="8" fill="#111827"/>
  <text x="708" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="0.6">ANTIGRAVITY CLI</text>
  <text x="708" y="312" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e5e7eb">안녕하세요. 무엇을 도와드릴까요?</text>
  <rect x="708" y="336" width="464" height="48" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="726" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">현재 폴더에 자기소개서를 만들어줘</text>
  <text x="684" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">무엇을 입력하나요?</text>
  <text x="684" y="469" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">자연어 작업 요청:  “너는 누구니?”</text>
  <text x="684" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">CLI 화면에서 요청하고 응답을 확인합니다</text>
  <rect x="684" y="512" width="204" height="24" rx="12" fill="#eff6ff"/>
  <text x="786" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">에이전트와 대화하는 화면</text>

  <rect x="60" y="576" width="1160" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="88" y="608" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">종료 방법</text>
  <rect x="206" y="585" width="82" height="32" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="247" y="606" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Ctrl + C</text>
  <text x="308" y="606" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">AI CLI를 끝내면 일반 터미널 프롬프트가 다시 나타납니다</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">프롬프트가 돌아온 뒤 다음 설치 명령을 입력하세요</text>
</svg>
