<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >Antigravity CLI · 약관 및 데이터 사용</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="194" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="18" font-weight="600" fill="#f3f4f6" >이용 약관 및 데이터 사용</text><text x="172" y="236" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#d1d5db" >AI 코딩 에이전트는 파일을 읽거나 수정하고 명령을 실행할 수 있습니다.</text><text x="172" y="261" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#d1d5db" >작업 내용을 확인하고, 에이전트의 변경을 살펴보세요.</text><line x1="172" y1="289" x2="1098" y2="289" stroke="#4b5563" stroke-dasharray="5 5"/><rect x="172" y="316" width="25" height="25" rx="3" fill="#111827" stroke="#93c5fd" stroke-width="2"/><text x="184" y="335" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">✓</text><text x="214" y="334" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#e5e7eb" >제품 개선을 위한 상호작용 데이터 공유에 동의합니다.</text><text x="214" y="364" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#9ca3af" >이 선택은 설정에서 나중에 변경할 수 있습니다.</text><text x="172" y="423" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#cbd5e1" >약관과 데이터 공유 선택을 확인한 뒤 진행하세요.</text><text x="172" y="484" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="500" fill="#60a5fa" >[ 이전 ]</text><rect x="270" y="461" width="94" height="34" rx="4" fill="#15803d"/><text x="317" y="483" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">완료</text><text x="172" y="552" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#93c5fd" >↑ / ↓ 이동     Space 선택     Enter 확인</text>
