<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >Claude Code · 계정 연결</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="187" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.2" font-weight="400" fill="#e5e7eb" >Claude Code는 Claude 계정 또는 API 사용 계정으로 이용할 수 있습니다.</text><text x="172" y="233" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15.5" font-weight="500" fill="#f3f4f6" >로그인 방식을 선택하세요</text><rect x="166" y="258" width="900" height="42" rx="4" fill="#1d4ed8"/><text x="187" y="285" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="600" fill="#ffffff" >&gt;  1. Claude 구독 계정</text><text x="445" y="285" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" font-weight="400" fill="#dbeafe" >개인 또는 조직 구독</text><text x="187" y="326" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#d1d5db" >   2. Anthropic Console 계정</text><text x="445" y="326" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" font-weight="400" fill="#9ca3af" >API 사용량 기준</text><text x="187" y="367" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#d1d5db" >   3. 외부 클라우드 플랫폼</text><text x="445" y="367" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" font-weight="400" fill="#9ca3af" >조직에서 제공한 연결 방식</text><line x1="172" y1="416" x2="1098" y2="416" stroke="#4b5563" stroke-dasharray="4 5"/><text x="172" y="454" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#cbd5e1" >원하는 계정 방식에 맞는 항목을 선택하세요.</text><text x="172" y="496" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#93c5fd" >↑ / ↓ 이동     Enter 확인</text>
