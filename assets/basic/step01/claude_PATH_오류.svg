<text x="172" y="190" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15.5" font-weight="400" fill="#e5e7eb" >PS C:\Users\student\에이전트1\claude&gt; claude --version</text><text x="172" y="227" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#f87171" >claude : 'claude' 명령을 실행할 수 있는 프로그램으로</text><text x="172" y="253" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#f87171" >인식하지 못합니다. 이름이나 경로를 확인한 뒤 다시 시도하십시오.</text><text x="172" y="296" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="600" fill="#fca5a5" >CommandNotFoundException</text><rect x="164" y="350" width="910" height="120" rx="8" fill="#1f2937" stroke="#374151"/><text x="190" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#93c5fd" >원인</text><text x="190" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#e5e7eb" >Claude Code는 설치됐지만 현재 PowerShell이</text><text x="190" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#e5e7eb" >%USERPROFILE%\.local\bin 경로를 아직 읽지 못했습니다.</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">설치 파일 위치와 현재 터미널의 PATH 반영 상태를 구분합니다.</text>
