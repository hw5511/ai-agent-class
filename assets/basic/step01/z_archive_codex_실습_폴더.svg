<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Codex 실습 폴더</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">Antigravity 결과와 구분되도록 에이전트1 안에 codex 폴더를 엽니다</text>

  <!-- VS Code 창 프레임 (다크 테마) -->
  <rect x="60" y="175" width="1160" height="472" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>

  <!-- 타이틀바 -->
  <path d="M60 185a10 10 0 0 1 10-10h1140a10 10 0 0 1 10 10v22H60z" fill="#2d2d2d"/>
  <circle cx="82" cy="191" r="5.5" fill="#ef4444"/>
  <circle cx="100" cy="191" r="5.5" fill="#f59e0b"/>
  <circle cx="118" cy="191" r="5.5" fill="#22c55e"/>
  <text x="640" y="195" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#cccccc">에이전트1 — Visual Studio Code</text>
  <rect x="1086" y="181" width="118" height="20" rx="4" fill="#383838" stroke="#484848" stroke-width="1"/>
  <text x="1145" y="195" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">⊞ Panel: Right</text>

  <!-- 액티비티 바 -->
  <rect x="60" y="207" width="46" height="415" fill="#252526"/>
  <line x1="106" y1="207" x2="106" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="60" y="217" width="2.5" height="28" fill="#007acc"/>
  <path d="M76 223h12v15H76z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M79 220h12v15H79z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="82" cy="265" r="5.5" fill="none" stroke="#858585" stroke-width="1.6"/>
  <line x1="86" y1="269" x2="91" y2="274" stroke="#858585" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="80" cy="298" r="2.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <circle cx="87" cy="309" r="2.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <path d="M80 300v8a3 3 0 0 0 3 3h4" fill="none" stroke="#858585" stroke-width="1.5"/>
  <circle cx="83" cy="595" r="3.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <path d="M83 589v2M83 599v2M77 595h2M87 595h2" stroke="#858585" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 좌측 탐색기 사이드바 -->
  <rect x="106" y="207" width="260" height="415" fill="#1e1e1e"/>
  <line x1="366" y1="207" x2="366" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <text x="124" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#999999" letter-spacing="0.6">EXPLORER</text>
  <path d="M124 249l4 4 4-4" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round"/>
  <text x="138" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#e1e1e1">에이전트1</text>
  <!-- agy 폴더 (접힘) -->
  <path d="M136 274l3 3-3 3" fill="none" stroke="#858585" stroke-width="1.2"/>
  <path d="M147 271h7l2 2h6v8h-15z" fill="#ca8a04" opacity="0.9"/>
  <text x="167" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#858585">agy</text>
  <!-- codex 폴더 (현재 작업 대상 강조) -->
  <rect x="110" y="293" width="250" height="28" rx="4" fill="#094771"/>
  <path d="M136 304l3 3 3-3" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
  <path d="M147 301h7l2 2h6v8h-15z" fill="#facc15"/>
  <text x="167" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">codex (작업 폴더)</text>
  <text x="124" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">선택한 폴더만 Codex의</text>
  <text x="124" y="368" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#9ca3af">현재 작업 위치로 사용합니다</text>

  <!-- 우측 본문 영역 (경로 및 안내 카드) -->
  <rect x="366" y="207" width="854" height="415" fill="#181818"/>
  <rect x="366" y="207" width="854" height="31" fill="#252526"/>
  <line x1="366" y1="238" x2="1220" y2="238" stroke="#2b2b2b" stroke-width="1"/>
  <text x="390" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">실습 폴더 경로 안내</text>

  <!-- Windows 경로 카드 -->
  <rect x="400" y="260" width="786" height="82" rx="8" fill="#252526" stroke="#333333" stroke-width="1.2"/>
  <text x="424" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Windows 작업 폴더</text>
  <text x="424" y="318" font-family="Consolas,monospace" font-size="15" fill="#e5e7eb">C:\Users\student\에이전트1</text>

  <!-- macOS 경로 카드 -->
  <rect x="400" y="360" width="786" height="82" rx="8" fill="#252526" stroke="#333333" stroke-width="1.2"/>
  <text x="424" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c084fc">macOS 작업 폴더</text>
  <text x="424" y="418" font-family="Consolas,monospace" font-size="15" fill="#e5e7eb">~/에이전트1</text>

  <!-- 안내 배너 -->
  <rect x="400" y="460" width="786" height="64" rx="8" fill="#0f2942" stroke="#0284c7" stroke-width="1.2"/>
  <text x="424" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#38bdf8">File → Open Folder 로 codex 폴더를 엽니다</text>
  <text x="424" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#93c5fd">탐색기에서 codex가 열린 상태에서 Codex CLI를 실행합니다.</text>

  <!-- 하단 상태 표시줄 (Status Bar) -->
  <path d="M60 622h1160v15a10 10 0 0 1-10 10H70a10 10 0 0 1-10-10z" fill="#007acc"/>
  <text x="74" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="500" fill="#ffffff">⑂ main*</text>
  <text x="135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">⊗ 0  ⚠ 0</text>
  <text x="640" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">Ln 1, Col 1</text>
  <text x="825" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">UTF-8</text>
  <text x="910" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">PowerShell</text>
  <text x="1135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Panel: Right ✓</text>

  <!-- 최하단 핵심 팁 -->
  <text x="640" y="682" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" fill="#6b7280">Windows와 macOS 모두 작업 폴더 이름은 codex로 맞춥니다</text>
</svg>
