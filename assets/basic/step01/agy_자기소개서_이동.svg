  <path d="M83 589v2M83 599v2M77 595h2M87 595h2" stroke="#858585" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 좌측 탐색기 사이드바 -->
  <rect x="106" y="207" width="224" height="415" fill="#1e1e1e"/>
  <line x1="330" y1="207" x2="330" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <text x="124" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#999999" letter-spacing="0.6">EXPLORER</text>
  <path d="M124 249l4 4 4-4" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round"/>
  <text x="138" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#e1e1e1">에이전트1</text>
  <path d="M136 274l3 3-3 3" fill="none" stroke="#858585" stroke-width="1.2"/>
  <path d="M147 271h7l2 2h6v8h-15z" fill="#ca8a04" opacity="0.9"/>
  <text x="167" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e5e7eb">agy</text>
  <path d="M148 299l3 3 3-3" fill="none" stroke="#cccccc" stroke-width="1.3"/>
  <path d="M158 296h6l2 2h5v7h-13z" fill="#ca8a04" opacity="0.9"/>
  <text x="176" y="303" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e5e7eb">introduce</text>
  <!-- 이동 완료된 파일 (introduce 내부로 이동됨) -->
  <rect x="146" y="318" width="180" height="24" rx="3" fill="#094771"/>
  <path d="M168 325h7l2 2v7h-9z" fill="#38bdf8"/>
  <text x="184" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">자기소개서.txt</text>
  <text x="146" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#4ade80">✔ 폴더 내부로 이동 완료</text>

  <!-- 중앙 편집기 (Editor) -->
  <rect x="330" y="207" width="410" height="415" fill="#1e1e1e"/>
  <line x1="740" y1="207" x2="740" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="330" y="207" width="410" height="31" fill="#252526"/>
  <rect x="330" y="207" width="190" height="31" fill="#1e1e1e"/>
  <rect x="330" y="207" width="190" height="2" fill="#007acc"/>
  <path d="M344 219h7l2 2v7h-9z" fill="#38bdf8" opacity="0.9"/>
  <text x="359" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#ffffff">introduce/자기소개서.txt</text>
  <text x="505" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">×</text>
  <line x1="330" y1="238" x2="740" y2="238" stroke="#2b2b2b" stroke-width="1"/>

  <g font-family="Consolas,monospace" font-size="12">
    <text x="345" y="265" fill="#6e7681">1</text><text x="368" y="265" fill="#e6edf3"># 자기소개서 (경로 이동 완료)</text>
    <text x="345" y="295" fill="#6e7681">2</text><text x="368" y="295" fill="#9cdcfe">안녕하세요!</text>
    <text x="345" y="325" fill="#6e7681">3</text><text x="368" y="325" fill="#9cdcfe">저는 Antigravity입니다.</text>
    <text x="345" y="355" fill="#6e7681">4</text><text x="368" y="355" fill="#ce9178">작업 폴더의 파일을 읽고 수정할 수 있습니다.</text>
  </g>

  <!-- 우측 패널: 터미널 (Panel Position: Right) -->
  <rect x="740" y="207" width="480" height="415" fill="#181818"/>
  <rect x="740" y="207" width="480" height="31" fill="#252526"/>
  <line x1="740" y1="238" x2="1220" y2="238" stroke="#2b2b2b" stroke-width="1"/>
  <text x="758" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">TERMINAL</text>
  <rect x="756" y="236" width="62" height="2" fill="#007acc"/>
  <text x="836" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">OUTPUT</text>
  <text x="898" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">PORTS</text>
  <rect x="1038" y="213" width="92" height="19" rx="3" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
  <text x="1048" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#38bdf8">1: pwsh</text>
  <text x="1115" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" fill="#858585">▾</text>
  <text x="1144" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#858585">+</text>
  <text x="1165" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">⌸</text>
  <text x="1185" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">×</text>

  <g font-family="Consolas,monospace" font-size="12">
    <text x="756" y="266" fill="#858585">ANTIGRAVITY CLI</text>
    <rect x="756" y="280" width="448" height="42" rx="6" fill="#252526" stroke="#484848"/>
    <text x="770" y="306" fill="#e5e7eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12">&gt; '자기소개서.txt'를 'introduce' 폴더로 옮겨줘.</text>

    <!-- 실행 결과 -->
    <rect x="756" y="336" width="448" height="50" rx="6" fill="#0f291e" stroke="#166534" stroke-width="1.2"/>
    <text x="770" y="358" fill="#4ade80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700">✔ 파일을 introduce 폴더로 이동했습니다.</text>
    <text x="770" y="376" fill="#86efac" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11">introduce\자기소개서.txt 로 이동 완료.</text>
  </g>

  <!-- 하단 상태 표시줄 (Status Bar) -->
  <path d="M60 622h1160v15a10 10 0 0 1-10 10H70a10 10 0 0 1-10-10z" fill="#007acc"/>
  <text x="74" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="500" fill="#ffffff">⑂ main*</text>
  <text x="135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">⊗ 0  ⚠ 0</text>
  <text x="640" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">Ln 1, Col 1</text>
  <text x="825" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">UTF-8</text>
  <text x="910" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">PowerShell</text>
  <text x="1135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Panel: Right ✓</text>

  <!-- 최하단 핵심 팁 -->
  <text x="640" y="682" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" fill="#6b7280">파일 이동 후 원래 위치에 파일이 남아있지 않은지 확인합니다</text>
</svg>
