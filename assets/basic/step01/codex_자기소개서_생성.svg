<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">gpt.txt 만들기</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">에이전트1 폴더에 파일을 하나 만들어 달라고 요청합니다</text>

  <!-- VS Code 창 프레임 (다크 테마) -->
  <rect x="60" y="175" width="1160" height="472" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>

  <!-- 타이틀바 -->
  <path d="M60 185a10 10 0 0 1 10-10h1140a10 10 0 0 1 10 10v22H60z" fill="#2d2d2d"/>
  <circle cx="82" cy="191" r="5.5" fill="#ef4444"/>
  <circle cx="100" cy="191" r="5.5" fill="#f59e0b"/>
  <circle cx="118" cy="191" r="5.5" fill="#22c55e"/>
  <text x="640" y="195" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#cccccc">에이전트1 — Visual Studio Code</text>
  <rect x="1086" y="181" width="118" height="20" rx="4" fill="#383838" stroke="#484848" stroke-width="1"/>
  <text x="1145" y="195" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">⊞ Panel: Right</text>

  <!-- 액티비티 바 -->
  <rect x="60" y="207" width="46" height="415" fill="#252526"/>
  <line x1="106" y1="207" x2="106" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="60" y="217" width="2.5" height="28" fill="#007acc"/>
  <path d="M76 223h12v15H76z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M79 220h12v15H79z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="82" cy="265" r="5.5" fill="none" stroke="#858585" stroke-width="1.6"/>
  <line x1="86" y1="269" x2="91" y2="274" stroke="#858585" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="80" cy="298" r="2.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <circle cx="87" cy="309" r="2.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <path d="M80 300v8a3 3 0 0 0 3 3h4" fill="none" stroke="#858585" stroke-width="1.5"/>
  <circle cx="83" cy="595" r="3.5" fill="none" stroke="#858585" stroke-width="1.5"/>
  <path d="M83 589v2M83 599v2M77 595h2M87 595h2" stroke="#858585" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 좌측 탐색기 사이드바 -->
  <rect x="106" y="207" width="224" height="415" fill="#1e1e1e"/>
  <line x1="330" y1="207" x2="330" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <text x="124" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#999999" letter-spacing="0.6">EXPLORER</text>
  <path d="M124 249l4 4 4-4" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round"/>
  <text x="138" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#e1e1e1">에이전트1</text>
  <!-- 생성된 자기소개서 파일 -->
  <rect x="110" y="273" width="216" height="24" rx="3" fill="#37373d"/>
  <path d="M148 280h8l3 3v8h-11z" fill="#38bdf8" opacity="0.8"/>
  <text x="167" y="289" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">gpt.txt</text>

  <!-- 중앙 편집기 (Editor) -->
  <rect x="330" y="207" width="410" height="415" fill="#1e1e1e"/>
  <line x1="740" y1="207" x2="740" y2="622" stroke="#2b2b2b" stroke-width="1"/>
  <rect x="330" y="207" width="410" height="31" fill="#252526"/>
  <rect x="330" y="207" width="145" height="31" fill="#1e1e1e"/>
  <rect x="330" y="207" width="145" height="2" fill="#007acc"/>
  <path d="M344 219h7l2 2v7h-9z" fill="#38bdf8" opacity="0.9"/>
  <text x="359" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#ffffff">gpt.txt</text>
  <text x="460" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">×</text>
  <line x1="330" y1="238" x2="740" y2="238" stroke="#2b2b2b" stroke-width="1"/>

  <g font-family="Consolas,monospace" font-size="12">
    <text x="345" y="265" fill="#6e7681">1</text><text x="368" y="265" fill="#e6edf3"># 자기소개서</text>
    <text x="345" y="295" fill="#6e7681">2</text><text x="368" y="295" fill="#9cdcfe">안녕하세요. 저는 Codex입니다.</text>
    <text x="345" y="325" fill="#6e7681">3</text><text x="368" y="325" fill="#ce9178">작업 폴더의 파일을 살펴보고,</text>
    <text x="345" y="355" fill="#6e7681">4</text><text x="368" y="355" fill="#ce9178">요청에 따라 문서를 작성합니다.</text>
  </g>

  <!-- 우측 패널: 터미널 (Panel Position: Right) -->
  <rect x="740" y="207" width="480" height="415" fill="#181818"/>
  <rect x="740" y="207" width="480" height="31" fill="#252526"/>
  <line x1="740" y1="238" x2="1220" y2="238" stroke="#2b2b2b" stroke-width="1"/>
  <text x="758" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">TERMINAL</text>
  <rect x="756" y="236" width="62" height="2" fill="#007acc"/>
  <text x="836" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">OUTPUT</text>
  <text x="898" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">PORTS</text>
  <rect x="1038" y="213" width="92" height="19" rx="3" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
  <text x="1048" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#38bdf8">1: pwsh</text>
  <text x="1115" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" fill="#858585">▾</text>
  <text x="1144" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#858585">+</text>
  <text x="1165" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">⌸</text>
  <text x="1185" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#858585">×</text>

  <g font-family="Consolas,monospace" font-size="12">
    <text x="756" y="266" fill="#858585">CODEX CLI</text>
    <rect x="756" y="280" width="448" height="52" rx="6" fill="#252526" stroke="#484848"/>
    <text x="770" y="302" fill="#e5e7eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5">현재 폴더에 'gpt.txt'를 만들어줘.</text>
    <text x="770" y="320" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11">네가 누구이고 무엇을 할 수 있는지 간단히 작성해줘.</text>

    <!-- 실행 결과 -->
    <rect x="756" y="346" width="448" height="50" rx="6" fill="#0f291e" stroke="#166534" stroke-width="1.2"/>
    <text x="770" y="368" fill="#4ade80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700">✔ gpt.txt를 현재 작업 폴더에 만들었습니다.</text>
    <text x="770" y="386" fill="#86efac" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11">탐색기와 편집기에서 생성된 내용을 확인하세요.</text>
  </g>

  <!-- 하단 상태 표시줄 (Status Bar) -->
  <path d="M60 622h1160v15a10 10 0 0 1-10 10H70a10 10 0 0 1-10-10z" fill="#007acc"/>
  <text x="74" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="500" fill="#ffffff">⑂ main*</text>
  <text x="135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">⊗ 0  ⚠ 0</text>
  <text x="640" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">Ln 1, Col 1</text>
  <text x="825" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">UTF-8</text>
  <text x="910" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#ffffff">PowerShell</text>
  <text x="1135" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Panel: Right ✓</text>

  <!-- 최하단 핵심 팁 -->
  <text x="640" y="682" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" fill="#6b7280">이 단계에서는 파일을 만들고 위치를 확인하는 데 집중합니다</text>
</svg>
