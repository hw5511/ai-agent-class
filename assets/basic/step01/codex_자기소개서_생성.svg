<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a">자기소개서.txt 만들기</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">현재 codex 폴더 안에 파일을 하나 만들어 달라고 요청합니다</text>

  <rect x="60" y="180" width="1160" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.6">요청 문장</text>
  <text x="88" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#111827">현재 폴더에 '자기소개서.txt'를 만들어줘.</text>
  <text x="88" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">네가 누구이고 무엇을 할 수 있는지 간단히 작성해줘.</text>

  <rect x="60" y="314" width="1160" height="282" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="314" width="1160" height="38" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="338" width="1160" height="14" fill="#f3f4f6"/>
  <text x="86" y="339" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#4b5563">Codex CLI · 작업 요청과 결과</text>
  <rect x="86" y="370" width="1068" height="58" rx="8" fill="#374151"/>
  <text x="108" y="393" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#bfdbfe">사용자</text>
  <text x="108" y="415" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#f9fafb">현재 폴더에 자기소개서.txt를 만들고, 네 소개를 간단히 작성해줘.</text>
  <rect x="86" y="444" width="1068" height="88" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="109" cy="468" r="6" fill="#22c55e"/>
  <text x="128" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#15803d">완료</text>
  <text x="108" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">자기소개서.txt를 현재 작업 폴더에 만들었습니다.</text>
  <text x="108" y="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">내용을 확인하려면 VS Code 탐색기에서 파일을 열어보세요.</text>
  <rect x="86" y="548" width="1068" height="28" rx="6" fill="#f0fdf4"/>
  <text x="108" y="567" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#15803d">작업 위치: C:\Users\student\에이전트1\codex</text>
  <text x="640" y="652" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">이 단계에서는 파일을 만들고 위치를 확인하는 데 집중합니다</text>
