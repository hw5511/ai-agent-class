<text x="172" y="190" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" >PS C:\Users\student\에이전트1&gt; irm https://antigravity.google/cli/install.ps1 | iex</text><text x="172" y="232" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="400" fill="#cbd5e1" >Antigravity CLI 설치 프로그램을 실행 중입니다...</text><text x="172" y="266" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="600" fill="#4ade80" >✓ 실행 파일 설치 완료</text><text x="194" y="294" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#d1d5db" >%LOCALAPPDATA%\agy\bin\agy.exe</text><text x="172" y="330" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="600" fill="#4ade80" >✓ 사용자 PATH에 설치 경로를 등록했습니다.</text><text x="172" y="366" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15.5" font-weight="500" fill="#fbbf24" >! 현재 터미널 세션에는 새 PATH가 아직 반영되지 않았습니다.</text><text x="172" y="414" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="16" font-weight="400" fill="#f3f4f6" >설치 성공 — 다음 단계에서 PATH를 갱신합니다.</text>
