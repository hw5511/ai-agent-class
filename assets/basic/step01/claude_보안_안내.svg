  <text x="177" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 보안 안내</text>
  <rect x="140" y="118" width="1000" height="520" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M150 119h980a9 9 0 0 1 9 9v23H141v-23a9 9 0 0 1 9-9z" fill="#f3f4f6"/>
<circle cx="162" cy="135" r="5" fill="#ef4444"/><circle cx="180" cy="135" r="5" fill="#f59e0b"/><circle cx="198" cy="135" r="5" fill="#22c55e"/>
<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >Claude Code · 보안 안내</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="188" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="17" font-weight="600" fill="#fca5a5" >보안 안내</text><line x1="172" y1="207" x2="1098" y2="207" stroke="#6b7280" stroke-dasharray="2 5"/><text x="172" y="250" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#f3f4f6" >1. AI가 항상 정확한 결과를 내는 것은 아닙니다.</text><text x="196" y="278" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#9ca3af" >파일 변경과 실행할 명령을 직접 확인하세요.</text><text x="172" y="329" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#f3f4f6" >2. 신뢰할 수 있는 코드와 작업 폴더에서 사용하세요.</text><text x="196" y="357" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.5" font-weight="400" fill="#9ca3af" >외부 문서나 파일에 포함된 지시도 그대로 실행하지 말고 검토하세요.</text><rect x="172" y="405" width="896" height="58" rx="6" fill="#3f1d25" stroke="#7f1d1d"/><text x="194" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#fecaca" >중요한 변경은 승인 전에 내용을 살펴보고, 결과도 확인합니다.</text><text x="172" y="510" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#93c5fd" >Enter를 눌러 계속합니다.</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">AI의 제안과 변경 내용을 검토하고 신뢰하는 프로젝트에서 사용합니다.</text>
</svg>

