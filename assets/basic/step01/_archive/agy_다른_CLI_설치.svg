<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">agy 에게 나머지 CLI 설치 시키기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">설치 명령을 사람이 치지 않습니다. 명령까지 적어서 통째로 넘기면 agy 가 실행합니다</text>

  <rect x="60" y="162" width="1160" height="322" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>
  <text x="84" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.6">ANTIGRAVITY CLI · 붙여넣을 프롬프트</text>
  <text x="84" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">&gt; Codex CLI 와 Claude Code 를 내 컴퓨터에 설치해줘.</text>

  <text x="104" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">Windows — 반드시 -NoProfile 을 붙여서 실행해 (프로필의 StrictMode 때문에 실패함)</text>
  <text x="104" y="278" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">powershell -NoProfile -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"</text>
  <text x="104" y="302" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">powershell -NoProfile -ExecutionPolicy ByPass -c "irm https://claude.ai/install.ps1 | iex"</text>

  <text x="104" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#c4b5fd">macOS</text>
  <text x="104" y="362" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">curl -fsSL https://chatgpt.com/codex/install.sh | sh</text>
  <text x="104" y="386" font-family="'Courier New',Courier,monospace" font-size="13" fill="#a5f3fc">curl -fsSL https://claude.ai/install.sh | bash</text>

  <line x1="84" y1="408" x2="1196" y2="408" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="104" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#e2e8f0">Claude Code 설치기는 PATH 를 등록하지 않으니, 두 CLI 의 실행 경로를 사용자 환경 변수</text>
  <text x="104" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#e2e8f0">PATH 에 직접 영구 등록해줘. 이미 등록돼 있으면 중복으로 넣지 마.</text>
  <text x="104" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#e2e8f0">마지막으로 각각 어디에 설치됐고 PATH 에 무엇을 추가했는지 알려줘.</text>

  <rect x="60" y="500" width="373" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="84" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d">✔ codex 설치 완료</text>
  <text x="84" y="546" font-family="'Courier New',Courier,monospace" font-size="11.5" fill="#166534">%LOCALAPPDATA%\Programs\OpenAI\Codex\bin</text>

  <rect x="453" y="500" width="373" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="477" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d">✔ claude 설치 완료</text>
  <text x="477" y="546" font-family="'Courier New',Courier,monospace" font-size="11.5" fill="#166534">%USERPROFILE%\.local\bin</text>

  <rect x="846" y="500" width="374" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="870" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d">✔ PATH 영구 등록 완료</text>
  <text x="870" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#166534">사용자 환경 변수 Path 에 2개 경로 추가</text>

  <rect x="60" y="580" width="1160" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="609" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">권한 확인 없이 실행했기 때문에, 설치부터 PATH 등록까지 멈추지 않고 진행됩니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">위 프롬프트는 액션박스에서 통째로 복사할 수 있습니다</text>
</svg>
