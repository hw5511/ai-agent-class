<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- 헤더 배지 -->
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f0f4ff" stroke="#c7d7ff" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 6</text>

  <!-- 제목 -->
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 사용량 확인하기</text>
  <text x="60" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#737373">수업 시작 전 사용량을 확인하여 충분한 여유가 있는지 체크합니다</text>
  <line x1="60" y1="138" x2="1220" y2="138" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- 사용량 페이지 접속 -->
  <rect x="60" y="162" width="1160" height="64" rx="12" fill="#171717"/>
  <text x="88" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af">사용량 확인 페이지</text>
  <text x="88" y="214" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="700" fill="#818cf8">https://claude.ai/settings/usage</text>

  <!-- 확인 항목 3가지 -->
  <rect x="60" y="248" width="370" height="180" rx="12" fill="#f8f4ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="88" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#7c3aed">1. 현재 세션 사용량</text>
  <text x="88" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">현재 사용률 (n% 사용 중)</text>
  <text x="88" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">5시간마다 자동 초기화</text>
  <line x1="88" y1="356" x2="400" y2="356" stroke="#c4b5fd" stroke-width="1"/>
  <text x="88" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">80% 이상이면 여유 부족</text>
  <text x="88" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">초기화까지 대기 권장</text>

  <rect x="455" y="248" width="370" height="180" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="483" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">2. 초기화 시간</text>
  <text x="483" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">n시간 n분 후 한도 초기화</text>
  <text x="483" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">리셋 후 다시 100% 사용 가능</text>
  <line x1="483" y1="356" x2="795" y2="356" stroke="#bfdbfe" stroke-width="1"/>
  <text x="483" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">수업 시간 전에 미리 확인하면</text>
  <text x="483" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">끊김 없이 진행 가능</text>

  <rect x="850" y="248" width="370" height="180" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="878" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">3. 주간 사용량</text>
  <text x="878" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">주간 전체 한도 대비 현황</text>
  <text x="878" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">웹 Claude와 사용량 공유</text>
  <line x1="878" y1="356" x2="1190" y2="356" stroke="#bbf7d0" stroke-width="1"/>
  <text x="878" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">웹에서 많이 쓰면</text>
  <text x="878" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">CLI 사용량도 줄어듦</text>

  <!-- 팁 박스 -->
  <rect x="60" y="452" width="1160" height="72" rx="12" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="640" y="480" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">수업 전 체크 습관</text>
  <text x="640" y="504" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e">수업 시작 전 사용량 페이지를 확인하여 세션 사용량이 50% 이하인지 체크하세요. 부족하면 초기화 시간까지 기다린 후 시작하는 것을 권장합니다.</text>

  <!-- 경고 박스 -->
  <rect x="60" y="544" width="1160" height="52" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="640" y="576" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#d97706">한도 초과 시 일시적으로 Claude Code 사용이 중단됩니다. 다음 슬라이드의 '추가 사용량 활성화'를 설정하면 중단 없이 계속 사용할 수 있습니다.</text>

  <!-- 하단 안내 -->
  <text x="640" y="640" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">사용량 페이지 주소를 즐겨찾기에 추가해두면 편리합니다</text>
</svg>