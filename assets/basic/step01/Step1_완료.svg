<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/><text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db"/><text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a">Step 1 완료</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">VS Code 안에서 세 CLI를 설치하고, 같은 파일 작업을 마쳤습니다</text>
  <rect x="60" y="180" width="700" height="420" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="92" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">오늘의 완료 항목</text>
      <rect x="90" y="252" width="22" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/><path d="M95 263l5 5 9-11" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">VS Code를 설치하고 에이전트1을 열었다</text>
      <rect x="90" y="302" width="22" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/><path d="M95 313l5 5 9-11" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Antigravity, Codex, Claude Code를 설치·로그인했다</text>
      <rect x="90" y="352" width="22" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/><path d="M95 363l5 5 9-11" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="369" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">각 도구에 질문하고 파일·폴더를 만들고 이동했다</text>
      <rect x="90" y="402" width="22" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/><path d="M95 413l5 5 9-11" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="419" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Ctrl + C로 각 CLI를 종료하고 터미널 상태를 확인했다</text>
      <rect x="90" y="462" width="634" height="104" rx="9" fill="#f9fafb" stroke="#e5e7eb"/><text x="112" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6b7280">도구별 결과 폴더</text><text x="112" y="520" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">agy\introduce\자기소개서.txt</text><text x="112" y="542" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">codex\introduce\자기소개서.txt</text><text x="112" y="564" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">claude\introduce\자기소개서.txt</text>
      <rect x="790" y="180" width="430" height="420" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="824" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">에이전트1</text><text x="824" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#6b7280">도구별 폴더를 분리해 결과를 보관합니다.</text>
      <rect x="824" y="282" width="362" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="848" cy="306" r="9" fill="#111827"/><text x="868" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#374151">agy</text><text x="1160" y="311" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">실습 완료</text>
      <rect x="824" y="342" width="362" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="848" cy="366" r="9" fill="#2563eb"/><text x="868" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#374151">codex</text><text x="1160" y="371" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">실습 완료</text>
      <rect x="824" y="402" width="362" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb"/><circle cx="848" cy="426" r="9" fill="#ea580c"/><text x="868" y="431" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#374151">claude</text><text x="1160" y="431" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">실습 완료</text>
      <rect x="824" y="478" width="362" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="844" y="510" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">다음 회차</text><text x="844" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">세 도구가 만든 결과의 차이를 비교합니다.</text>
  <text x="640" y="682" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">세 도구의 결과를 같은 폴더 구조에서 다시 열어 비교할 수 있습니다</text>
</svg>
