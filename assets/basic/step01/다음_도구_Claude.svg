  <text x="110" y="495" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="700" fill="#4ade80">gemini.txt</text>
  <text x="110" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#86efac">Antigravity · 완료</text>
