  <text x="482" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#86efac">Codex · 완료</text>
  <rect x="832" y="470" width="348" height="58" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
  <text x="854" y="495" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="700" fill="#6b7280">claude.txt</text>
  <text x="854" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#6b7280">Claude Code · 지금 만들 것</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">세 번째 파일까지 들어가면 한 폴더에서 세 결과를 나란히 비교할 수 있습니다</text>
