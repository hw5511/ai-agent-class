<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">다음 도구: Claude Code</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">폴더를 옮기지 않습니다. 같은 에이전트1 폴더에서 그대로 이어서 합니다</text>

  <rect x="60" y="168" width="1160" height="122" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="96" cy="204" r="15" fill="#e2e8f0"/>
  <text x="96" y="210" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">✓</text>
  <text x="126" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">Codex CLI 는 Ctrl + C 로 이미 종료했습니다</text>
  <text x="126" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">터미널이 일반 프롬프트(PS …&gt;)로 돌아와 있는지 확인합니다.</text>
  <text x="126" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c">cd 로 폴더를 옮기지 않습니다 — 계속 에이전트1 에서 합니다.</text>

  <text x="60" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">같은 터미널에 이것만 칩니다</text>
  <rect x="60" y="340" width="1160" height="96" rx="10" fill="#1f2937"/>
  <text x="88" y="378" font-family="'Courier New',Courier,monospace" font-size="17" fill="#e5e7eb">PS C:\Users\student\에이전트1&gt; <tspan fill="#fbbf24" font-weight="700">claude</tspan></text>
  <text x="88" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">Claude Code 가 뜨면 앞과 똑같은 4단계를 그대로 시킵니다.</text>

  <text x="60" y="456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">에이전트1\introduce\ 에 쌓이는 결과</text>
