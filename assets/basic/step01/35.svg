<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- 헤더 배지 -->
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f0f4ff" stroke="#c7d7ff" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 6</text>

  <!-- 제목 -->
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">추가 사용량 활성화하기</text>
  <text x="60" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#737373">구독 한도 초과 시에도 중단 없이 Claude Code를 계속 사용하는 설정입니다</text>
  <line x1="60" y1="138" x2="1220" y2="138" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="60" y="162" width="1160" height="100" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="88" y="178" width="36" height="24" rx="12" fill="#171717"/>
  <text x="106" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#fafafa">1</text>
  <text x="136" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">설정 페이지 이동</text>
  <text x="88" y="228" font-family="'Courier New',Courier,monospace" font-size="15" fill="#1d4ed8">https://claude.ai/settings/usage</text>
  <text x="88" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">위 주소로 접속하여 사용량 설정 페이지를 엽니다</text>

  <!-- 화살표 -->
  <polygon points="640,274 633,264 647,264" fill="#6b7280"/>

  <!-- Step 2 -->
  <rect x="60" y="286" width="1160" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="88" y="302" width="36" height="24" rx="12" fill="#1d4ed8"/>
  <text x="106" y="318" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="136" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">추가 사용량 옵션 활성화</text>
  <text x="88" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">"추가 사용량 한도에 도달했을 때 Claude를 계속 사용하려면 추가 사용량을 켜세요"</text>
  <text x="88" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">위 옵션의 토글 스위치를 ON으로 전환합니다</text>
  <text x="88" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">* 영문 표시: "Enable additional usage when you reach your plan limit"</text>

  <!-- 화살표 -->
  <polygon points="640,418 633,408 647,408" fill="#6b7280"/>

  <!-- Step 3 -->
  <rect x="60" y="430" width="1160" height="100" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="88" y="446" width="36" height="24" rx="12" fill="#16a34a"/>
  <text x="106" y="462" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="136" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">추가 사용량 구매</text>
  <text x="88" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">'추가 사용량 구매' 버튼을 클릭하여 결제 정보를 등록합니다</text>
  <text x="88" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">초과 사용 시 자동으로 Wallet에서 차감됩니다 (사용한 만큼만 과금)</text>

  <!-- 완료 박스 -->
  <rect x="60" y="554" width="1160" height="64" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="582" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#16a34a">설정 완료!</text>
  <text x="640" y="604" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#374151">이제 수업 중 사용량 한도에 도달해도 중단 없이 Claude Code를 계속 활용할 수 있습니다</text>

  <!-- 하단 안내 -->
  <text x="640" y="660" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">추가 사용량은 실제 초과 사용 시에만 과금되며, 기본 구독 요금과 별도로 청구됩니다</text>
</svg>