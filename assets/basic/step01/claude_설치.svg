  <text x="138" y="468" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">$ curl -fsSL https://claude.ai/install.sh | bash</text>
  <text x="138" y="494" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#e5e7eb"></text>
  <text x="138" y="520" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#4ade80">Claude Code installed to ~/.local/bin</text>
  <text x="138" y="546" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#e5e7eb"></text>
  <text x="138" y="572" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="400" fill="#fbbf24">Run: echo 'export PATH="$HOME/.local/bin:$PATH"' &gt;&gt; ~/.zshrc</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">설치 위치 — Windows %USERPROFILE%\.local\bin · macOS ~/.local/bin</text>
