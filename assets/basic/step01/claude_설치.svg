  <text x="758" y="266" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#e5e7eb">PS C:\...&gt; irm https://claude.ai/install.ps1 | iex</text>
  <text x="758" y="288" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#e5e7eb"></text>
  <text x="758" y="310" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#4ade80">Claude Code installed to %USERPROFILE%\.local\bin</text>
