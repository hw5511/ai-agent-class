<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="54" height="24" rx="12" fill="#f0f4ff" stroke="#c7d7ff" stroke-width="1"/>
  <text x="177" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 경로를 사용자 PATH에 등록</text>
  <rect x="140" y="118" width="1000" height="520" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M150 119h980a9 9 0 0 1 9 9v23H141v-23a9 9 0 0 1 9-9z" fill="#f3f4f6"/>
<circle cx="162" cy="135" r="5" fill="#ef4444"/><circle cx="180" cy="135" r="5" fill="#f59e0b"/><circle cx="198" cy="135" r="5" fill="#22c55e"/>
<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >PowerShell · 에이전트1 · claude</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="184" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14.5" font-weight="400" fill="#9ca3af" ># Claude Code 실행 파일 폴더</text><text x="172" y="216" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#93c5fd" >$claudeBin = Join-Path $env:USERPROFILE ".local\bin"</text><text x="172" y="254" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#e5e7eb" >$userPath = [Environment]::GetEnvironmentVariable("Path", "User")</text><text x="172" y="292" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#e5e7eb" >$entries = @($userPath -split ";" | Where-Object { $_ })</text><text x="172" y="330" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13.7" font-weight="400" fill="#fcd34d" >if ($entries -notcontains $claudeBin) { $entries += $claudeBin }</text><text x="172" y="368" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#e5e7eb" >[Environment]::SetEnvironmentVariable("Path",</text><text x="196" y="394" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="14" font-weight="400" fill="#e5e7eb" >  ($entries -join ";"), "User")</text><rect x="164" y="437" width="910" height="78" rx="8" fill="#172554" stroke="#1d4ed8"/><text x="188" y="469" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#dbeafe" >$claudeBin을 먼저 지정한 뒤 사용자 PATH에 경로를 추가합니다.</text><text x="188" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#dbeafe" >이미 등록된 경로는 다시 추가하지 않습니다.</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">변수를 먼저 선언한 뒤 중복 없이 사용자 PATH를 갱신합니다.</text>
</svg>

