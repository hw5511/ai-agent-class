  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">실습용 에이전트1 폴더임을 확인한 뒤 신뢰 여부를 선택합니다.</text>
