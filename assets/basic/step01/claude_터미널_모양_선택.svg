<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="54" height="24" rx="12" fill="#f0f4ff" stroke="#c7d7ff" stroke-width="1"/>
  <text x="177" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#3b5bdb">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 터미널 모양 선택</text>
  <rect x="140" y="118" width="1000" height="520" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<path d="M150 119h980a9 9 0 0 1 9 9v23H141v-23a9 9 0 0 1 9-9z" fill="#f3f4f6"/>
<circle cx="162" cy="135" r="5" fill="#ef4444"/><circle cx="180" cy="135" r="5" fill="#f59e0b"/><circle cx="198" cy="135" r="5" fill="#22c55e"/>
<text x="225" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="500" fill="#374151" >Claude Code · 터미널 표시 설정</text>
<rect x="141" y="152" width="998" height="485" fill="#111827"/>
<text x="172" y="183" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="500" fill="#f3f4f6" >Welcome to Claude Code</text><line x1="172" y1="200" x2="1098" y2="200" stroke="#6b7280" stroke-dasharray="2 5"/><text x="172" y="232" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#e5e7eb" >터미널 모양을 선택하세요</text><text x="172" y="258" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.5" font-weight="400" fill="#9ca3af" >나중에 /theme 명령으로 바꿀 수 있습니다.</text><text x="184" y="297" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  1. Auto (터미널 설정 따르기)</text><rect x="166" y="307" width="390" height="26" rx="3" fill="#1d4ed8"/><text x="184" y="326" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="600" fill="#ffffff" >&gt; 2. Dark mode</text><text x="184" y="355" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  3. Light mode</text><text x="184" y="384" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  4. Dark mode (색각 지원)</text><text x="184" y="413" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  5. Light mode (색각 지원)</text><text x="184" y="442" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  6. Dark mode (ANSI colors only)</text><text x="184" y="471" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >  7. Light mode (ANSI colors only)</text><rect x="594" y="188" width="478" height="344" rx="6" fill="#0b0f14" stroke="#4b5563"/><text x="616" y="217" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.5" font-weight="400" fill="#9ca3af" >터미널 미리 보기</text><rect x="610" y="232" width="446" height="31" fill="#1f2937"/><text x="626" y="253" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >1   function greet() {</text><rect x="610" y="264" width="446" height="26" fill="#7f1d1d"/><text x="626" y="283" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.5" font-weight="400" fill="#fecaca" >2  - console.log('Hello, world');</text><rect x="610" y="291" width="446" height="26" fill="#14532d"/><text x="626" y="310" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.5" font-weight="400" fill="#bbf7d0" >2  + console.log('Hello, Claude');</text><text x="626" y="338" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12.8" font-weight="400" fill="#d1d5db" >3   }</text><text x="616" y="490" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="12" font-weight="400" fill="#9ca3af" >Dark mode 선택됨</text><text x="184" y="531" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" font-weight="400" fill="#93c5fd" >↑ / ↓ 이동     Enter 선택</text>
  <text x="640" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="500" fill="#374151">목록에서 읽기 편한 터미널 색상 모양을 선택합니다.</text>
</svg>

