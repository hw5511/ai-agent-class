<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a">Ctrl + C로 Codex 종료</text>
  <text x="60" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">Codex CLI 입력 화면에서 종료해 일반 터미널로 돌아갑니다</text>

  <rect x="80" y="180" width="1120" height="330" rx="12" fill="#1f2937"/>
  <rect x="80" y="180" width="1120" height="46" rx="12" fill="#111827"/>
  <rect x="80" y="212" width="1120" height="14" fill="#111827"/>
  <circle cx="107" cy="203" r="6" fill="#6b7280"/><circle cx="127" cy="203" r="6" fill="#6b7280"/><circle cx="147" cy="203" r="6" fill="#6b7280"/>
  <text x="640" y="208" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Codex CLI · 대화 화면</text>
  <text x="120" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="0.6">CODEX</text>
  <text x="120" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#e5e7eb">실습 파일과 폴더 작업이 완료되었습니다.</text>
  <rect x="120" y="340" width="1040" height="70" rx="8" fill="#111827" stroke="#4b5563"/>
  <text x="145" y="369" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af">입력 대기 중</text>
  <rect x="145" y="382" width="7" height="15" fill="#93c5fd"/>
  <rect x="454" y="432" width="372" height="48" rx="9" fill="#eff6ff"/>
  <rect x="474" y="441" width="72" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="510" y="461" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Ctrl</text>
  <text x="567" y="461" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6b7280">+</text>
  <rect x="590" y="441" width="48" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="614" y="461" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">C</text>
  <text x="657" y="461" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">눌러 종료</text>

  <rect x="80" y="536" width="1120" height="72" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="110" cy="572" r="10" fill="#f59e0b"/>
  <text x="110" y="576" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="134" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#374151">실행 중인 작업이 없을 때 종료합니다</text>
  <text x="134" y="589" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">응답 생성 중이면 작업이 먼저 중단될 수 있으니 완료를 확인한 뒤 누르세요</text>
  <text x="640" y="660" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">Codex 화면이 끝나면 터미널 프롬프트가 다시 나타납니다</text>
</svg>
