<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- ========================================================================
       B. 명령 하나와 출력
       명령어를 치고 결과를 보여줄 때
       복제해서 쓰는 법: 이 파일을 assets/<과정>/step<NN>/<슬라이드이름>.svg 로
       복사한 뒤, 아래 [바꾸기] 표시된 곳만 고치면 된다. 좌표는 건드리지 않는다.
       ======================================================================== -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- [바꾸기] 과정 배지: BASIC 01 / ADV 08 / AUTO 03 -->
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <!-- [바꾸기] 단계 칩. 필요 없으면 이 두 줄을 지운다 -->
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>

  <!-- [바꾸기] 제목 -->
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">여기에 제목</text>
  <!-- [바꾸기] 부제 (한 줄). 없으면 지운다 -->
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">여기에 한 줄 설명</text>

  <!-- [바꾸기] 안내 띠 -->
  <rect x="60" y="168" width="1160" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">무엇을 하는 명령인지 한 줄</text>
  <text x="88" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#1e40af">보충 설명 한 줄</text>

  <text x="60" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">실행하면 이렇게 나옵니다</text>

  <!-- [바꾸기] 어두운 터미널 패널. 줄이 늘면 height 를 키운다 -->
  <rect x="60" y="292" width="1160" height="240" rx="10" fill="#1f2937"/>
  <text x="92" y="330" font-family="'Courier New',Courier,monospace" font-size="15" fill="#e5e7eb">PS C:\...\에이전트1&gt; <tspan fill="#fbbf24" font-weight="700">명령어</tspan></text>
  <line x1="92" y1="350" x2="1188" y2="350" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="382" font-family="'Courier New',Courier,monospace" font-size="15" fill="#86efac">출력 첫 줄</text>
  <text x="92" y="410" font-family="'Courier New',Courier,monospace" font-size="15" fill="#86efac">출력 둘째 줄</text>
  <text x="92" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#9ca3af">보조 설명 (회색)</text>

  <!-- [바꾸기] 경고 상자. 없으면 지운다 -->
  <rect x="60" y="552" width="1160" height="84" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <circle cx="89" cy="580" r="12" fill="#f59e0b"/>
  <text x="89" y="585" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">!</text>
  <text x="116" y="579" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">주의할 점 제목</text>
  <text x="116" y="603" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#78350f">주의할 점 설명</text>

  <!-- [바꾸기] 각주 한 줄. 없으면 지운다 -->
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">화면 아래 한 줄 메모</text>
</svg>
