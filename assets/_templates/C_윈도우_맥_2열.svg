<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- ========================================================================
       C. Windows / macOS 2열
       같은 작업을 두 OS 로 나눠 보여줄 때
       복제해서 쓰는 법: 이 파일을 assets/<과정>/step<NN>/<슬라이드이름>.svg 로
       복사한 뒤, 아래 [바꾸기] 표시된 곳만 고치면 된다. 좌표는 건드리지 않는다.
       ======================================================================== -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- [바꾸기] 과정 배지: BASIC 01 / ADV 08 / AUTO 03 -->
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <!-- [바꾸기] 단계 칩. 필요 없으면 이 두 줄을 지운다 -->
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>

  <!-- [바꾸기] 제목 -->
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">여기에 제목</text>
  <!-- [바꾸기] 부제 (한 줄). 없으면 지운다 -->
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#6b7280">여기에 한 줄 설명</text>

  <!-- [바꾸기] 왼쪽 = Windows -->
  <rect x="60" y="172" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="172" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="206" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Windows · PowerShell</text>
  <rect x="84" y="244" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="104" y="272" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">Windows 명령 첫 줄</text>
  <text x="104" y="296" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">Windows 명령 둘째 줄</text>
  <text x="84" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#4b5563">보충 설명</text>

  <!-- [바꾸기] 오른쪽 = macOS -->
  <rect x="660" y="172" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="172" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="206" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS · 터미널</text>
  <rect x="684" y="244" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="704" y="272" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">macOS 명령 첫 줄</text>
  <text x="704" y="296" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#a5f3fc">macOS 명령 둘째 줄</text>
  <text x="684" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#4b5563">보충 설명</text>

  <!-- [바꾸기] 공통 안내. 없으면 지운다 -->
  <rect x="60" y="500" width="1160" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">두 쪽 공통으로 알아둘 것</text>
  <text x="88" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#6b7280">설명 한 줄</text>

  <!-- [바꾸기] 각주 한 줄. 없으면 지운다 -->
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">화면 아래 한 줄 메모</text>
</svg>
