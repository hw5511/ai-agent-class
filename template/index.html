<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업자료 템플릿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <style>
        /* ============================================
           Design Tokens
           ============================================ */
        :root {
            --bg:           #fff;
            --fg:           #0a0a0a;
            --card:         #fff;
            --primary:      #171717;
            --primary-fg:   #fafafa;
            --secondary:    #f5f5f5;
            --muted:        #f5f5f5;
            --muted-fg:     #737373;
            --border:       #e5e5e5;

            --accent:        #2563eb;
            --accent-muted:  #eff6ff;
            --accent-border: #bfdbfe;

            --success:        #16a34a;
            --success-muted:  #f0fdf4;
            --success-border: #bbf7d0;

            --radius:      0.5rem;
            --radius-full: 9999px;

            --font-xs:   0.75rem;
            --font-sm:   0.875rem;
            --font-base: 1rem;
            --font-lg:   1.125rem;
            --font-xl:   1.25rem;
            --font-2xl:  1.5rem;

            --sidebar-width:    260px;
            --slide-nav-height: 52px;
            --sidebar-transition: 0.22s ease;
            --slide-transition:   0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           Reset & Base
           ============================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        .sidebar-toggle {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            border: none;
            background: transparent;
            color: var(--muted-fg);
            cursor: pointer;
            transition: background 0.14s, color 0.14s;
            flex-shrink: 0;
        }

        .sidebar-toggle:hover { background: var(--secondary); color: var(--fg); }

        /* ============================================
           App Layout
           ============================================ */
        .app-body {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ============================================
           Sidebar
           ============================================ */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: #fafafa;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition:
                width var(--sidebar-transition),
                border-color var(--sidebar-transition);
        }

        .sidebar.collapsed {
            width: 0;
            border-right-color: transparent;
        }

        .sidebar-inner {
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 0.75rem 0.75rem 0.625rem;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .sidebar-reopen {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 50;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--muted-fg);
            cursor: pointer;
            transition: background 0.14s, color 0.14s, opacity 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .sidebar-reopen.visible { opacity: 1; pointer-events: auto; }
        .sidebar-reopen:hover { background: var(--secondary); color: var(--fg); }

        .sidebar-course-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.625rem;
            border-radius: var(--radius-full);
            font-size: var(--font-xs);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            background: var(--accent-muted);
            color: var(--accent);
        }

        .sidebar-course-title {
            font-size: 0.9375rem;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.4;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 0.375rem 0.75rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .sidebar-nav::-webkit-scrollbar       { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .nav-item {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            padding: 0.5rem 0.625rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.13s;
            margin-bottom: 0.125rem;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover          { background: var(--border); }
        .nav-item.active         { background: var(--primary); }

        .nav-num {
            font-size: var(--font-xs);
            font-weight: 700;
            color: var(--muted-fg);
            min-width: 18px;
            padding-top: 0.15rem;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        .nav-item.active .nav-num { color: rgba(255,255,255,0.45); }

        .nav-info {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }

        .nav-title {
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--fg);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item.active .nav-title { color: var(--primary-fg); }

        .nav-hours {
            font-size: var(--font-xs);
            color: var(--muted-fg);
        }

        .nav-item.active .nav-hours { color: rgba(255,255,255,0.4); }

        /* ============================================
           Slide Area
           ============================================ */
        .slide-area {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .slides-container {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1.25rem 1.75rem 1rem;
            transform: translateX(100%);
            transition: transform var(--slide-transition);
            will-change: transform;
        }

        .slide.is-prev   { transform: translateX(-100%); }
        .slide.is-active { transform: translateX(0); }

        /* ============================================
           Slide Navigation
           ============================================ */
        .slide-nav {
            height: var(--slide-nav-height);
            min-height: var(--slide-nav-height);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            background: var(--bg);
            gap: 1rem;
        }

        .slide-btn {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.35rem 0.875rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--fg);
            font-size: var(--font-sm);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.13s, border-color 0.13s, opacity 0.13s;
            white-space: nowrap;
        }

        .slide-btn:hover:not(:disabled) { background: var(--secondary); border-color: #d4d4d4; }
        .slide-btn:disabled             { opacity: 0.3; cursor: not-allowed; }

        .slide-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
        }

        .slide-counter {
            font-size: var(--font-xs);
            font-weight: 700;
            color: var(--muted-fg);
            letter-spacing: 0.06em;
        }

        .slide-dots {
            display: flex;
            gap: 0.3rem;
        }

        .slide-dot {
            width: 6px;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            transition: background 0.18s, width 0.18s;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .slide-dot.active { background: var(--primary); width: 16px; }

        /* ============================================
           Session Content
           ============================================ */
        .session-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .session-header {
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.875rem;
            padding-bottom: 0.875rem;
            border-bottom: 1px solid var(--border);
        }

        .session-header-left {
            flex: 1;
            min-width: 0;
        }

        .slide-action-box {
            flex-shrink: 0;
            min-width: 0;
            max-width: 520px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.45rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .slide-action-box:empty {
            display: none;
        }

        .action-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted-fg);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .action-copy-row {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            min-width: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            cursor: pointer;
        }

        .action-copy-row:hover { background: #f0f4ff; }

        .action-item-desc {
            font-size: 11px;
            color: var(--muted-fg);
            min-width: 36px;
            flex-shrink: 0;
        }

        .action-copy-code {
            flex: 1;
            min-width: 0;
            font-family: monospace;
            font-size: 12px;
            color: #374151;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .action-copy-btn {
            flex-shrink: 0;
            font-size: 11px;
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 0 0 0.25rem;
        }

        .session-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .badge-step {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.625rem;
            border-radius: var(--radius-full);
            font-size: var(--font-xs);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--accent-muted);
            color: var(--accent);
        }

        .badge-hours {
            font-size: var(--font-xs);
            font-weight: 600;
            color: var(--muted-fg);
            background: var(--muted);
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-full);
        }

        .session-title {
            font-size: var(--font-2xl);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--fg);
            line-height: 1.3;
        }

        .session-body {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            min-height: 0;
            overflow: hidden;
        }

        .body-image {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .image-slider {
            position: relative;
            flex: 1;
            overflow: hidden;
            border-radius: var(--radius);
            background: #ffffff;
            border: 1px solid var(--border);
            min-height: 0;
        }

        .image-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(100%);
            transition: transform var(--slide-transition);
            will-change: transform;
        }

        .image-slide.is-prev   { transform: translateX(-100%); }
        .image-slide.is-active { transform: translateX(0); }

        .image-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
        }

        .image-placeholder-icon  { opacity: 0.35; }
        .image-placeholder-label { font-weight: 600; font-size: var(--font-sm); color: var(--muted-fg); }
        .image-placeholder-sub   { font-size: var(--font-xs); color: var(--muted-fg); opacity: 0.7; }

        .image-expand-btn {
            position: absolute;
            bottom: 0.5rem;
            right: 0.5rem;
            z-index: 10;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: rgba(0,0,0,0.35);
            color: #fff;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.18s;
        }
        .body-image:hover .image-expand-btn { opacity: 1; }
    </style>
</head>
<body>

    <div class="app-body">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header">
                    <div class="sidebar-top">
                        <button class="sidebar-toggle" id="sidebar-toggle" title="사이드바 접기">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M9 2L3 7l6 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <div class="sidebar-course-badge" id="sidebar-badge">STEP</div>
                    <div class="sidebar-course-title" id="sidebar-title">수업자료 템플릿</div>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav"></nav>
            </div>
        </aside>

        <!-- Slide Area -->
        <div class="slide-area">
            <button class="sidebar-reopen" id="sidebar-reopen" title="사이드바 열기">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <rect x="0.5" y="2" width="13" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect x="0.5" y="6.25" width="13" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect x="0.5" y="10.5" width="13" height="1.5" rx="0.75" fill="currentColor"/>
                </svg>
            </button>
            <div class="slides-container" id="slides-container"></div>

            <!-- Slide Navigation -->
            <div class="slide-nav">
                <button class="slide-btn" id="btn-prev">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    이전
                </button>
                <div class="slide-indicator">
                    <span class="slide-counter" id="slide-counter">STEP 01 · 01 / 01</span>
                    <div class="slide-dots" id="slide-dots"></div>
                </div>
                <button class="slide-btn" id="btn-next">
                    다음
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        /* ============================================
           Template Data
           — slides: [] = placeholder shown (blank template)
           — No course tabs (unified pipeline)
           ============================================ */
        const SESSIONS = [
            {
                num: 1,
                title: 'test12345678',
                hours: '0시간',
                slides: []
            }
        ];

        let currentSession = 0;
        let currentImage   = 0;

        /* ============================================
           Sidebar Nav Render
           ============================================ */
        function renderNav() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = SESSIONS.map((s, i) => {
                const num = String(s.num).padStart(2, '0');
                return `<button class="nav-item${i === currentSession ? ' active' : ''}" data-index="${i}">
                    <span class="nav-num">${num}</span>
                    <span class="nav-info">
                        <span class="nav-title">${s.title}</span>
                        <span class="nav-hours">${s.hours}</span>
                    </span>
                </button>`;
            }).join('');

            nav.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    goToSession(parseInt(btn.dataset.index));
                });
            });
        }

        /* ============================================
           Slide Render
           ============================================ */
        function renderSlides() {
            const container = document.getElementById('slides-container');

            container.innerHTML = SESSIONS.map((s, i) => {
                const num = String(s.num).padStart(2, '0');

                const imageSlidesHtml = `<div class="image-slide is-active" data-img-index="0">
                    <div class="image-placeholder">
                        <svg class="image-placeholder-icon" width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <rect x="4" y="8" width="32" height="24" rx="3" stroke="#a3a3a3" stroke-width="2"/>
                            <circle cx="14" cy="17" r="3" stroke="#a3a3a3" stroke-width="1.5"/>
                            <path d="M4 26l8-6 6 5 6-4 12 8" stroke="#a3a3a3" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        <span class="image-placeholder-label">슬라이드 이미지</span>
                        <span class="image-placeholder-sub">${s.title} · 슬라이드 ${num}</span>
                    </div>
                </div>`;

                const actionBoxHtml = `
                    <div class="action-label">실습 명령어</div>
                    <div class="action-copy-row" onclick="copyText(this)">
                        <span class="action-item-desc">예시</span>
                        <span class="action-copy-code">여기에 복사할 명령어를 입력하세요</span>
                        <button class="action-copy-btn" title="복사">복사</button>
                    </div>`;

                return `<div class="slide${i === currentSession ? ' is-active' : ''}" data-step-index="${i}">
                    <div class="session-inner">
                        <div class="session-header">
                            <div class="session-header-left">
                                <div class="session-meta">
                                    <span class="badge-step">STEP ${num}</span>
                                    <span class="badge-hours">${s.hours}</span>
                                </div>
                                <h1 class="session-title">${s.title}</h1>
                            </div>
                            <div class="slide-action-box">${actionBoxHtml}</div>
                        </div>
                        <div class="session-body">
                            <div class="body-image">
                                <div class="image-slider" data-step="${i}">
                                    ${imageSlidesHtml}
                                </div>
                                <button class="image-expand-btn" title="전체화면">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                        <path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        /* ============================================
           Navigation
           ============================================ */
        function goToSession(idx) {
            if (idx < 0 || idx >= SESSIONS.length) return;
            const slides = document.querySelectorAll('.slide');
            slides.forEach((s, i) => {
                s.classList.remove('is-active', 'is-prev');
                if (i < idx) s.classList.add('is-prev');
            });
            currentSession = idx;
            currentImage   = 0;
            slides[idx].classList.add('is-active');
            updateNav();
            updateSlideNav();
        }

        function updateNav() {
            document.querySelectorAll('.nav-item').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentSession);
            });
        }

        function updateSlideNav() {
            const s   = SESSIONS[currentSession];
            const tot = Math.max(s.slides.length, 1);
            const num = String(currentSession + 1).padStart(2, '0');
            document.getElementById('slide-counter').textContent =
                `STEP ${num} · ${String(currentImage + 1).padStart(2, '0')} / ${String(tot).padStart(2, '0')}`;

            const dots = document.getElementById('slide-dots');
            dots.innerHTML = Array.from({length: tot}, (_, i) =>
                `<button class="slide-dot${i === currentImage ? ' active' : ''}" data-i="${i}"></button>`
            ).join('');
            dots.querySelectorAll('.slide-dot').forEach(d => {
                d.addEventListener('click', () => { currentImage = parseInt(d.dataset.i); updateSlideNav(); });
            });

            document.getElementById('btn-prev').disabled = currentSession === 0 && currentImage === 0;
            document.getElementById('btn-next').disabled = currentSession === SESSIONS.length - 1 && currentImage >= tot - 1;
        }

        /* ============================================
           Copy Action
           ============================================ */
        function copyText(row) {
            const code = row.querySelector('.action-copy-code');
            if (!code) return;
            navigator.clipboard.writeText(code.textContent.trim()).then(() => {
                const btn = row.querySelector('.action-copy-btn');
                if (btn) { btn.textContent = '완료'; setTimeout(() => { btn.textContent = '복사'; }, 1500); }
            });
        }

        /* ============================================
           Sidebar Toggle
           ============================================ */
        const sidebar       = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarReopen = document.getElementById('sidebar-reopen');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.add('collapsed');
            sidebarReopen.classList.add('visible');
        });
        sidebarReopen.addEventListener('click', () => {
            sidebar.classList.remove('collapsed');
            sidebarReopen.classList.remove('visible');
        });

        /* ============================================
           Prev / Next
           ============================================ */
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentSession > 0) goToSession(currentSession - 1);
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentSession < SESSIONS.length - 1) goToSession(currentSession + 1);
        });

        /* ============================================
           Init
           ============================================ */
        renderNav();
        renderSlides();
        updateSlideNav();
    </script>
</body>
</html>
