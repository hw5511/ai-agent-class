<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 5</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">PATH 등록하기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">OS 마다 방법이 다릅니다 — Windows 는 자동, macOS 는 설치가 알려준 줄을 그대로</text>
  <rect x="60" y="168" width="1160" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">Windows 는 스크립트가 설치 위치를 찾아 자동으로 등록합니다</text>
  <text x="88" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">macOS 는 스크립트를 쓰지 않습니다 — agy 설치가 끝나며 찍어준 Run: 줄을 그대로 복사해 붙여넣습니다</text>
  <text x="60" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">이번엔 OS 마다 방법이 다릅니다</text>
  <text x="60" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Windows — 자동으로 잡습니다</text>
  <rect x="60" y="300" width="560" height="268" rx="10" fill="#1f2937"/>
  <text x="86" y="332" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#4b5563">────────────────────────────────</text>
  <text x="86" y="356" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">[v]</text>
  <text x="134" y="356" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">agy</text>
  <text x="242" y="356" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">사용 가능!  1.2.5</text>
  <text x="86" y="390" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#f87171">[ ]</text>
  <text x="134" y="390" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#f87171">codex</text>
  <text x="242" y="390" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#f87171">아직 설치되지 않았습니다</text>
  <text x="86" y="424" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#f87171">[ ]</text>
  <text x="134" y="424" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#f87171">claude</text>
  <text x="242" y="424" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#f87171">아직 설치되지 않았습니다</text>
  <text x="86" y="478" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#4b5563">────────────────────────────────</text>
  <text x="86" y="508" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#fbbf24">1/3 확인됨.</text>
  <text x="660" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9">macOS — 설치가 알려준 줄을 그대로</text>
  <rect x="660" y="300" width="560" height="268" rx="10" fill="#1f2937"/>
  <text x="684" y="330" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#4ade80">... 설치 완료!</text>
  <text x="684" y="356" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#9ca3af">Run:</text>
  <rect x="680" y="363" width="520" height="24" rx="5" fill="#3f3a10"/>
  <text x="692" y="378" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" fill="#fde68a">echo 'export PATH="$HOME/.local/bin:$PATH"' &gt;&gt; ~/.zshrc</text>
  <text x="684" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">◀ 이 줄 그대로 복사</text>
  <text x="684" y="442" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#4b5563">────────────────────────────────</text>
  <text x="684" y="468" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#e5e7eb">$ echo 'export PATH="$HOME/.local/bin:$PATH"' &gt;&gt; ~/.zshrc</text>
  <text x="684" y="492" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#e5e7eb">$ source ~/.zshrc</text>
  <text x="684" y="516" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#e5e7eb">$ agy --version</text>
  <text x="684" y="540" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#4ade80">agy 1.2.5</text>
  <rect x="60" y="586" width="1160" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="616" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">지금은 agy 하나만 확인되면 됩니다. codex 와 claude 는 곧 설치합니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">터미널에 실제로 찍히는 경로는 사람마다 다를 수 있습니다 — 화면에 뜬 줄을 그대로 쓰세요</text>
</svg>
