<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- 헤더 배지 -->
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 01</text>

  <!-- 제목 -->
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">어떤 AI로 진행하나요?</text>
  <text x="60" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#737373">이 강의는 Claude Pro 플랜을 기준으로 진행합니다</text>
  <line x1="60" y1="138" x2="1220" y2="138" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- Claude 소개 블럭 -->
  <rect x="60" y="162" width="500" height="240" rx="12" fill="#f8f4ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="88" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#7c3aed">Claude Pro 플랜</text>
  <text x="88" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">월 약 $20  (한화 약 3만원)</text>
  <text x="88" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">5시간 단위로 사용 한도 세션 초기화</text>
  <text x="88" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">Claude Code, Artifacts, Projects 기능 포함</text>
  <text x="88" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">최신 Claude 모델 (Sonnet / Opus) 우선 사용</text>
  <text x="88" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">* 무료 플랜도 기본 실습 가능 (사용량 제한 있음)</text>
  <rect x="88" y="356" width="112" height="30" rx="8" fill="#7c3aed"/>
  <text x="144" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">claude.ai</text>

  <!-- 사용 팁 블럭 -->
  <rect x="600" y="162" width="620" height="240" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="628" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">잘 쓰는 방법</text>
  <text x="628" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">매일 사용 한도 체크 → 꾸준히 활용 습관 만들기</text>
  <text x="628" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">세션 한도 초과 시 5시간 뒤 자동 초기화</text>
  <line x1="628" y1="276" x2="1190" y2="276" stroke="#bbf7d0" stroke-width="1"/>
  <text x="628" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#16a34a">지식 확장 팁</text>
  <text x="628" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#374151">자신의 분야 + AI = 빠른 전문가 성장</text>
  <text x="628" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">마케터 예시: "경쟁사 분석 보고서를 에이전트로 자동화"</text>
  <text x="628" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#6b7280">무엇이든 자기 직무에 적용하는 연습이 핵심</text>

  <!-- 전략 박스 -->
  <rect x="60" y="424" width="1160" height="60" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="640" y="449" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">AI 에이전트 전문가가 되는 공식</text>
  <text x="640" y="471" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#92400e">매일 사용 + 꾸준한 질문 + 내 분야에 적용  =  6개월 안에 팀 내 AI 전문가</text>

  <!-- 액션 박스 (링크) -->
  <rect x="60" y="508" width="1160" height="64" rx="10" fill="#171717"/>
  <text x="640" y="534" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#9ca3af">현재 사용량 확인</text>
  <text x="640" y="558" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#818cf8">claude.ai/settings/usage</text>

  <!-- 하단 안내 -->
  <text x="640" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af">강의 중 한도 초과 시 → 잠시 쉬었다 재개하거나 무료 플랜으로 전환 가능</text>
</svg>
