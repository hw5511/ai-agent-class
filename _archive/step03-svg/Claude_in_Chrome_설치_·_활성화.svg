<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">Claude in Chrome 설치 · 활성화</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#6b7280">확장 설치 후 /mcp에서 enable까지 3단계</text>
  <line x1="60" y1="196" x2="1220" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1 -->
  <text x="60" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#d1d5db" font-weight="700">1</text>
  <text x="94" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#171717">Chrome 웹스토어에서 <tspan font-family="'Courier New',Courier,monospace" fill="#2563eb">'Claude'</tspan> 확장 설치</text>
  <text x="94" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">버전 1.0.36 이상  ·  Chrome / Edge 지원</text>

  <line x1="60" y1="294" x2="1220" y2="294" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Step 2 -->
  <text x="60" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#d1d5db" font-weight="700">2</text>
  <text x="94" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#171717">Chrome 연결</text>
  <!-- Option A -->
  <rect x="94" y="350" width="500" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="104" y="369" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af" font-weight="600">매번 지정</text>
  <text x="344" y="384" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="17" fill="#1d4ed8">claude --chrome</text>
  <!-- Option B -->
  <rect x="614" y="350" width="546" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="624" y="369" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#9ca3af" font-weight="600">기본값 설정 (--chrome 생략)</text>
  <text x="887" y="384" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">/config  →  Claude in Chrome  <tspan font-weight="700" fill="#16a34a">ON</tspan></text>
  <!-- OR label -->
  <text x="597" y="383" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#9ca3af" font-weight="600">or</text>

  <line x1="60" y1="424" x2="1220" y2="424" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Step 3 -->
  <text x="60" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" fill="#d1d5db" font-weight="700">3</text>
  <text x="94" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#171717">/mcp 에서 enable</text>
  <!-- Flow -->
  <rect x="94" y="482" width="210" height="44" rx="8" fill="#f3f4f6"/>
  <text x="199" y="509" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="15" fill="#374151">/mcp 입력</text>
  <text x="326" y="509" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="358" y="482" width="310" height="44" rx="8" fill="#f3f4f6"/>
  <text x="513" y="509" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#374151">chrome for claude 선택</text>
  <text x="690" y="509" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" fill="#9ca3af">→</text>
  <rect x="722" y="482" width="160" height="44" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="802" y="509" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#16a34a">Enable</text>

  <!-- Bottom action box -->
  <rect x="60" y="628" width="1160" height="52" rx="10" fill="#171717"/>
  <text x="640" y="659" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#ffffff">확장 설치 →  claude.com/claude-for-chrome</text>
</svg>
