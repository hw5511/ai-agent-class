<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.05em">BASIC 03</text>
  <text x="60" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="#171717">/config 설정 항목 (1/2)</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#6b7280">/config 명령어로 Claude Code의 동작을 개인화합니다</text>
  <line x1="60" y1="196" x2="1220" y2="196" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 컬럼 헤더 -->
  <rect x="60" y="200" width="1160" height="28" fill="#f3f4f6"/>
  <text x="68" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.05em">설정 항목</text>
  <text x="478" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.05em">설명</text>
  <line x1="460" y1="200" x2="460" y2="628" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 행 1 -->
  <rect x="60" y="228" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="251" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Auto-compact</text>
  <text x="478" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">컨텍스트 한도 도달 시 대화 내용 자동 압축 (기본: 켜짐)</text>
  <!-- 행 2 -->
  <text x="68" y="287" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Show tips</text>
  <text x="478" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">Claude Code 사용 팁 메시지 표시</text>
  <!-- 행 3 -->
  <rect x="60" y="300" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="323" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Reduce motion</text>
  <text x="478" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">UI 전환 애니메이션 줄이기 (접근성)</text>
  <!-- 행 4 -->
  <text x="68" y="359" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Thinking mode</text>
  <text x="478" y="359" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">Extended Thinking 활성화 — Claude의 사고 과정 표시</text>
  <!-- 행 5 -->
  <rect x="60" y="372" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="395" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Rewind code (checkpoints)</text>
  <text x="478" y="395" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">파일 편집 전 체크포인트 자동 저장 (되돌리기 가능)</text>
  <!-- 행 6 -->
  <text x="68" y="431" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Verbose output</text>
  <text x="478" y="431" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">툴 호출 과정 상세 출력</text>
  <!-- 행 7 -->
  <rect x="60" y="444" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="467" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Terminal progress bar</text>
  <text x="478" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">작업 진행 상태 바 터미널 표시</text>
  <!-- 행 8 -->
  <text x="68" y="503" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Show turn duration</text>
  <text x="478" y="503" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">각 응답에 소요된 시간 표시</text>
  <!-- 행 9 -->
  <rect x="60" y="516" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="539" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Default permission mode</text>
  <text x="478" y="539" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">기본 권한 모드 설정 (Default / Auto-edit / Plan)</text>
  <!-- 행 10 -->
  <text x="68" y="575" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Respect .gitignore in file picker</text>
  <text x="478" y="575" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">파일 선택기에서 .gitignore 목록 자동 숨김</text>
  <!-- 행 11 -->
  <rect x="60" y="588" width="1160" height="36" fill="#f9fafb"/>
  <text x="68" y="611" font-family="'Courier New',Courier,monospace" font-size="12" fill="#374151">Always copy full response</text>
  <text x="478" y="611" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="#374151">/copy 없이 전체 응답을 자동으로 클립보드 복사</text>
  <!-- 테두리 -->
  <rect x="60" y="200" width="1160" height="424" rx="0" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 하단 박스 -->
  <rect x="60" y="640" width="1160" height="48" rx="10" fill="#f3f4f6"/>
  <text x="640" y="669" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7280">설정값은 즉시 저장됩니다 — 재시작 불필요</text>
</svg>
