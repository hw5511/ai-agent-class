<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 1</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">PATH 한 번에 잡기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">설치 후 바로 안 잡힐 때가 있습니다 — 자동 등록 스크립트로 정리</text>
  <text x="60" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">확인 명령을 실행하면</text>
  <rect x="60" y="212" width="1160" height="210" rx="10" fill="#1f2937"/>
  <text x="92" y="250" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#e5e7eb">PS C:\...\agent1&gt; claude --version</text>
  <line x1="92" y1="268" x2="1188" y2="268" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="292" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="292" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">claude</text>
  <text x="248" y="292" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">사용 가능!  2.1.274 (Claude Code)</text>
  <rect x="60" y="438" width="1160" height="78" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">초록으로 [v] 가 뜨고 버전 번호가 보이면 PATH 등록이 끝난 것입니다.</text>
  <text x="88" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">아직도 인식이 안 되면 터미널을 닫고 새로 열어 다시 시도하세요.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">VS Code 를 껐다 켤 필요 없이 바로 확인됩니다</text>
</svg>
