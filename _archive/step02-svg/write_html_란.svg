  <rect x="862.6666666666666" y="230" width="357.3333333333333" height="150" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="1041.3333333333333" y="295.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#15803d">웹페이지로 보임</text>
  <text x="1041.3333333333333" y="323.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#15803d">우리가 아는 그 모습</text>
  <rect x="60" y="410" width="1160" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">html 파일을 메모장으로 열면 글자 코드가 보이고, 크롬(웹 브라우저)으로 열면</text>
  <text x="88" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">우리가 아는 웹페이지 모습으로 그려집니다.</text>
