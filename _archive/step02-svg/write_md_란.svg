<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">md 파일이 뭔가요?</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">메모장과 비교하면 쉽습니다 — 글의 구조를 표시하는 약속이 있는 메모장입니다</text>
  <rect x="60" y="210" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="210" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="244" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">메모장 (.txt)</text>
  <rect x="84" y="282" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="104" y="310" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">오늘 회의 정리</text>
  <text x="104" y="334" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc"></text>
  <text x="104" y="358" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">매출 12% 증가</text>
  <text x="104" y="382" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">신제품 5월 출시</text>
  <text x="84" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">그냥 줄글입니다 — 제목·목록 구분이 파일 안에 없습니다</text>
  <rect x="660" y="210" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="210" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="244" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">마크다운 (.md)</text>
  <rect x="684" y="282" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="704" y="310" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc"># 오늘 회의 정리</text>
  <text x="704" y="334" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc"></text>
  <text x="704" y="358" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">- 매출 12% 증가</text>
  <text x="704" y="382" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">- 신제품 5월 출시</text>
  <text x="684" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563"># 은 제목, - 은 목록 — 구조를 기호로 표시합니다</text>
  <rect x="60" y="524" width="1160" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="554" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af"># 하나 = 큰 제목, - 하나 = 목록 항목 — 이런 기호 규칙을 "마크다운 문법"이라고 부릅니다.</text>
</svg>
