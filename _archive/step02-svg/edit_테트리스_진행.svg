  <rect x="60" y="222" width="1160" height="380" rx="10" fill="#1f2937"/>
  <text x="92" y="260" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Read(tetris.py)</text>
  <text x="92" y="288" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#6b7280">  └ Read 210 lines</text>
