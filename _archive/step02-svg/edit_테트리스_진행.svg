  <text x="92" y="344" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Edit(tetris.py)</text>
  <text x="92" y="372" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#6b7280">  └ 3 additions, 1 removal</text>
  <text x="92" y="400" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#e5e7eb"></text>
  <text x="92" y="428" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Edit(tetris.py)</text>
  <text x="92" y="456" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#6b7280">  └ 12 additions, 2 removals</text>
  <text x="92" y="484" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#e5e7eb"></text>
  <text x="92" y="512" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Edit(tetris.py)</text>
  <text x="92" y="540" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#6b7280">  └ 8 additions, 3 removals</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">파일 전체를 다시 쓰지 않습니다 — 바뀌는 줄만 표시됩니다</text>
