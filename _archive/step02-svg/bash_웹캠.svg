<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 6</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">카메라로 지금을 봅니다</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">웹캠으로 사진을 찍는 건 Bash, 그 사진을 보고 설명하는 건 Read 입니다</text>
  <text x="60" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트</text>
  <rect x="60" y="206" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="232" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="232" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">현재 컴퓨터에 연결된 웹캠 인식해볼래? 그걸로 지금 뭐가 보이는지 캡처해서 설명해봐</text>
  <line x1="640" y1="256" x2="640" y2="283" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 279L640 294L647 279Z" fill="#1d4ed8"/>
  <text x="60" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">Bash 로 찍고, Read 로 봅니다</text>
  <rect x="60" y="336" width="1160" height="170" rx="10" fill="#1f2937"/>
  <text x="92" y="374" font-family="'Courier New',Courier,monospace" font-size="13.5" font-weight="400" fill="#4ade80">● Bash(웹캠 인식 → 사진 촬영 → capture.jpg 저장)</text>
  <text x="92" y="402" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#6b7280">  └ 캡처가 완료되었습니다</text>
  <line x1="92" y1="420" x2="1188" y2="420" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="450" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Read(capture.jpg)</text>
  <text x="92" y="478" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ 지금 화면에 보이는 걸 확인합니다</text>
  <rect x="60" y="526" width="558.0" height="96" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="339.0" y="564.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#1d4ed8">Bash 로 찍고</text>
  <text x="339.0" y="592.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1d4ed8">사진을 파일로 저장합니다</text>
  <line x1="628.0" y1="574.0" x2="643.0" y2="574.0" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M639.0 567.0L652.0 574.0L639.0 581.0Z" fill="#6b7280"/>
  <rect x="662.0" y="526" width="558.0" height="96" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="941.0" y="564.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#15803d">Read 로 보고</text>
  <text x="941.0" y="592.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#15803d">내용을 설명합니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">한 가지 일을 위해 두 개의 툴이 이어졌습니다</text>
</svg>
