<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 3</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">나머지도 모두</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">프롬프트 한 줄로 남은 6개 파일을 한 번에 처리합니다</text>
  <text x="60" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트</text>
  <rect x="60" y="204" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="230" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="230" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">나머지 파일들도 모두 읽고 파일명 바꿔줘</text>
  <line x1="640" y1="256" x2="640" y2="297" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 293L640 308L647 293Z" fill="#1d4ed8"/>
  <text x="658" y="287.0" font-family="'Courier New',Courier,monospace" font-size="13.5" font-weight="700" fill="#1d4ed8">펼치면</text>
  <rect x="60" y="316" width="1160" height="152" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">이 한 줄이 실제로 시키는 일</text>
  <text x="88" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">1.  practice_files 안 나머지 6개 파일을 하나씩 엽니다</text>
  <text x="88" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">2.  txt · pdf · 이미지 — 형식에 맞게 내용을 읽습니다</text>
  <text x="88" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">3.  내용을 이해하고 어떤 파일인지 파악합니다</text>
  <text x="88" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">4.  내용에 맞는 새 이름을 짓고, 파일명을 바꿉니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">프롬프트 한 줄이 에이전트 안에서 여러 단계로 풀립니다</text>
