<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 1</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude Code 설치</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">터미널에 명령 한 줄을 붙여넣고 Enter</text>
  <rect x="60" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="190" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="224" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Windows · PowerShell</text>
  <rect x="84" y="262" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="104" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">irm https://claude.ai/install.ps1 |</text>
  <text x="104" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">  iex</text>
  <text x="84" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">설치가 끝나면 claude 명령을 바로 쓸 수 있습니다</text>
  <rect x="660" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="190" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="224" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS · Terminal</text>
  <rect x="684" y="262" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="704" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">curl -fsSL https://claude.ai/install.sh</text>
  <text x="704" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">  | bash</text>
  <text x="684" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">설치가 끝나면 claude 명령을 바로 쓸 수 있습니다</text>
  <rect x="60" y="512" width="1160" height="78" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="88" y="542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">설치 중 여러 줄의 로그가 지나갑니다 — 끝날 때까지 기다립니다.</text>
  <text x="88" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280">오류 없이 프롬프트(&gt; )가 다시 보이면 설치가 끝난 것입니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">윈도우는 PowerShell, macOS 는 터미널(Terminal) 앱에 붙여넣습니다</text>
</svg>
