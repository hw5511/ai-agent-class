  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 6</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">만든 걸 찾아서 실행</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">테트리스 파일을 찾는 것과 실행하는 것 — 한 줄로 둘 다 시킵니다</text>
  <text x="60" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트</text>
  <rect x="60" y="206" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="232" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="232" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">현재 폴더에 테트리스 파일 찾아서 실행해줘</text>
  <line x1="640" y1="256" x2="640" y2="279" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 275L640 290L647 275Z" fill="#1d4ed8"/>
  <text x="60" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">찾기 → 실행, 한 번에</text>
  <rect x="60" y="328" width="620" height="270" rx="10" fill="#1f2937"/>
  <text x="92" y="366" font-family="'Courier New',Courier,monospace" font-size="13.5" font-weight="400" fill="#4ade80">● Bash(dir *테트리스*)</text>
  <text x="92" y="394" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#6b7280">  └ 테트리스.html 을 찾았습니다</text>
