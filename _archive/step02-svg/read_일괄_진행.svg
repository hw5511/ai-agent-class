<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 3</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">한 파일씩 읽어나갑니다</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">Claude 가 파일을 하나씩 순서대로 처리합니다</text>
  <text x="60" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">진행 로그</text>
  <rect x="60" y="208" width="1160" height="356" rx="10" fill="#1f2937"/>
  <text x="92" y="246" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Read(practice_files/temp_1104.txt)</text>
  <text x="92" y="274" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ Read 18 lines</text>
  <text x="92" y="302" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#4ade80">● Bash(mv temp_1104.txt → 업무메모_거래처_경비정산.txt)</text>
  <text x="92" y="330" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ 완료</text>
  <line x1="92" y1="348" x2="1188" y2="348" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="378" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Read(practice_files/report_final_v2.pdf)</text>
  <text x="92" y="406" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ Read 3 pages</text>
  <text x="92" y="434" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#4ade80">● Bash(mv report_final_v2.pdf → 2026_1분기_영업실적_보고서.pdf)</text>
  <text x="92" y="462" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  └ 완료</text>
  <line x1="92" y1="480" x2="1188" y2="480" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="510" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#6b7280">  ... 나머지 4개 파일도 같은 방식으로 계속됩니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">읽고 → 이해하고 → 이름을 바꾸고, 파일마다 이 과정을 반복합니다</text>
</svg>
