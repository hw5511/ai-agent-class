  <text x="84" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">SVG 로 그린</text>
  <text x="84" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">귀여운 슬라임 모양</text>
  <rect x="296" y="368" width="216" height="170" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
