  <text x="88" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">AI 가 요청 하나를 디자인 · 코드 작성 · 실행까지 한 번에 처리합니다.</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">요청 하나가 디자인·코딩·실행까지 전부를 담고 있습니다</text>
