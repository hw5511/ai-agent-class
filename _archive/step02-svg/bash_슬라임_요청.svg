  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">바탕화면 위젯 만들기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">이번엔 파일 하나가 아니라, 프로그램을 통째로 만들고 실행까지 시킵니다</text>
  <text x="60" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트 (조금 깁니다)</text>
  <rect x="60" y="208" width="1160" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
