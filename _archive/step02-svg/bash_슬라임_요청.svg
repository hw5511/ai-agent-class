  <text x="94" y="234" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">svg 로 귀여운 슬라임 같은 캐릭터를 간단하게 디자인해서, 바탕화면에 떠서 마우스로 들었다 놓을 수 있는(중력 적용) 프로그램을 파이썬으로 만들어서 실행해줄래? 슬라임</text>
  <text x="94" y="258" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">우클릭 또는 트레이 아이콘에 "종료" 메뉴를 넣어줘</text>
  <line x1="640" y1="286" x2="640" y2="315" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 311L640 326L647 311Z" fill="#1d4ed8"/>
  <text x="658" y="311.0" font-family="'Courier New',Courier,monospace" font-size="13.5" font-weight="700" fill="#1d4ed8">요청 안에 담긴 다섯 가지</text>
  <text x="60" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">이 한 줄에 담긴 요소 다섯 가지</text>
  <rect x="60" y="368" width="216" height="170" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
