  <text x="320" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="0.06em">②</text>
  <text x="320" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" fill="#0a0a0a">바탕화면에 표시</text>
  <text x="320" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">다른 창 위에</text>
  <text x="320" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">항상 떠 있음</text>
  <rect x="532" y="368" width="216" height="170" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="532" y="368" width="216" height="8" fill="#15803d"/>
  <text x="556" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d" letter-spacing="0.06em">③</text>
  <text x="556" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" fill="#0a0a0a">마우스로 집기</text>
  <text x="556" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">클릭한 채</text>
  <text x="556" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563">끌 수 있음</text>
  <rect x="768" y="368" width="216" height="170" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
