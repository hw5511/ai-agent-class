<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 1</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">터미널을 오른쪽으로</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">TERMINAL 글자를 우클릭 → Panel Position → Right</text>
  <rect x="60" y="190" width="1160" height="420" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>
  <rect x="60" y="190" width="1160" height="32" fill="#252526"/>
  <text x="78" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">TERMINAL</text>
  <rect x="76" y="220" width="62" height="2" fill="#007acc"/>
  <text x="150" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#858585">OUTPUT</text>
  <text x="212" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#858585">PORTS</text>
  <rect x="60" y="222" width="1160" height="388" fill="#181818"/>
  <text x="80" y="254" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">PS C:\...\agent1&gt;</text>
  <rect x="60" y="258" width="260" height="172" rx="4" fill="#2d2d2d" stroke="#454545" stroke-width="1"/>
  <text x="78" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Move Terminal into Editor Area</text>
  <text x="78" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Rename...</text>
  <text x="78" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Change Color...</text>
  <text x="78" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Change Icon...</text>
  <text x="78" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Split Terminal</text>
  <rect x="60" y="389" width="260" height="28" fill="#094771"/>
  <text x="78" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff">Panel Position</text>
  <text x="300" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#ffffff">▶</text>
  <text x="78" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Kill Terminal</text>
  <rect x="320" y="358" width="190" height="116" rx="4" fill="#2d2d2d" stroke="#454545" stroke-width="1"/>
  <text x="338" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Top</text>
  <text x="338" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Left</text>
  <rect x="320" y="415" width="190" height="28" fill="#094771"/>
  <text x="338" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Right</text>
  <text x="478" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80">✓</text>
  <text x="338" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#d4d4d4">Bottom</text>
  <text x="560" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">← 여기를 클릭</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">앞으로 모든 실습은 이 배치(편집기 왼쪽, 터미널 오른쪽)로 진행합니다</text>
</svg>
