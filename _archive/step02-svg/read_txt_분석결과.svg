  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 3</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">Claude가 읽은 내용</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">Read 툴로 파일을 열고 바로 요약합니다</text>
  <text x="60" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">Claude 의 응답</text>
  <rect x="60" y="212" width="1160" height="400" rx="10" fill="#1f2937"/>
  <text x="92" y="250" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" fill="#4ade80">● Read(practice_files/doc_230928_v3.txt)</text>
  <text x="92" y="278" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#6b7280">  └ Read 24 lines</text>
  <line x1="92" y1="296" x2="1188" y2="296" stroke="#374151" stroke-dasharray="4 4"/>
  <text x="92" y="326" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">2026년 3월 9일 회의록입니다. 참석자는 이팀장·박대리·김주임·최인턴입니다.</text>
  <text x="92" y="354" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#e5e7eb"></text>
  <text x="92" y="382" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">안건1) Q1 실적 검토 — 매출 12% 증가, 반품률 3.2%, 고객 불만 14건</text>
  <text x="92" y="410" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#e5e7eb">안건2) 다음 분기 캠페인 — SNS 예산 20% 증액, 신제품 5월 중순 출시</text>
  <text x="92" y="438" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="400" fill="#e5e7eb"></text>
  <text x="92" y="466" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#4ade80">결정사항 — 반품 원인 분석 보고서: 박대리(3/14) · 캠페인 기획안: 김주임(3/20)</text>
  <text x="92" y="494" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#67e8f9">다음 회의 — 3월 23일 오전 10시</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">실제 파일을 열어 확인해보세요 — 지어낸 게 아니라 정말 읽은 겁니다</text>
