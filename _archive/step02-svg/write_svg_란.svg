<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">svg 가 뭔가요?</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">사진과 다르게, svg 는 그림을 그리라고 적어둔 코드입니다</text>
  <rect x="60" y="210" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="210" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="244" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">사진 (jpg · png)</text>
  <rect x="84" y="282" width="512" height="106" rx="8" fill="#1f2937"/>
  <text x="104" y="310" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">●●●●●●●●●●</text>
  <text x="104" y="334" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">●●●●●●●●●●</text>
  <text x="104" y="358" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">점(픽셀)을 촘촘히 찍어 그림을 표현</text>
  <text x="84" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">확대하면 점이 흐려지고 그림이 깨집니다</text>
  <rect x="660" y="210" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="210" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="244" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">벡터 그림 (svg)</text>
  <rect x="684" y="282" width="512" height="82" rx="8" fill="#1f2937"/>
  <text x="704" y="310" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">&lt;circle cx="60" cy="60" r="40"/&gt;</text>
  <text x="704" y="334" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">&lt;rect x="10" y="70" width="80" height="20"/&gt;</text>
  <text x="684" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">좌표와 도형을 적어둔 코드라 아무리 키워도 안 깨집니다</text>
  <rect x="60" y="526" width="1160" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">지금 보고 있는 이 강의 슬라이드들도 사실 전부 svg 파일로 그려져 있습니다.</text>
</svg>
