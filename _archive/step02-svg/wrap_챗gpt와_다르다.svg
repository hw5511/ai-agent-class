<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 7</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">ChatGPT 와 무엇이 다른가</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">같은 질문도, 돌아오는 것이 다릅니다</text>
  <rect x="60" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="190" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="224" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">ChatGPT</text>
  <rect x="84" y="262" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="104" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">"테트리스 어떻게 만들어?"</text>
  <text x="104" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">→ 설명과 예시 코드만 돌아온다</text>
  <text x="104" y="338" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">실행은 내가 직접 해야 한다</text>
  <text x="104" y="362" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">복사·붙여넣기가 필요하다</text>
  <text x="84" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">답을 글로 돌려준다</text>
  <rect x="660" y="190" width="560" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="190" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="224" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">AI 에이전트</text>
  <rect x="684" y="262" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="704" y="290" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">"테트리스 만들어서 실행해줘"</text>
  <text x="704" y="314" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">→ 파일을 직접 만든다</text>
  <text x="704" y="338" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">→ Bash 로 직접 실행한다</text>
  <text x="704" y="362" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">결과가 화면에 실제로 뜬다</text>
  <text x="684" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">내 컴퓨터에 결과가 실물로 남는다</text>
  <rect x="60" y="510" width="1160" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="88" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#15803d">오늘의 증거</text>
  <text x="88" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">테트리스 게임과 바탕화면 슬라임 위젯이 실제로 내 컴퓨터에 남았습니다</text>
</svg>
