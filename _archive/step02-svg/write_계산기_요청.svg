<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 4</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">계산기 만들기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">파이썬과 tkinter 로 계산기 프로그램을 요청합니다</text>
  <text x="60" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">지금 입력하는 요청</text>
  <rect x="60" y="222" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="248" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="248" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">파이썬과 tkinter 를 설치해서 간단한 계산기 프로그램 만들어줘</text>
  <text x="60" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">맥(macOS)은 한 가지가 더 필요합니다</text>
  <rect x="60" y="324" width="560" height="290" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="324" width="560" height="48" rx="12" fill="#f3f4f6"/>
  <rect x="60" y="358" width="560" height="14" fill="#f3f4f6"/>
  <text x="88" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Windows</text>
  <rect x="84" y="396" width="512" height="154" rx="8" fill="#1f2937"/>
  <text x="104" y="424" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">위 프롬프트 그대로</text>
  <text x="104" y="448" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">입력하면 됩니다</text>
  <text x="104" y="472" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc"></text>
  <text x="104" y="496" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">설치부터 실행까지</text>
  <text x="104" y="520" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">한 번에 진행됩니다</text>
  <text x="84" y="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">추가로 할 일이 없습니다</text>
  <rect x="660" y="324" width="560" height="290" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="660" y="324" width="560" height="48" rx="12" fill="#f5f3ff"/>
  <rect x="660" y="358" width="560" height="14" fill="#f5f3ff"/>
  <text x="688" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9">macOS</text>
  <rect x="684" y="396" width="512" height="130" rx="8" fill="#1f2937"/>
  <text x="704" y="424" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">① python3 --version 으로</text>
  <text x="704" y="448" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">   파이썬 버전 확인</text>
  <text x="704" y="472" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">② 그 버전에 맞는 tk 설치</text>
  <text x="704" y="496" font-family="'Courier New',Courier,monospace" font-size="12.5" font-weight="400" fill="#a5f3fc">   예: 3.12 → brew install python-tk@3.12</text>
  <text x="684" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563">이 내용을 프롬프트에 같이 적어주면 됩니다</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">버전 번호는 예시입니다 — 내 화면에 뜨는 숫자를 씁니다</text>
</svg>
