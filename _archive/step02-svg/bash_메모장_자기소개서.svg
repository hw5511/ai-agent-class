<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 6</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">만들고, 그 폴더까지 열어주기</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">파일을 만드는 것과 폴더를 여는 것 — 두 가지 일을 한 번에 시킵니다</text>
  <text x="60" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">학생이 입력하는 프롬프트</text>
  <rect x="60" y="210" width="1160" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="236" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#4ade80">&gt;</text>
  <text x="94" y="236" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#a5f3fc">바탕화면에 메모장으로 자기소개서를 만들고 저장된 폴더를 열어줘</text>
  <line x1="640" y1="262" x2="640" y2="289" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M633 285L640 300L647 285Z" fill="#1d4ed8"/>
  <text x="658" y="286.0" font-family="'Courier New',Courier,monospace" font-size="13.5" font-weight="700" fill="#1d4ed8">두 가지 일이 한 번에</text>
  <text x="60" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="0.08em">한 번에 끝나는 두 가지 일</text>
  <rect x="60" y="348" width="558.0" height="118" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="339.0" y="397.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#1d4ed8">자기소개서.txt 작성</text>
  <text x="339.0" y="425.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1d4ed8">메모장으로 내용을 씁니다</text>
  <line x1="628.0" y1="407.0" x2="643.0" y2="407.0" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M639.0 400.0L652.0 407.0L639.0 414.0Z" fill="#6b7280"/>
  <rect x="662.0" y="348" width="558.0" height="118" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="941.0" y="397.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="800" fill="#15803d">바탕화면 폴더 열기</text>
  <text x="941.0" y="425.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#15803d">저장된 위치를 탐색기로 엽니다</text>
  <rect x="340" y="490" width="600" height="124" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="340" y="490" width="600" height="32" rx="10" fill="#f3f4f6"/>
  <rect x="356" y="500" width="10" height="4" fill="#c9a26a"/>
  <rect x="352" y="504" width="40" height="20" rx="3" fill="#dcb67a"/>
  <text x="402" y="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0a0a0a">바탕화면</text>
  <rect x="352" y="534" width="576" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <path d="M368 548h14l4 4v14h-18z" fill="#2563eb" opacity="0.9"/>
  <text x="398" y="566" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" fill="#1d4ed8">자기소개서.txt</text>
  <text x="920" y="566" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6b7280">방금 저장됨</text>
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af">요청 하나에 여러 단계가 들어 있어도 Claude 는 순서대로 다 처리합니다</text>
</svg>
