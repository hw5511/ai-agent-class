<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="60" y="44" width="78" height="24" rx="12" fill="#171717"/>
  <text x="99" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#fafafa" letter-spacing="0.8">BASIC 02</text>
  <rect x="150" y="44" width="66" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="183" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">STEP 2</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#0a0a0a" letter-spacing="-0.02em">정리</text>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#6b7280">CLAUDE.md 파일 하나로 에이전트의 정체성을 바꿨습니다</text>
  <text x="92" y="210" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="210" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">작성</text>
  <text x="248" y="210" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">agent1/.claude/CLAUDE.md 에 이름·역할·말투를 적었다</text>
  <text x="92" y="252" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="252" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">로드</text>
  <text x="248" y="252" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">세션이 시작될 때 자동으로 읽혔다</text>
  <text x="92" y="294" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">[v]</text>
  <text x="140" y="294" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#4ade80">반영</text>
  <text x="248" y="294" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="400" fill="#4ade80">/clear 로 새 대화방을 열자 답변이 바뀌었다</text>
  <rect x="60" y="360" width="1160" height="54" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="88" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#166534">말 한마디 한마디로 지시하는 대신, 파일 하나로 "항상 그런 존재" 를 만든 것입니다</text>
  <rect x="60" y="452" width="1160" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="88" y="482" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">다음 시간</text>
  <text x="88" y="508" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#1e40af">에이전트가 프로젝트 파일을 직접 읽는 Read 툴을 다룹니다</text>
