name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build from JSON sources
        run: python build.py

      - name: Prepare deployment
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r assets _site/assets
          mkdir -p _site/template
          cp template/index.html _site/template/index.html
          mkdir -p _site/consultation-template
          cp consultation-template/index.html _site/consultation-template/index.html
          cp -r consultation _site/consultation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
