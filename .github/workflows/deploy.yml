name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build from JSON sources
        run: python build.py

      - name: Prepare deployment
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # 1·2회차 슬라이드는 이제 PNG 다(slidekit2 렌더). 예전에는 .svg 만 참조돼서 PNG 를
          # 통째로 지웠는데, 그대로 두면 새 슬라이드가 전부 404 가 된다 — 검증 캡처만 지운다.
          cp -r assets _site/assets
          rm -rf _site/assets/basic/_check
          cp -r consultation _site/consultation
          cp -r playwright_demo _site/playwright_demo
          # overview/index.html 은 build.py 산출물(.gitignore) — 위 build 스텝이 만든 것을 옮긴다
          cp -r overview _site/overview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
