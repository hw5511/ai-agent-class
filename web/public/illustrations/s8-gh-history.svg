<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>
<g transform="translate(-89.1,-33.8) scale(1.1121)">

<!-- timeline line -->
<line x1="220" y1="420" x2="1380" y2="420" stroke="#c9ccd1" stroke-width="6"/>

<!-- dot 1 -->
<circle cx="300" cy="420" r="26" fill="#1273c4"/>
<rect x="190" y="470" width="220" height="60" rx="14" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
<text x="300" y="508" font-size="28" fill="#101113" font-weight="800" text-anchor="middle">첫 페이지</text>

<!-- dot 2 -->
<circle cx="633" cy="420" r="26" fill="#1273c4"/>
<rect x="523" y="470" width="220" height="60" rx="14" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
<text x="633" y="508" font-size="28" fill="#101113" font-weight="800" text-anchor="middle">A 방식</text>

<!-- dot 3 (failed) -->
<circle cx="966" cy="420" r="26" fill="#fff" stroke="#c0392b" stroke-width="6"/>
<g stroke="#c0392b" stroke-width="6" stroke-linecap="round">
<path d="M954 408 l24 24"/>
<path d="M978 408 l-24 24"/>
</g>
<rect x="856" y="470" width="220" height="60" rx="14" fill="#fff" stroke="#c0392b" stroke-width="3"/>
<text x="966" y="508" font-size="28" fill="#c0392b" font-weight="800" text-anchor="middle">A 방식 실패</text>

<!-- dot 4 -->
<circle cx="1300" cy="420" r="26" fill="#1273c4"/>
<rect x="1190" y="470" width="220" height="60" rx="14" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
<text x="1300" y="508" font-size="28" fill="#101113" font-weight="800" text-anchor="middle">B 방식</text>

<!-- curved return arrow from failed dot back to dot 2 -->
<path d="M966 340 Q800 250 633 340" stroke="#1273c4" stroke-width="6" fill="none" marker-end="url(#ab)"/>
<text x="800" y="230" font-size="28" fill="#1273c4" font-weight="800" text-anchor="middle">되돌리기</text>

<text x="800" y="660" font-size="36" fill="#101113" font-weight="900" text-anchor="middle">수정 이력 = 왜 고쳤는지 메모</text>
</g>
</svg>
