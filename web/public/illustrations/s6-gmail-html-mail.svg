<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
  <filter id="gm-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#101113" flood-opacity="0.2"/></filter>
  <linearGradient id="gm-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6fb7ee"/>
    <stop offset="1" stop-color="#d6ecfc"/>
  </linearGradient>
  <clipPath id="gm-hero"><rect x="480" y="315" width="640" height="190"/></clipPath>
</defs>

<!-- window -->
<g filter="url(#gm-sh)"><rect x="40" y="30" width="1520" height="840" rx="12" fill="#ffffff"/></g>
<rect x="40" y="30" width="1520" height="840" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>

<!-- thin top bar -->
<line x1="40" y1="74" x2="1560" y2="74" stroke="#e5e5e5" stroke-width="2"/>
<circle cx="72" cy="52" r="6" fill="#d4d4d4"/><circle cx="94" cy="52" r="6" fill="#d4d4d4"/><circle cx="116" cy="52" r="6" fill="#d4d4d4"/>

<!-- subject -->
<text x="100" y="138" font-size="42" font-weight="700" fill="#171717">[테스트] 이번 주 추천 소식이 도착했어요</text>

<!-- sender row -->
<circle cx="124" cy="196" r="26" fill="#1273c4"/>
<circle cx="124" cy="188" r="9" fill="#ffffff"/>
<path d="M107 210 Q124 192 141 210 Z" fill="#ffffff"/>
<text x="168" y="192" font-size="26" font-weight="700" fill="#171717">나 <tspan font-weight="400" fill="#525252">&lt;student@gmail.com&gt;</tspan></text>
<text x="168" y="226" font-size="25" fill="#737373">받는사람: 나</text>
<line x1="100" y1="250" x2="1500" y2="250" stroke="#e5e5e5" stroke-width="2"/>

<!-- email card -->
<rect x="480" y="265" width="640" height="575" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>

<!-- dark header strip -->
<rect x="480" y="265" width="640" height="50" fill="#1f2937"/>
<text x="800" y="299" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">WEEKLY PICK</text>

<!-- hero picture (flat landscape) -->
<g clip-path="url(#gm-hero)">
  <rect x="480" y="315" width="640" height="190" fill="url(#gm-sky)"/>
  <circle cx="940" cy="375" r="36" fill="#ffd54a"/>
  <ellipse cx="620" cy="360" rx="50" ry="14" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="660" cy="350" rx="34" ry="11" fill="#ffffff" opacity="0.85"/>
  <path d="M480 470 Q600 380 730 460 Q790 495 840 505 L480 505 Z" fill="#4f9d6b"/>
  <path d="M600 505 Q780 400 930 450 Q1040 420 1120 470 L1120 505 Z" fill="#2f7d50"/>
</g>

<!-- headline and text -->
<text x="800" y="562" font-size="36" font-weight="700" fill="#171717" text-anchor="middle">이번 주 추천 소식이 도착했어요</text>
<rect x="560" y="592" width="480" height="12" rx="6" fill="#d4d4d4"/>
<rect x="600" y="620" width="400" height="12" rx="6" fill="#d4d4d4"/>

<!-- button -->
<rect x="670" y="656" width="260" height="68" rx="14" fill="#1273c4"/>
<text x="800" y="700" font-size="29" font-weight="700" fill="#ffffff" text-anchor="middle">자세히 보기</text>

<!-- footer -->
<line x1="480" y1="762" x2="1120" y2="762" stroke="#e5e5e5" stroke-width="2"/>
<text x="800" y="806" font-size="24" fill="#737373" text-anchor="middle">이 메일은 테스트로 발송되었습니다 · 수신거부</text>
</svg>
