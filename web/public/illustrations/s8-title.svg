<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>
<g transform="translate(0.5,10.5) scale(1)">

<!-- card 1: GitHub (folder + cloud) -->
<g filter="url(#sh)">
<rect x="140" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<path d="M225 400 h60 l18 -22 h72 a14 14 0 0 1 14 14 v100 a14 14 0 0 1 -14 14 h-150 a14 14 0 0 1 -14 -14 v-78 a14 14 0 0 1 14 -14 z" fill="#cfe5f5" stroke="#1273c4" stroke-width="4"/>
<path d="M255 370 q-34 0 -34 32 q-24 2 -24 26 q0 26 26 26 h130 q28 0 28 -28 q0 -26 -26 -28 q-2 -28 -30 -28 q-14 0 -22 8 q-8 -8 -22 -8 z" fill="#fff" stroke="#1273c4" stroke-width="4"/>
<text x="290" y="560" font-size="34" fill="#101113" font-weight="800" text-anchor="middle">GitHub</text>

<!-- card 2: 데스크톱 앱 (window with orange asterisk) -->
<g filter="url(#sh)">
<rect x="480" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="540" y="350" width="180" height="140" rx="14" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
<rect x="540" y="350" width="180" height="34" rx="14" fill="#eef2f5"/>
<circle cx="560" cy="367" r="6" fill="#ff5f57"/><circle cx="580" cy="367" r="6" fill="#febc2e"/><circle cx="600" cy="367" r="6" fill="#28c840"/>
<g stroke="#d97757" stroke-width="8" stroke-linecap="round">
<path d="M630 420 v50"/>
<path d="M605 432 l50 26"/>
<path d="M655 432 l-50 26"/>
</g>
<text x="630" y="560" font-size="30" fill="#101113" font-weight="800" text-anchor="middle">데스크톱 앱</text>

<!-- card 3: 클라우드 세션 (cloud + server) -->
<g filter="url(#sh)">
<rect x="820" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="925" y="430" width="120" height="90" rx="10" fill="#43474b"/>
<rect x="940" y="448" width="90" height="10" rx="4" fill="#c9ccd1"/>
<rect x="940" y="466" width="90" height="10" rx="4" fill="#c9ccd1"/>
<rect x="940" y="484" width="60" height="10" rx="4" fill="#c9ccd1"/>
<path d="M925 400 q-30 0 -30 28 q-22 2 -22 24 q0 24 24 24 h122 q26 0 26 -26 q0 -24 -24 -26 q-2 -26 -28 -26 q-12 0 -20 8 q-8 -6 -20 -6 z" fill="#cfe5f5" stroke="#1273c4" stroke-width="4"/>
<text x="985" y="560" font-size="30" fill="#101113" font-weight="800" text-anchor="middle">클라우드 세션</text>

<!-- card 4: 폰 (phone) -->
<g filter="url(#sh)">
<rect x="1160" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="1270" y="345" width="120" height="180" rx="20" fill="#fff" stroke="#1273c4" stroke-width="5"/>
<rect x="1282" y="365" width="96" height="132" rx="4" fill="#cfe5f5"/>
