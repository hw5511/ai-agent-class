<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 245 470 380" width="470" height="380">
  <!-- From the original basic step 1 deck (_archive/step01-svg/AI_에이전트란.svg), left illustration only. -->
<!-- ── 좌측: 신경망 일러스트 ── -->

  <!-- orbit ring -->
  <ellipse cx="320" cy="410" rx="143" ry="130" fill="none" stroke="#1273c4" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.2"/>

  <!-- brain core -->
  <circle cx="320" cy="410" r="78" fill="none" stroke="#1273c4" stroke-width="2" opacity="0.3"/>
  <circle cx="320" cy="410" r="52" fill="none" stroke="#1273c4" stroke-width="2" opacity="0.5"/>
  <circle cx="320" cy="410" r="23" fill="#1273c4" opacity="0.15"/>
  <circle cx="320" cy="410" r="8" fill="#1273c4"/>

  <!-- connections -->
  <line x1="320" y1="410" x2="210" y2="282" stroke="#1273c4" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="410" x2="503" y2="289" stroke="#1273c4" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="410" x2="181" y2="437" stroke="#1273c4" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="410" x2="246" y2="545" stroke="#1273c4" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="410" x2="464" y2="528" stroke="#1273c4" stroke-width="1.5" opacity="0.4"/>

  <!-- SEE node -->
  <circle cx="210" cy="282" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="210" cy="282" r="5" fill="#1273c4"/>
  <text x="210" y="260"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">SEE</text>

  <!-- THINK node -->
  <circle cx="503" cy="289" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="503" cy="289" r="5" fill="#1273c4"/>
  <text x="503" y="267"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">THINK</text>

  <!-- PLAN node -->
  <circle cx="181" cy="437" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="181" cy="437" r="5" fill="#1273c4"/>
  <text x="134" y="441"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">PLAN</text>

  <!-- DO node (우측, 선 없음 - 원본 동일) -->
  <circle cx="529" cy="415" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="529" cy="415" r="5" fill="#1273c4"/>
  <text x="564" y="419"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">DO</text>

  <!-- FIX node -->
  <circle cx="246" cy="545" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="246" cy="545" r="5" fill="#1273c4"/>
  <text x="212" y="569"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">FIX</text>

  <!-- TOOLS node -->
  <circle cx="464" cy="528" r="13" fill="#1273c4" opacity="0.2"/>
  <circle cx="464" cy="528" r="5" fill="#1273c4"/>
  <text x="500" y="552"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="11" font-weight="600" fill="#1273c4">TOOLS</text>

  <!-- loop arrow -->
  <path d="M503 410 Q515 355 475 315" fill="none" stroke="#1273c4" stroke-width="1.5" opacity="0.3"/>
  <polygon points="477,311 471,319 479,319" fill="#1273c4" opacity="0.3"/>

  <!-- AUTONOMOUS LOOP -->
  <text x="320" y="608"
    font-family="Pretendard,'Pretendard Variable',sans-serif"
    text-anchor="middle" font-size="10" fill="#1273c4" opacity="0.5" font-weight="600"
    letter-spacing="0.1em">AUTONOMOUS LOOP</text>

  </svg>
