<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>

<!-- shelf of cartridges (skills waiting) -->
<rect x="120" y="560" width="360" height="16" rx="6" fill="#c9ccd1"/>
<g filter="url(#sh)">
<rect x="150" y="380" width="90" height="180" rx="10" fill="#f4f5f7" stroke="#c9ccd1" stroke-width="3"/>
<rect x="260" y="380" width="90" height="180" rx="10" fill="#f4f5f7" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="165" y="400" width="60" height="24" rx="6" fill="#c9ccd1"/>
<rect x="275" y="400" width="60" height="24" rx="6" fill="#c9ccd1"/>
<text x="195" y="500" font-size="20" fill="#8b9095" font-weight="700" text-anchor="middle">스킬</text>
<text x="305" y="500" font-size="20" fill="#8b9095" font-weight="700" text-anchor="middle">스킬</text>

<!-- highlighted cartridge moving toward the slot -->
<g filter="url(#sh)">
<rect x="420" y="340" width="120" height="220" rx="12" fill="#fff" stroke="#1273c4" stroke-width="5"/>
</g>
<rect x="444" y="364" width="72" height="30" rx="8" fill="#fff" stroke="#1273c4" stroke-width="4"/>
<text x="480" y="470" font-size="26" fill="#1273c4" font-weight="900" text-anchor="middle">카드뉴스</text>

<path d="M556 450 Q660 420 760 450" fill="none" stroke="#1273c4" stroke-width="6" marker-end="url(#ab)"/>

<!-- console with slot -->
<g filter="url(#sh)">
<rect x="780" y="330" width="220" height="300" rx="20" fill="#2b2e33"/>
</g>
<rect x="820" y="380" width="140" height="40" rx="8" fill="#101113"/>
<rect x="830" y="392" width="120" height="16" rx="6" fill="#43474b"/>
<circle cx="890" cy="560" r="26" fill="#3a3e44"/>
<text x="890" y="700" font-size="26" fill="#101113" font-weight="800" text-anchor="middle">프롬프트</text>

<path d="M1010 460 Q1090 440 1170 460" fill="none" stroke="#43474b" stroke-width="6" marker-end="url(#ab)"/>

<!-- Claude, active -->
<circle cx="1330" cy="460" r="120" fill="#fff4ef" stroke="#f0c9b8" stroke-width="3" filter="url(#sh)"/>
<text x="1330" y="475" font-size="46" fill="#d97757" font-weight="900" text-anchor="middle">Claude</text>
<circle cx="1420" cy="360" r="18" fill="#2f9e6e"/>
<text x="1420" y="398" font-size="20" fill="#2f9e6e" font-weight="800" text-anchor="middle">ON</text>

<text x="800" y="800" font-size="40" fill="#101113" font-weight="900" text-anchor="middle">필요할 때만 장전하는 스킬</text>

<circle cx="480" cy="315" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="480" y="324" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<circle cx="890" cy="365" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="890" y="374" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<circle cx="1240" cy="360" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="1240" y="369" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text>
