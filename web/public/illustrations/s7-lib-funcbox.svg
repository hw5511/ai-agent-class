<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>

<!-- top pair: 1 -> box -> 4 -->
<circle cx="330" cy="290" r="56" fill="#fff4ef" stroke="#f0c9b8" stroke-width="3" filter="url(#sh)"/>
<text x="330" y="305" font-size="42" fill="#d97757" font-weight="900" text-anchor="middle">1</text>
<path d="M390 290 H680" stroke="#1273c4" stroke-width="6" marker-end="url(#ab)"/>

<!-- box -->
<g filter="url(#sh)">
<rect x="690" y="220" width="220" height="460" rx="24" fill="#101113"/>
</g>
<text x="800" y="330" font-size="40" fill="#fff" font-weight="900" text-anchor="middle">함수</text>
<text x="800" y="470" font-size="70" fill="#43474b" font-weight="900" text-anchor="middle" opacity="0.55">?</text>
<text x="800" y="600" font-size="20" fill="#6b7076" font-weight="700" text-anchor="middle" opacity="0.5">y = x + 3</text>

<path d="M920 290 H1210" stroke="#1273c4" stroke-width="6" marker-end="url(#ab)"/>
<circle cx="1270" cy="290" r="56" fill="#eef7ea" stroke="#bfe0c8" stroke-width="3" filter="url(#sh)"/>
<text x="1270" y="305" font-size="42" fill="#2f9e6e" font-weight="900" text-anchor="middle">4</text>

<!-- bottom pair: 2 -> box -> 5 -->
<circle cx="330" cy="610" r="56" fill="#fff4ef" stroke="#f0c9b8" stroke-width="3" filter="url(#sh)"/>
<text x="330" y="625" font-size="42" fill="#d97757" font-weight="900" text-anchor="middle">2</text>
<path d="M390 610 H680" stroke="#1273c4" stroke-width="6" marker-end="url(#ab)"/>
<path d="M920 610 H1210" stroke="#1273c4" stroke-width="6" marker-end="url(#ab)"/>
<circle cx="1270" cy="610" r="56" fill="#eef7ea" stroke="#bfe0c8" stroke-width="3" filter="url(#sh)"/>
<text x="1270" y="625" font-size="42" fill="#2f9e6e" font-weight="900" text-anchor="middle">5</text>

<text x="800" y="800" font-size="36" fill="#101113" font-weight="900" text-anchor="middle">넣으면 3 이 더해져 나온다 · 내부를 몰라도 규칙은 안다</text>

<circle cx="500" cy="255" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="500" y="264" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<circle cx="500" cy="575" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="500" y="584" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<circle cx="800" cy="655" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="800" y="664" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text>
</svg>
