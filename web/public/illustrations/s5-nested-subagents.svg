  <marker id="s5ns-arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9ea3"/></marker>
  <symbol id="s5ns-mascot" viewBox="0 0 18 6" preserveAspectRatio="none" shape-rendering="crispEdges"><rect x="3" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="3" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="4" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="5" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="4" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="6" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="7" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="6" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="7" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="8" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="9" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="8" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="9" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="10" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="11" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="10" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="11" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="12" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="13" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="13" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="14" y="0" width="1.02" height="1.02" fill="#d97757"/><rect x="14" y="1" width="1.02" height="1.02" fill="#d97757"/><rect x="1" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="2" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="3" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="3" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="4" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="5" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="4" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="5" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="6" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="7" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="6" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="7" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="8" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="9" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="8" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="9" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="10" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="11" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="10" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="11" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="12" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="13" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="12" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="13" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="14" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="15" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="14" y="3" width="1.02" height="1.02" fill="#d97757"/><rect x="16" y="2" width="1.02" height="1.02" fill="#d97757"/><rect x="4" y="4" width="1.02" height="1.02" fill="#d97757"/><rect x="6" y="4" width="1.02" height="1.02" fill="#d97757"/><rect x="11" y="4" width="1.02" height="1.02" fill="#d97757"/><rect x="13" y="4" width="1.02" height="1.02" fill="#d97757"/></symbol>
