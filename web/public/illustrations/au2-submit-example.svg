<g filter="url(#shs)"><rect x="368.0" y="150" width="1056.0" height="660.0" fill="#fff" stroke="#e5e5e5" stroke-width="2"/></g>
<g transform="translate(368.0 150) scale(0.66)"><text x="110" y="118" font-size="26" font-weight="700" fill="#5b6570" text-anchor="start">아이디어 제목</text><text x="110" y="204" font-size="76" font-weight="900" fill="#101113" text-anchor="start">주간 업무 보고 취합 자동화</text><text x="110" y="296" font-size="26" font-weight="700" fill="#5b6570" text-anchor="start">간단한 설명</text><text x="110" y="352" font-size="32" font-weight="500" fill="#2b2f35" text-anchor="start">팀원 8명의 주간 보고 메일을 모아 완료, 진행 중, 이슈로 나누고,</text><text x="110" y="398" font-size="32" font-weight="500" fill="#2b2f35" text-anchor="start">팀 보고서 양식에 채워 팀장에게 보내는 자동화</text><text x="110" y="470" font-size="26" font-weight="700" fill="#5b6570" text-anchor="start">아이디어 계기</text><text x="110" y="530" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">매주 월요일 오전, 팀장이 8통의 메일을</text><text x="110" y="574" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">하나씩 열어 복사해 붙이며 2시간을 쓰는</text><text x="110" y="618" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">모습을 보고 시작함</text><text x="820" y="470" font-size="26" font-weight="700" fill="#5b6570" text-anchor="start">왜 필요한가?</text><circle cx="826" cy="520" r="5" fill="#2b2f35"/><text x="846" y="530" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">매주 2시간이 걸림</text><circle cx="826" cy="564" r="5" fill="#2b2f35"/><text x="846" y="574" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">빠진 사람 확인이 늦음</text><circle cx="826" cy="608" r="5" fill="#2b2f35"/><text x="846" y="618" font-size="29" font-weight="500" fill="#2b2f35" text-anchor="start">이슈가 다른 내용 사이에 묻힘</text><text x="110" y="690" font-size="26" font-weight="700" fill="#5b6570" text-anchor="start">다이어그램 구조도</text><rect x="110.0" y="736" width="290" height="150" rx="18" fill="#fff" stroke="#c9ccd1" stroke-width="2.5"/><text x="134.0" y="778" font-size="24" font-weight="800" fill="#1273c4" text-anchor="start" font-family="'D2Coding', Consolas, 'Courier New', monospace">1</text><text x="255.0" y="826" font-size="29" font-weight="800" fill="#101113" text-anchor="middle">보고 메일 가져오기</text><text x="255.0" y="864" font-size="22" font-weight="600" fill="#5b6570" text-anchor="middle">메일함에서 검색</text><line x1="414.0" y1="811.0" x2="459.3333333333333" y2="811.0" stroke="#8a9099" stroke-width="3" stroke-linecap="round"/><path d="M459.3 811.0L443.3 821.0L443.3 801.0Z" fill="#8a9099"/><rect x="473.3333333333333" y="736" width="290" height="150" rx="18" fill="#fff" stroke="#c9ccd1" stroke-width="2.5"/><text x="497.3333333333333" y="778" font-size="24" font-weight="800" fill="#1273c4" text-anchor="start" font-family="'D2Coding', Consolas, 'Courier New', monospace">2</text><text x="618.3333333333333" y="826" font-size="29" font-weight="800" fill="#101113" text-anchor="middle">항목 나누기</text><text x="618.3333333333333" y="864" font-size="22" font-weight="600" fill="#5b6570" text-anchor="middle">AI 로 3개 항목 분류</text><line x1="777.3333333333333" y1="811.0" x2="822.6666666666666" y2="811.0" stroke="#8a9099" stroke-width="3" stroke-linecap="round"/><path d="M822.7 811.0L806.7 821.0L806.7 801.0Z" fill="#8a9099"/><rect x="836.6666666666666" y="736" width="290" height="150" rx="18" fill="#fff" stroke="#c9ccd1" stroke-width="2.5"/><text x="860.6666666666666" y="778" font-size="24" font-weight="800" fill="#1273c4" text-anchor="start" font-family="'D2Coding', Consolas, 'Courier New', monospace">3</text><text x="981.6666666666666" y="826" font-size="29" font-weight="800" fill="#101113" text-anchor="middle">팀 보고서 채우기</text><text x="981.6666666666666" y="864" font-size="22" font-weight="600" fill="#5b6570" text-anchor="middle">양식에 값 넣기</text><line x1="1140.6666666666665" y1="811.0" x2="1185.9999999999998" y2="811.0" stroke="#8a9099" stroke-width="3" stroke-linecap="round"/><path d="M1186.0 811.0L1170.0 821.0L1170.0 801.0Z" fill="#8a9099"/><rect x="1200.0" y="736" width="290" height="150" rx="18" fill="#fff" stroke="#c9ccd1" stroke-width="2.5"/><text x="1224.0" y="778" font-size="24" font-weight="800" fill="#1273c4" text-anchor="start" font-family="'D2Coding', Consolas, 'Courier New', monospace">4</text><text x="1345.0" y="826" font-size="29" font-weight="800" fill="#101113" text-anchor="middle">팀장에게 보내기</text><text x="1345.0" y="864" font-size="22" font-weight="600" fill="#5b6570" text-anchor="middle">메일로 발송</text></g>
</svg>
