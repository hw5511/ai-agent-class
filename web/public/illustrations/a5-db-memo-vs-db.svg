<text x="124" y="321" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">3월 12일 오전에 김민수 님이 처음 오셨다.</text>
<text x="124" y="349" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">나이는 34세라고 하셨고, 주말마다 축구를 하신다.</text>
<text x="124" y="377" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">연락처는 010-1234-5678로 적어 주셨다.</text>
<text x="124" y="405" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">이지은 님은 28세이고 등산을 좋아하신다.</text>
<text x="124" y="433" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">산에 갈 때마다 사진을 많이 찍는다고 하셨다.</text>
<text x="124" y="461" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">박서준 님은 41세이며 취미는 독서라고 하셨다.</text>
<text x="124" y="489" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">평일 저녁에는 주로 집에서 책을 읽으신다.</text>
<text x="124" y="517" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">김민수 님의 다음 방문은 다음 주 월요일이다.</text>
<text x="124" y="545" font-size="23" font-weight="500" fill="#5b6570" text-anchor="start">이지은 님은 오후 시간에 방문하기를 원하셨다.</text>
