<text x="1342" y="560" font-size="28" font-weight="700" fill="#1273c4">바르셀로나</text>
<text x="1192" y="610" font-size="28" fill="#7c8288">기간</text>
<text x="1342" y="610" font-size="28" font-weight="700" fill="#1273c4">2박 3일</text>
<text x="1192" y="660" font-size="28" fill="#7c8288">숙소</text>
<text x="1342" y="660" font-size="28" font-weight="700" fill="#1273c4">고딕 지구 호텔</text>
