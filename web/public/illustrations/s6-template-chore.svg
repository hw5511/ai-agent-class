<line x1="746" y1="700" x2="986" y2="700" stroke="#d5d8dc" stroke-width="2"/>

<text x="596" y="758" font-size="28" fill="#7c8288" font-weight="700">칸이 너무 많다</text>

<!-- column 3: AI 가 채운다 -->
<circle cx="1216" cy="340" r="24" fill="#1273c4"/><text x="1216" y="349" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<line x1="1192" y1="390" x2="1792" y2="390" stroke="#1273c4" stroke-width="4"/>
<text x="1192" y="452" font-size="38" font-weight="700" fill="#101113">AI 가 채운다</text>

