<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 840" width="1792" height="840" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<rect x="0" y="0" width="1792" height="840" fill="#fff"/>

<!-- column 1: 템플릿은 많다 -->
<circle cx="24" cy="340" r="24" fill="#1273c4"/><text x="24" y="349" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<line x1="0" y1="390" x2="548" y2="390" stroke="#101113" stroke-width="2"/>
