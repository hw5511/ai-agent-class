<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>

<text x="220" y="260" font-size="140" fill="#cfe5f5" font-weight="900" font-family="Georgia, serif">&#8220;</text>

<g font-size="46" fill="#101113" font-weight="800" text-anchor="middle">
<text x="800" y="280">비개발자인 내가 상상할 수 있는</text>
<text x="800" y="350">수준의 기술은 세기의 천재들이</text>
<text x="800" y="420">오래전에 다 만들어 두었다</text>
</g>

<text x="1380" y="500" font-size="140" fill="#cfe5f5" font-weight="900" font-family="Georgia, serif" text-anchor="end">&#8221;</text>

<line x1="600" y1="480" x2="1000" y2="480" stroke="#e5e5e5" stroke-width="3"/>

<!-- what's left for us: designing the assembly, AI does the wiring -->
<g filter="url(#sh)">
<rect x="360" y="560" width="360" height="140" rx="18" fill="#fff" stroke="#1273c4" stroke-width="4"/>
</g>
<text x="540" y="620" font-size="28" fill="#1273c4" font-weight="900" text-anchor="middle">무엇을 조립할지</text>
<text x="540" y="660" font-size="24" fill="#1273c4" font-weight="700" text-anchor="middle">설계하는 능력</text>

<path d="M740 630 H880" stroke="#43474b" stroke-width="6" marker-end="url(#ab)"/>

<g filter="url(#sh)">
<rect x="890" y="560" width="360" height="140" rx="18" fill="#101113"/>
</g>
<text x="1070" y="620" font-size="28" fill="#7dd88f" font-weight="900" text-anchor="middle">배선과 조립</text>
<text x="1070" y="660" font-size="24" fill="#8fd0ff" font-weight="700" text-anchor="middle">AI 가 대신함</text>

<circle cx="540" cy="545" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="540" y="554" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<circle cx="1070" cy="545" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="1070" y="554" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
</svg>
