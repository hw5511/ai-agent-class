  <rect x="1295" y="277" width="10" height="8" fill="#4e8fd6"/><text x="1310" y="286">Platform.003</text>
  <rect x="1295" y="303" width="10" height="8" fill="#8b7fd6"/><text x="1310" y="312">Platform.004</text>
