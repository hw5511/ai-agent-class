<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
  <filter id="bs-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#101113" flood-opacity="0.2"/></filter>
  <linearGradient id="bs-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d4a5c"/>
