<circle cx="86" cy="77" r="6" fill="#e5645b"/><circle cx="106" cy="77" r="6" fill="#e5c15b"/><circle cx="126" cy="77" r="6" fill="#5be56b"/>
<text x="800" y="82" font-size="15" fill="#cfcfcf" text-anchor="middle">Blender</text>

