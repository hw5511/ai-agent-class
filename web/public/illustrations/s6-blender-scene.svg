<text x="1490" y="750" font-size="13" fill="#9a9a9a" text-anchor="end">250</text>

<!-- MCP connected overlay card -->
<g filter="url(#bs-sh)"><rect x="1170" y="746" width="330" height="76" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/></g>
<circle cx="1206" cy="784" r="14" fill="#d97757"/>
