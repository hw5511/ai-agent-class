<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Pretendard, 'Pretendard Variable', sans-serif">
  <!-- Windows File Explorer: right-click on empty space -> 새로 만들기 -> 폴더, new folder being named 에이전트1.
       Site style: white surfaces, thin neutral borders, one blue accent; folder yellow is the object's own colour. -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101113" flood-opacity="0.10"/>
    </filter>
    <symbol id="folder" viewBox="0 0 96 76">
      <path d="M4 12a8 8 0 0 1 8-8h22l8 9h42a8 8 0 0 1 8 8v43a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#f4c542"/>
      <path d="M4 24h88v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#ffd966"/>
    </symbol>
  </defs>

  <!-- window -->
  <rect x="40" y="30" width="1120" height="620" rx="18" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" filter="url(#sh)"/>
  <!-- title bar -->
  <path d="M40 48a18 18 0 0 1 18-18h1084a18 18 0 0 1 18 18v34H40z" fill="#f7f7f7"/>
  <line x1="40" y1="82" x2="1160" y2="82" stroke="#e5e5e5" stroke-width="2"/>
  <use href="#folder" x="64" y="45" width="28" height="22"/>
  <text x="104" y="63" font-size="18" fill="#43474b">파일 탐색기</text>
  <g stroke="#9a9ea3" stroke-width="2" stroke-linecap="round">
    <line x1="1060" y1="56" x2="1074" y2="56"/>
    <rect x="1094" y="49" width="14" height="14" fill="none"/>
    <path d="M1128 49l14 14m0-14l-14 14"/>
  </g>
  <!-- address bar -->
  <g font-size="17" fill="#43474b">
    <path d="M70 110l-8 8 8 8" fill="none" stroke="#9a9ea3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 110l8 8-8 8" fill="none" stroke="#c7c9cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="98" width="760" height="40" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
    <use href="#folder" x="146" y="108" width="24" height="19"/>
    <text x="182" y="124" font-family="'D2Coding ligature', D2Coding, monospace">C:\Users\student</text>
    <rect x="908" y="98" width="228" height="40" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
    <circle cx="930" cy="117" r="7" fill="none" stroke="#9a9ea3" stroke-width="2"/>
    <line x1="935" y1="122" x2="941" y2="128" stroke="#9a9ea3" stroke-width="2" stroke-linecap="round"/>
    <text x="952" y="124" fill="#9a9ea3">검색</text>
  </g>
  <line x1="40" y1="156" x2="1160" y2="156" stroke="#e5e5e5" stroke-width="2"/>

  <!-- sidebar -->
  <rect x="40" y="157" width="220" height="492" fill="#fafafa"/>
  <line x1="260" y1="157" x2="260" y2="650" stroke="#e5e5e5" stroke-width="2"/>
  <g font-size="18" fill="#43474b">
    <use href="#folder" x="68" y="182" width="24" height="19"/><text x="104" y="198">바탕 화면</text>
    <use href="#folder" x="68" y="226" width="24" height="19"/><text x="104" y="242">다운로드</text>
    <use href="#folder" x="68" y="270" width="24" height="19"/><text x="104" y="286">문서</text>
    <rect x="56" y="304" width="190" height="40" rx="8" fill="#e8f2fb"/>
    <use href="#folder" x="68" y="314" width="24" height="19"/><text x="104" y="330" fill="#101113" font-weight="700">student</text>
  </g>

  <!-- existing folders -->
  <g font-size="18" fill="#43474b" text-anchor="middle">
    <use href="#folder" x="300" y="190" width="96" height="76"/><text x="348" y="292">Downloads</text>
    <use href="#folder" x="440" y="190" width="96" height="76"/><text x="488" y="292">Documents</text>
    <use href="#folder" x="580" y="190" width="96" height="76"/><text x="628" y="292">Pictures</text>
  </g>

  <!-- the new folder, name being typed -->
  <rect x="286" y="330" width="124" height="148" rx="12" fill="#e8f2fb" stroke="#1273c4" stroke-width="2"/>
  <use href="#folder" x="300" y="346" width="96" height="76"/>
  <rect x="294" y="434" width="108" height="34" rx="6" fill="#ffffff" stroke="#1273c4" stroke-width="2.5"/>
  <text x="348" y="457" font-size="18" font-weight="700" fill="#101113" text-anchor="middle">에이전트1</text>
  <line x1="392" y1="441" x2="392" y2="461" stroke="#101113" stroke-width="2"/>

  <!-- right-click menu -->
  <g filter="url(#sh)">
    <rect x="720" y="300" width="250" height="232" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  </g>
  <g font-size="19" fill="#43474b">
    <text x="748" y="340">보기</text>
    <text x="748" y="382">정렬 기준</text>
    <text x="748" y="424">새로 고침</text>
    <line x1="736" y1="444" x2="954" y2="444" stroke="#e5e5e5" stroke-width="2"/>
    <rect x="732" y="456" width="226" height="44" rx="8" fill="#e8f2fb"/>
    <text x="748" y="485" fill="#101113" font-weight="700">새로 만들기</text>
    <path d="M934 470l8 8-8 8" fill="none" stroke="#1273c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- submenu -->
  <g filter="url(#sh)">
    <rect x="978" y="446" width="170" height="150" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  </g>
  <rect x="990" y="458" width="146" height="44" rx="8" fill="#1273c4"/>
  <use href="#folder" x="1004" y="470" width="26" height="21"/>
  <text x="1042" y="487" font-size="19" font-weight="700" fill="#ffffff">폴더</text>
  <g font-size="19" fill="#43474b">
    <text x="1004" y="536">바로 가기</text>
    <text x="1004" y="576">텍스트 문서</text>
  </g>

  <!-- badge 1 on 폴더 -->
  <circle cx="1136" cy="458" r="20" fill="#1273c4" stroke="#ffffff" stroke-width="3"/>
  <text x="1136" y="465" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- dashed link: the menu item creates the folder -->
  <path d="M990 520 C 800 600, 520 600, 412 470" fill="none" stroke="#1273c4" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.7"/>
  <path d="M404 482l6-14 12 10z" fill="#1273c4" opacity="0.7"/>

  <!-- cursor at the menu -->
  <path d="M1080 492l0 30 8-7 6 13 6-3-6-13 11-1z" fill="#101113" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
</svg>
