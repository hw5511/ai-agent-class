<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 840" width="1792" height="840" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<marker id="ar-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1792" height="840" fill="#fff"/>

<!-- left: order button wireframe -->
<rect x="40" y="380" width="440" height="380" rx="20" fill="none" stroke="#d5d8dc" stroke-width="2"/>
<circle cx="22" cy="439" r="22" fill="#1273c4"/><text x="22" y="448" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="76" y="452" font-size="36" font-weight="700" fill="#101113">아이스 아메리카노</text>
<text x="76" y="500" font-size="30" fill="#7c8288">4,500원</text>
<rect x="76" y="600" width="240" height="86" rx="8" fill="#1273c4"/>
<text x="196" y="654" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">주문하기</text>

<!-- connecting line to the command -->
<line x1="316" y1="643" x2="900" y2="643" stroke="#1273c4" stroke-width="3" marker-end="url(#ar-acc)"/>
<circle cx="608" cy="609" r="22" fill="#1273c4"/><text x="608" y="618" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text>

<!-- right: request command -->
<line x1="920" y1="400" x2="1768" y2="400" stroke="#101113" stroke-width="2"/>
<circle cx="942" cy="437" r="22" fill="#1273c4"/><text x="942" y="446" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="1004" y="446" font-size="26" fill="#7c8288">서버 요청 명령어</text>

<text x="920" y="530" font-size="34" font-weight="700" fill="#101113" font-family="'D2Coding', Consolas, 'Courier New', monospace">POST /orders</text>
<text x="920" y="580" font-size="30" fill="#43474b" font-family="'D2Coding', Consolas, 'Courier New', monospace">{ "menu": "americano" }</text>
<text x="920" y="660" font-size="34" font-weight="700" fill="#1273c4" font-family="'D2Coding', Consolas, 'Courier New', monospace">→ 200 OK</text>
<text x="1180" y="660" font-size="34" font-weight="700" fill="#101113">주문 완료</text>

<text x="920" y="770" font-size="30" fill="#43474b">버튼을 누르면 이 명령어가 서버로 날아감</text>
</svg>
