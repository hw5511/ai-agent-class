<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Pretendard, 'Pretendard Variable', sans-serif">
  <!-- Windows File Explorer: right-click read_practice.zip -> 모두 압축 풀기 -> practice_files appears.
       Site style: white surfaces, thin neutral borders, one blue accent; folder yellow is the object's own colour. -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101113" flood-opacity="0.10"/>
    </filter>
    <symbol id="folder" viewBox="0 0 96 76">
      <path d="M4 12a8 8 0 0 1 8-8h22l8 9h42a8 8 0 0 1 8 8v43a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#f4c542"/>
      <path d="M4 24h88v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#ffd966"/>
    </symbol>
  </defs>

  <!-- window -->
  <rect x="40" y="30" width="1120" height="620" rx="18" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" filter="url(#sh)"/>
  <!-- title bar -->
  <path d="M40 48a18 18 0 0 1 18-18h1084a18 18 0 0 1 18 18v34H40z" fill="#f7f7f7"/>
  <line x1="40" y1="82" x2="1160" y2="82" stroke="#e5e5e5" stroke-width="2"/>
  <use href="#folder" x="64" y="45" width="28" height="22"/>
  <text x="104" y="63" font-size="18" fill="#43474b">파일 탐색기</text>
  <g stroke="#9a9ea3" stroke-width="2" stroke-linecap="round">
    <line x1="1060" y1="56" x2="1074" y2="56"/>
    <rect x="1094" y="49" width="14" height="14" fill="none"/>
    <path d="M1128 49l14 14m0-14l-14 14"/>
  </g>
  <!-- address bar -->
  <g font-size="17" fill="#43474b">
    <path d="M70 110l-8 8 8 8" fill="none" stroke="#9a9ea3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 110l8 8-8 8" fill="none" stroke="#c7c9cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="98" width="760" height="40" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
    <use href="#folder" x="146" y="108" width="24" height="19"/>
    <text x="182" y="124" font-family="'D2Coding ligature', D2Coding, monospace">C:\Users\student\agent1</text>
    <rect x="908" y="98" width="228" height="40" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
    <circle cx="930" cy="117" r="7" fill="none" stroke="#9a9ea3" stroke-width="2"/>
    <line x1="935" y1="122" x2="941" y2="128" stroke="#9a9ea3" stroke-width="2" stroke-linecap="round"/>
    <text x="952" y="124" fill="#9a9ea3">검색</text>
  </g>
  <line x1="40" y1="156" x2="1160" y2="156" stroke="#e5e5e5" stroke-width="2"/>

  <!-- sidebar -->
  <rect x="40" y="157" width="220" height="492" fill="#fafafa"/>
  <line x1="260" y1="157" x2="260" y2="650" stroke="#e5e5e5" stroke-width="2"/>
  <g font-size="18" fill="#43474b">
    <use href="#folder" x="68" y="182" width="24" height="19"/><text x="104" y="198">바탕 화면</text>
    <use href="#folder" x="68" y="226" width="24" height="19"/><text x="104" y="242">다운로드</text>
    <use href="#folder" x="68" y="270" width="24" height="19"/><text x="104" y="286">문서</text>
    <use href="#folder" x="68" y="314" width="24" height="19"/><text x="104" y="330">student</text>
    <rect x="56" y="348" width="190" height="40" rx="8" fill="#e8f2fb"/>
    <use href="#folder" x="84" y="358" width="24" height="19"/><text x="120" y="374" fill="#101113" font-weight="700">agent1</text>
  </g>

  <symbol id="zip" viewBox="0 0 96 76">
    <path d="M4 12a8 8 0 0 1 8-8h22l8 9h42a8 8 0 0 1 8 8v43a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#f4c542"/>
    <path d="M4 24h88v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8z" fill="#ffd966"/>
    <rect x="42" y="24" width="12" height="48" fill="#8a8f96"/>
    <g fill="#ffffff"><rect x="44" y="28" width="8" height="4"/><rect x="44" y="38" width="8" height="4"/><rect x="44" y="48" width="8" height="4"/></g>
    <rect x="40" y="56" width="16" height="12" rx="2" fill="#5f6368"/>
  </symbol>

  <!-- the zip file, right-clicked -->
  <rect x="286" y="180" width="170" height="150" rx="12" fill="#e8f2fb" stroke="#1273c4" stroke-width="2"/>
  <use href="#zip" x="323" y="196" width="96" height="76"/>
  <text x="371" y="302" font-size="17" fill="#101113" font-weight="700" text-anchor="middle">read_practice.zip</text>

  <!-- right-click menu -->
  <g filter="url(#sh)">
    <rect x="470" y="200" width="270" height="226" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  </g>
  <g font-size="19" fill="#43474b">
    <text x="498" y="240">열기</text>
    <rect x="482" y="256" width="246" height="44" rx="8" fill="#1273c4"/>
    <text x="498" y="285" fill="#ffffff" font-weight="700">모두 압축 풀기...</text>
    <line x1="486" y1="316" x2="724" y2="316" stroke="#e5e5e5" stroke-width="2"/>
    <text x="498" y="352">복사</text>
    <text x="498" y="394">이름 바꾸기</text>
  </g>
  <circle cx="728" cy="256" r="20" fill="#1273c4" stroke="#ffffff" stroke-width="3"/>
  <text x="728" y="263" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <path d="M690 282l0 30 8-7 6 13 6-3-6-13 11-1z" fill="#101113" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

  <!-- result: practice_files folder -->
  <path d="M600 430 C 600 500, 540 520, 476 520" fill="none" stroke="#1273c4" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.7"/>
  <path d="M476 510l-14 10 14 10z" fill="#1273c4" opacity="0.7"/>
  <rect x="286" y="444" width="170" height="150" rx="12" fill="#ffffff" stroke="#1273c4" stroke-width="2.5"/>
  <use href="#folder" x="323" y="460" width="96" height="76"/>
  <text x="371" y="566" font-size="17" fill="#101113" font-weight="700" text-anchor="middle">practice_files</text>
  <circle cx="456" cy="444" r="20" fill="#1273c4" stroke="#ffffff" stroke-width="3"/>
  <text x="456" y="451" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
</svg>
