<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>
<g transform="translate(-97.4,-201.3) scale(1.121)">

<!-- big cloud containing a computer (centered around x=640) -->
<path d="M494 305 q-70 0 -70 66 q-56 4 -56 60 q0 60 60 60 h420 q64 0 64 -62 q0 -58 -58 -62 q-4 -64 -70 -64 q-32 0 -52 20 q-20 -18 -50 -18 q-18 0 -22 4 q-14 -4 -26 -4 z" fill="#cfe5f5" stroke="#1273c4" stroke-width="5" filter="url(#sh)"/>

<!-- computer inside cloud, centered under the cloud -->
<rect x="530" y="355" width="220" height="140" rx="12" fill="#43474b"/>
<rect x="550" y="373" width="180" height="90" rx="6" fill="#101113"/>
<rect x="590" y="495" width="100" height="14" rx="4" fill="#8b9095"/>
<rect x="550" y="509" width="180" height="12" rx="6" fill="#c9ccd1"/>
<text x="640" y="565" font-size="32" fill="#101113" font-weight="800" text-anchor="middle">빌려 쓰는 컴퓨터</text>

<!-- repo box: clear of the cloud, connected by dashed line, label under icon -->
<g filter="url(#sh)">
<rect x="1010" y="340" width="260" height="150" rx="16" fill="#fff" stroke="#1273c4" stroke-width="3"/>
</g>
<path d="M1110 385 q-20 0 -20 19 q-15 1 -15 17 q0 16 17 16 h80 q17 0 17 -17 q0 -15 -15 -17 q-1 -18 -19 -18 q-9 0 -14 6 q-6 -6 -14 -6 z" fill="#1273c4"/>
<text x="1140" y="465" font-size="30" fill="#101113" font-weight="800" text-anchor="middle">GitHub 레포</text>
<line x1="944" y1="410" x2="1006" y2="410" stroke="#1273c4" stroke-width="4" stroke-dasharray="6 8"/>

<!-- laptop, closed lid, bottom-left, symmetric with phone about x=800 -->
<g filter="url(#sh)">
<rect x="330" y="700" width="200" height="16" rx="6" fill="#43474b"/>
</g>
<rect x="350" y="664" width="160" height="36" rx="8" fill="#c9ccd1" stroke="#43474b" stroke-width="3"/>
<rect x="350" y="664" width="160" height="10" rx="5" fill="#e8eaec"/>
<text x="430" y="770" font-size="32" fill="#101113" font-weight="800" text-anchor="middle">내 컴퓨터 꺼도</text>
<line x1="490" y1="664" x2="455" y2="475" stroke="#1273c4" stroke-width="4" stroke-dasharray="8 10"/>

<!-- phone, bottom-right, symmetric with laptop about x=800 -->
<rect x="1110" y="640" width="120" height="180" rx="18" fill="#fff" stroke="#1273c4" stroke-width="5"/>
<rect x="1122" y="662" width="96" height="132" rx="4" fill="#cfe5f5"/>
<circle cx="1170" cy="806" r="8" fill="#1273c4"/>
<text x="1170" y="860" font-size="32" fill="#101113" font-weight="800" text-anchor="middle">폰에서도</text>
<line x1="1110" y1="670" x2="960" y2="470" stroke="#1273c4" stroke-width="4" stroke-dasharray="8 10"/>
</g>
</svg>
