<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>

<!-- card 1: 라이브러리 (stacked books) -->
<g filter="url(#sh)">
<rect x="140" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="220" y="380" width="140" height="120" rx="8" fill="#1273c4"/>
<rect x="235" y="360" width="140" height="120" rx="8" fill="#6aa6d9"/>
<rect x="250" y="340" width="140" height="120" rx="8" fill="#cfe5f5" stroke="#9fc6e6" stroke-width="2"/>
<text x="290" y="420" font-size="28" fill="#fff" font-weight="800" text-anchor="middle">A</text>
<text x="305" y="400" font-size="28" fill="#fff" font-weight="800" text-anchor="middle">B</text>
<text x="320" y="380" font-size="28" fill="#1273c4" font-weight="800" text-anchor="middle">C</text>
<text x="290" y="560" font-size="34" fill="#101113" font-weight="800" text-anchor="middle">라이브러리</text>

<!-- card 2: CLI (terminal) -->
<g filter="url(#sh)">
<rect x="480" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<rect x="540" y="340" width="180" height="130" rx="12" fill="#101113"/>
<rect x="540" y="340" width="180" height="30" rx="12" fill="#2b2e33"/>
<circle cx="556" cy="355" r="5" fill="#ff5f57"/><circle cx="572" cy="355" r="5" fill="#febc2e"/><circle cx="588" cy="355" r="5" fill="#28c840"/>
<text x="558" y="428" font-size="30" fill="#7dd88f" font-weight="800" font-family="Consolas, monospace">&gt;_</text>
<text x="630" y="560" font-size="34" fill="#101113" font-weight="800" text-anchor="middle">CLI</text>

<!-- card 3: 스킬 (open book / guide) -->
<g filter="url(#sh)">
<rect x="820" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<path d="M890 470 V370 Q890 355 905 355 H965 V470 Z" fill="#fff" stroke="#1273c4" stroke-width="4"/>
<path d="M1050 470 V370 Q1050 355 1035 355 H975 V470 Z" fill="#fff" stroke="#1273c4" stroke-width="4"/>
<path d="M970 358 V468" stroke="#c9ccd1" stroke-width="3"/>
<rect x="1010" y="330" width="34" height="70" fill="#1273c4"/>
<path d="M1010 400 L1027 385 L1044 400 Z" fill="#1273c4"/>
<text x="970" y="560" font-size="34" fill="#101113" font-weight="800" text-anchor="middle">스킬</text>

<!-- card 4: 플러그인 (puzzle piece) -->
<g filter="url(#sh)">
<rect x="1160" y="260" width="300" height="360" rx="24" fill="#fff" stroke="#c9ccd1" stroke-width="3"/>
</g>
<path d="M1250 360 h60 v-14 a20 20 0 0 1 40 0 v14 h60 v60 h14 a20 20 0 0 1 0 40 h-14 v60 h-60 a20 20 0 0 1 -40 0 h-60 v-60 h-14 a20 20 0 0 1 0 -40 h14 z" fill="#1273c4" transform="translate(-10 -6)"/>
<text x="1310" y="560" font-size="34" fill="#101113" font-weight="800" text-anchor="middle">플러그인</text>
</svg>
