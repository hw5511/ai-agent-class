<text x="800" y="830" font-size="34" fill="#101113" font-weight="900" text-anchor="middle">반복 작업 절약 · 매번 설명 vs 명령어 한 번</text>

<circle cx="420" cy="255" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="420" y="264" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
