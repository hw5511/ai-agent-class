<text x="420" y="190" font-size="34" fill="#8b9095" font-weight="900" text-anchor="middle">Before</text>
<circle cx="420" cy="440" r="200" fill="none" stroke="#f0c9b8" stroke-width="4" stroke-dasharray="4 10"/>
<g filter="url(#sh)">
<rect x="320" y="280" width="200" height="80" rx="14" fill="#fff4ef" stroke="#f0c9b8" stroke-width="3"/>
</g>
<text x="420" y="316" font-size="22" fill="#d97757" font-weight="800" text-anchor="middle">프롬프트</text>
<text x="420" y="342" font-size="22" fill="#d97757" font-weight="800" text-anchor="middle">다시 설명</text>
