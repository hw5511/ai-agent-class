<text x="420" y="582" font-size="22" fill="#d97757" font-weight="800" text-anchor="middle">수정</text>
<path d="M480 348 A 200 200 0 0 1 500 520" fill="none" stroke="#d97757" stroke-width="5" marker-end="url(#ab)"/>
<path d="M360 528 A 200 200 0 0 1 350 358" fill="none" stroke="#d97757" stroke-width="5" marker-end="url(#ab)"/>
<text x="420" y="700" font-size="28" fill="#101113" font-weight="800" text-anchor="middle">매번 반복</text>

<!-- AFTER: one command -->
<text x="1180" y="190" font-size="34" fill="#1273c4" font-weight="900" text-anchor="middle">After</text>
