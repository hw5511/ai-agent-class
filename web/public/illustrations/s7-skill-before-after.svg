<rect x="1030" y="380" width="300" height="90" rx="16" fill="#101113"/>
</g>
<text x="1060" y="435" font-size="28" fill="#7dd88f" font-weight="800" font-family="Consolas, monospace">/cardnews</text>
<path d="M1180 470 V540" stroke="#1273c4" stroke-width="6" marker-end="url(#abb)"/>
<circle cx="1180" cy="610" r="60" fill="#eef7ea" stroke="#bfe0c8" stroke-width="3" filter="url(#sh)"/>
<text x="1180" y="622" font-size="30" fill="#2f9e6e" font-weight="900" text-anchor="middle">완성</text>
