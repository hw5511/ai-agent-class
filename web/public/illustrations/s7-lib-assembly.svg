<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101113" flood-opacity="0.12"/></filter>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#fff"/>

<!-- block A -->
<g filter="url(#sh)">
<rect x="160" y="470" width="220" height="150" rx="16" fill="#cfe5f5" stroke="#9fc6e6" stroke-width="3"/>
</g>
<text x="270" y="555" font-size="48" fill="#1273c4" font-weight="900" text-anchor="middle">A</text>

<path d="M400 500 Q500 420 610 470" fill="none" stroke="#43474b" stroke-width="6" marker-end="url(#ab)"/>

<!-- block B, built on A -->
<g filter="url(#sh)">
<rect x="620" y="330" width="240" height="180" rx="16" fill="#6aa6d9" stroke="#1273c4" stroke-width="3"/>
</g>
<text x="740" y="435" font-size="48" fill="#fff" font-weight="900" text-anchor="middle">B</text>
<text x="740" y="475" font-size="20" fill="#eaf4fb" font-weight="700" text-anchor="middle">A 로 만듦</text>

<path d="M880 390 Q990 300 1110 330" fill="none" stroke="#43474b" stroke-width="6" marker-end="url(#ab)"/>

<!-- block C, built on B -->
<g filter="url(#sh)">
<rect x="1120" y="160" width="260" height="210" rx="16" fill="#1273c4" stroke="#0d5c9e" stroke-width="3"/>
</g>
<text x="1250" y="270" font-size="48" fill="#fff" font-weight="900" text-anchor="middle">C</text>
<text x="1250" y="310" font-size="20" fill="#cfe5f5" font-weight="700" text-anchor="middle">B 로 만듦</text>

<text x="800" y="770" font-size="38" fill="#101113" font-weight="900" text-anchor="middle">A 로 B 를, B 로 C 를 · 조립되는 프로그램</text>

<circle cx="270" cy="450" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="270" y="459" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<circle cx="740" cy="310" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="740" y="319" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<circle cx="1250" cy="140" r="24" fill="#1273c4" stroke="#fff" stroke-width="3"/><text x="1250" y="149" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text>
</svg>
