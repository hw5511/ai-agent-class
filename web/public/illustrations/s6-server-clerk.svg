<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 840" width="1792" height="840" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', sans-serif">
<defs>
<marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101113"/></marker>
<marker id="ar-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1273c4"/></marker>
</defs>
<rect x="0" y="0" width="1792" height="840" fill="#fff"/>

<!-- left column: 나 = 클라이언트 -->
<line x1="0" y1="330" x2="420" y2="330" stroke="#101113" stroke-width="2"/>
<text x="0" y="372" font-size="26" fill="#7c8288">나</text>
<text x="0" y="440" font-size="48" font-weight="700" fill="#101113">클라이언트</text>

<!-- right column: 서버 = 총무 -->
<line x1="1372" y1="330" x2="1792" y2="330" stroke="#101113" stroke-width="2"/>
<text x="1372" y="372" font-size="26" fill="#7c8288">서버</text>
<text x="1372" y="440" font-size="48" font-weight="700" fill="#101113">총무</text>
<text x="1372" y="480" font-size="28" fill="#43474b">요청 받으면 찾아서 보내줌</text>

<!-- middle: three exchange rows -->
<circle cx="502" cy="490" r="22" fill="#1273c4"/><text x="502" y="499" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<line x1="540" y1="490" x2="1312" y2="490" stroke="#101113" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="716" y="466" font-size="30" font-weight="700" fill="#101113">전화로 요청<tspan font-size="28" font-weight="400" fill="#7c8288" dx="6"> "자료 좀 보내주세요"</tspan></text>

<circle cx="502" cy="580" r="22" fill="#1273c4"/><text x="502" y="589" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<line x1="1312" y1="580" x2="540" y2="580" stroke="#1273c4" stroke-width="2" marker-end="url(#ar-acc)"/>
<text x="926" y="556" font-size="30" font-weight="700" fill="#1273c4" text-anchor="middle">"네"</text>

<circle cx="502" cy="670" r="22" fill="#1273c4"/><text x="502" y="679" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<line x1="1312" y1="670" x2="540" y2="670" stroke="#101113" stroke-width="2" marker-end="url(#ar-ink)"/>
<text x="926" y="646" font-size="30" font-weight="700" fill="#101113" text-anchor="middle">팩스 · 메일로 전달</text>
<text x="926" y="710" font-size="26" fill="#7c8288" text-anchor="middle">요청한 자료.pdf</text>
</svg>
