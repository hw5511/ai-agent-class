<rect x="44" y="37" width="30" height="30" rx="8" fill="#fee500"/>
<path d="M52 51c0-4.6 3.7-7.4 7-7.4s7 2.8 7 7.4c0 4.2-3 7-7 6.5l-4.2 2.8.7-3.7c-2.2-1.2-3.5-3-3.5-5.6z" fill="#3b1e1e"/>
<text x="88" y="58" font-size="26" font-weight="700" fill="#1c1e21">카카오톡</text>
