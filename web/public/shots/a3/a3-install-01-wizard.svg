<!-- left banner -->
<rect x="111" y="202" width="296" height="478" fill="#1a3a6b"/>
<g transform="translate(160 290)">
  <path d="M30 150 H150 a40 40 0 0 0 6 -79.6 a60 60 0 0 0 -110 14 a37 37 0 0 0 -16 65.6 Z" fill="#4285f4"/>
