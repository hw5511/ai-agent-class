<text x="259" y="558" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">CLI</text>
<!-- right content -->
<rect x="407" y="202" width="682" height="478" fill="#ffffff"/>
<text x="448" y="278" font-size="32" font-weight="700" fill="#000000">Welcome to the Google Cloud</text>
<text x="448" y="320" font-size="32" font-weight="700" fill="#000000">CLI Setup Wizard</text>
<text x="448" y="392" font-size="22" fill="#000000">This wizard will guide you through the</text>
<text x="448" y="426" font-size="22" fill="#000000">installation of Google Cloud CLI.</text>
<text x="448" y="486" font-size="22" fill="#000000">Click Next to continue.</text>
