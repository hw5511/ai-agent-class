<g transform="translate(130 163)"><path d="M6 24 H22 a7 7 0 0 0 1 -13.9 a9 9 0 0 0 -17 2.4 a6 6 0 0 0 -1 11.5 Z" fill="#4285f4"/></g>
<text x="170" y="184" font-size="22" fill="#000000">Google Cloud CLI Setup</text>
