<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Pretendard, 'Pretendard Variable', 'Malgun Gothic', Roboto, sans-serif">
<rect width="1200" height="900" fill="#ffffff"/>
<!-- console header -->
<rect width="1200" height="68" fill="#ffffff"/>
<line x1="0" y1="68" x2="1200" y2="68" stroke="#dadce0" stroke-width="2"/>
<g stroke="#5f6368" stroke-width="3" stroke-linecap="round"><line x1="24" y1="26" x2="50" y2="26"/><line x1="24" y1="34" x2="50" y2="34"/><line x1="24" y1="42" x2="50" y2="42"/></g>
<!-- Google Cloud logo -->
<g transform="translate(70 22)">
  <path d="M14 22 H34 a9 9 0 0 0 1 -17.9 a12 12 0 0 0 -22 3 a8.5 8.5 0 0 0 -1 14.9 Z" fill="#4285f4"/>
  <path d="M34 22 a9 9 0 0 0 1 -17.9 L30 10 Z" fill="#ea4335"/>
  <path d="M13 22 a8.5 8.5 0 0 1 -1 -14.9 L17 12 Z" fill="#fbbc04"/>
  <rect x="14" y="14" width="20" height="8" fill="#34a853"/>
</g>
<text x="124" y="44" font-size="23" fill="#5f6368"><tspan font-weight="500">Google</tspan> Cloud</text>
<!-- project chip -->
<rect x="300" y="14" width="300" height="40" rx="20" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
<circle cx="326" cy="34" r="8" fill="#1a73e8"/><rect x="320" y="29" width="12" height="10" rx="2" fill="#ffffff"/>
<text x="346" y="41" font-size="19" fill="#202124">gws-workspace-221530</text>
<path d="M576 30 l7 8 l7 -8" fill="none" stroke="#5f6368" stroke-width="3"/>
<!-- search -->
<rect x="630" y="12" width="330" height="44" rx="22" fill="#f1f3f4"/>
<circle cx="660" cy="33" r="8" fill="none" stroke="#5f6368" stroke-width="3"/><line x1="666" y1="39" x2="673" y2="46" stroke="#5f6368" stroke-width="3"/>
<text x="690" y="41" font-size="19" fill="#5f6368">검색 (/)</text>
<!-- right icons -->
<circle cx="1010" cy="34" r="12" fill="none" stroke="#5f6368" stroke-width="2.5"/><circle cx="1058" cy="34" r="12" fill="none" stroke="#5f6368" stroke-width="2.5"/><circle cx="1106" cy="34" r="12" fill="none" stroke="#5f6368" stroke-width="2.5"/>
<circle cx="1160" cy="34" r="19" fill="#8e44ad"/><text x="1160" y="42" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">수</text>

<!-- left nav -->
<rect x="0" y="69" width="268" height="831" fill="#ffffff"/>
<line x1="268" y1="69" x2="268" y2="900" stroke="#dadce0" stroke-width="2"/>
<g transform="translate(24 98)"><circle cx="14" cy="14" r="12" fill="none" stroke="#1a73e8" stroke-width="3"/><circle cx="14" cy="14" r="4" fill="#1a73e8"/></g>
<text x="62" y="120" font-size="21" font-weight="700" fill="#202124">Google 인증 플랫폼</text>
<g font-size="20" fill="#3c4043">
  <text x="62" y="190">개요</text>
  <text x="62" y="250">브랜딩</text>
  <text x="62" y="310">대상</text>
  <rect x="0" y="334" width="252" height="52" rx="26" fill="#e8f0fe"/>
  <text x="62" y="368" fill="#1967d2" font-weight="700">클라이언트</text>
  <text x="62" y="430">데이터 액세스</text>
  <text x="62" y="490">확인 센터</text>
  <text x="62" y="550">설정</text>
</g>
<g fill="none" stroke="#5f6368" stroke-width="2.5">
  <rect x="26" y="174" width="20" height="20" rx="3"/>
  <circle cx="36" cy="238" r="10"/>
  <rect x="26" y="294" width="20" height="20" rx="10"/>
  <rect x="26" y="418" width="20" height="20" rx="3"/>
  <path d="M26 474 l10 -6 l10 6 v14 h-20 Z"/>
  <circle cx="36" cy="538" r="9"/>
</g>
<rect x="26" y="351" width="20" height="20" rx="3" fill="none" stroke="#1967d2" stroke-width="3"/>

<!-- main -->
<path d="M318 140 l-14 14 l14 14 M304 154 h34" fill="none" stroke="#5f6368" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -4)"/>
<text x="364" y="160" font-size="36" font-weight="500" fill="#202124">OAuth 클라이언트 만들기</text>
<text x="304" y="214" font-size="20" fill="#5f6368">클라이언트 ID는 Google OAuth 서버에서 앱 하나를</text>
<text x="304" y="244" font-size="20" fill="#5f6368">식별하는 데 사용됩니다.</text>

<!-- field 1: select -->
<rect x="304" y="296" width="640" height="72" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
<rect x="320" y="284" width="196" height="26" fill="#ffffff"/>
<text x="328" y="303" font-size="17" fill="#1a73e8">애플리케이션 유형 *</text>
<text x="328" y="342" font-size="24" fill="#202124">데스크톱 앱</text>
<path d="M902 326 l12 13 l12 -13" fill="none" stroke="#5f6368" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- field 2: text -->
<rect x="304" y="440" width="640" height="72" rx="8" fill="#ffffff" stroke="#80868b" stroke-width="2"/>
<rect x="320" y="428" width="64" height="26" fill="#ffffff"/>
<text x="328" y="447" font-size="17" fill="#5f6368">이름 *</text>
<text x="328" y="486" font-size="24" fill="#202124">GWS CLI</text>
<text x="304" y="548" font-size="18" fill="#5f6368">콘솔에서만 쓰는 이름이며 사용자에게 표시되지 않습니다.</text>

<!-- buttons -->
<rect x="304" y="610" width="150" height="56" rx="28" fill="#1a73e8"/>
<text x="379" y="646" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">만들기</text>
<rect x="472" y="610" width="130" height="56" rx="28" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
<text x="537" y="646" font-size="22" font-weight="700" fill="#1a73e8" text-anchor="middle">취소</text>
</svg>
