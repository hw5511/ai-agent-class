<text x="290" y="176" font-size="22" font-weight="500" fill="#1f1f1f">최근 보안 활동</text><rect x="290" y="194" width="450" height="222" rx="22" fill="#fff"/><text x="316" y="228" font-size="20" fill="#1f1f1f">Windows 기기에서 새로 로그인함</text><text x="316" y="254" font-size="17" fill="#444746">10월 5일</text><line x1="290" y1="268" x2="740" y2="268" stroke="#eef1f6" stroke-width="2"/><text x="316" y="302" font-size="20" fill="#1f1f1f">비밀번호 변경됨</text><text x="316" y="328" font-size="17" fill="#444746">9월 28일</text><line x1="290" y1="342" x2="740" y2="342" stroke="#eef1f6" stroke-width="2"/><text x="316" y="376" font-size="20" fill="#1f1f1f">보안 활동 검토</text><rect x="690" y="362" width="34" height="34" rx="12" fill="#eef1f6"/><text x="707" y="386" font-size="17" text-anchor="middle" fill="#1f1f1f">3</text><rect x="290" y="444" width="450" height="150" rx="22" fill="#fff"/><path d="M342 488 l22 7 v15 c0 15 -11 23 -22 28 c-11 -5 -22 -13 -22 -28 v-15 z" fill="#f9ab00"/><rect x="340" y="500" width="4" height="14" fill="#fff"/><rect x="340" y="520" width="4" height="4" fill="#fff"/><text x="388" y="506" font-size="20" font-weight="500" fill="#1f1f1f">보안 권장사항 확인</text><text x="388" y="534" font-size="17" fill="#444746">보안 진단에서 권장 조치를</text><text x="388" y="558" font-size="17" fill="#444746">확인할 수 있습니다.</text>
<text x="790" y="176" font-size="28" fill="#1f1f1f">Google에 로그인하는 방법</text><text x="790" y="210" font-size="18" fill="#444746">항상 Google 계정에 액세스할 수 있도록 최신 정보가 반영되었는지 확인하세요.</text><rect x="790" y="236" width="740" height="300" rx="22" fill="#fff"/><path d="M848 290 l16 5 v12 c0 11 -8 17 -16 21 c-8 -4 -16 -10 -16 -21 v-12 z" fill="none" stroke="#444746" stroke-width="3.2" stroke-linejoin="round"/><circle cx="848" cy="302" r="4" fill="#444746"/><rect x="846" y="306" width="4" height="9" fill="#444746"/><text x="900" y="304" font-size="26" fill="#1f1f1f">2단계 인증</text><rect x="900" y="320" width="150" height="40" rx="20" fill="#fce8e6"/><circle cx="924" cy="340" r="11" fill="#b3261e"/><rect x="922.5" y="333" width="3" height="9" fill="#fff"/><circle cx="924" cy="346" r="2" fill="#fff"/><text x="944" y="347" font-size="20" font-weight="500" fill="#8c1d18">사용 안함</text><path d="M1488 317 l9 9 l-9 9" fill="none" stroke="#444746" stroke-width="2.8"/><line x1="790" y1="386" x2="1530" y2="386" stroke="#eef1f6" stroke-width="2"/><circle cx="848" cy="446" r="12" fill="#444746"/><path d="M828 480 q20 -20 40 0 z" fill="#444746"/><text x="900" y="448" font-size="26" fill="#1f1f1f">패스키 및 보안 키</text><text x="900" y="484" font-size="19" fill="#444746">패스키 사용 시작</text><path d="M1488 447 l9 9 l-9 9" fill="none" stroke="#444746" stroke-width="2.8"/>
