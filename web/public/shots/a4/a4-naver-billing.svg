<text x="312" y="262" font-size="21" fill="#0089ff" font-weight="600" >결제 수단</text>
<line x1="288" y1="281" x2="1170" y2="281" stroke="#dedfe2" stroke-width="1"/>
<text x="312" y="329" font-size="18" fill="#142536" font-weight="600" >자동이체</text>
<rect x="490" y="300" width="195" height="43" rx="2" fill="#fff" stroke="#d8dade" />
<text x="587.5" y="328.15" font-size="19" fill="#142536" text-anchor="middle" >결제 수단 등록</text>
<rect x="310" y="367" width="838" height="458" rx="0" fill="#fbfbfc" stroke="#dedfe2" />
<text x="330" y="400" font-size="18" fill="#142536" font-weight="600" >결제 수단 방법 안내</text>
<text x="330" y="430" font-size="16" fill="#304761" >•  개인 고객의 경우 신용카드 자동납부 결제만 지원됩니다.</text>
<text x="330" y="453" font-size="16" fill="#304761" >•  23시~09시 사이에는 금융사 정책으로 계좌이체 혹은 체크카드 등록이 불가합니다.</text>
<text x="330" y="476" font-size="16" fill="#304761" >•  모바일 환경에서 자동이체 결제 수단을 등록하는 경우, 개인 명의 신용카드와</text>
<text x="330" y="499" font-size="16" fill="#304761" >   기명식 법인카드만 등록가능합니다.</text>
<text x="330" y="522" font-size="16" fill="#304761" >•  한국 외 이용자일 경우, VISA, MASTER, JCB, AMEX(단, USD 불가) 카드사에서 발급한</text>
<text x="330" y="545" font-size="16" fill="#304761" >   3D(3-domain) Secure 신용카드만 등록하실 수 있습니다.</text>
<text x="330" y="568" font-size="16" fill="#304761" >•  파트너의 경우, 결제수단을 등록하더라도 해당 결제수단으로 납부하실 수 없습니다.</text>
<text x="330" y="591" font-size="16" fill="#304761" >   등록한 결제수단으로 납부를 원하실 경우, 등록 후 [고객지원 - FAQ&gt; 문의하기]로</text>
<text x="330" y="614" font-size="16" fill="#304761" >   문의하여 주십시오.</text>
<text x="330" y="654" font-size="18" fill="#142536" font-weight="600" >미납 유의 사항 안내</text>
<text x="330" y="681" font-size="16" fill="#304761" >•  직접 입금으로 납입하지 않거나, 유효기간 만료, 잔액 부족 또는 한도 초과 등의 사유로</text>
<text x="330" y="706" font-size="16" fill="#304761" >   자동이체 실패 시 미납이 발생할 수 있습니다.</text>
<text x="330" y="731" font-size="16" fill="#304761" >•  미납 요금이 납부되지 않을 경우, 추가요금이 발생하지 않도록 &#x27;서비스 이용 정지 및</text>
<text x="330" y="756" font-size="16" fill="#304761" >   리소스 반납&#x27;이 진행될 수 있으니 참고하여 주십시오.</text>
<text x="330" y="781" font-size="16" fill="#304761" >•  미납 발생 시, 고객님의 메일을 통해 안내하여 드립니다.</text>
