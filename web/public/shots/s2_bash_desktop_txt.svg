<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Pretendard, 'Malgun Gothic', sans-serif">
<defs>
  <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfeaf7"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/></filter>
</defs>
<rect width="1000" height="760" fill="url(#wp)"/>

<!-- desktop icons, big -->
<g text-anchor="middle">
  <rect x="32" y="28" width="64" height="56" rx="8" fill="#9aa0a6" stroke="#8a94a3" stroke-width="1.6"/>
  <text x="64" y="106" font-size="20" fill="#1c1e21">휴지통</text>
</g>

<!-- new 메모.txt icon on desktop -->
<g text-anchor="middle">
  <rect x="132" y="28" width="64" height="56" rx="8" fill="#ffffff" stroke="#1273c4" stroke-width="2.4"/>
  <rect x="144" y="40" width="40" height="5" rx="2" fill="#c9d6e6"/>
  <rect x="144" y="52" width="40" height="5" rx="2" fill="#c9d6e6"/>
  <rect x="144" y="64" width="26" height="5" rx="2" fill="#c9d6e6"/>
  <text x="164" y="106" font-size="22" font-weight="700" fill="#1c1e21">메모.txt</text>
  <text x="164" y="128" font-size="16" fill="#5a7ba8">방금 만들어짐</text>
</g>

<!-- Notepad window: fills most of the canvas (>60% of the area) -->
<g filter="url(#sh)">
  <rect x="140" y="160" width="820" height="580" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/>
</g>
<path d="M140 174a14 14 0 0 1 14-14h792a14 14 0 0 1 14 14v46h-820z" fill="#fafafb"/>
<rect x="140" y="160" width="820" height="60" fill="none" stroke="#e2e4e8" stroke-width="1.5"/>
<rect x="168" y="178" width="24" height="24" rx="4" fill="#ffffff" stroke="#1273c4" stroke-width="2.2"/>
<rect x="174" y="185" width="12" height="2.4" fill="#1273c4"/>
<rect x="174" y="192" width="12" height="2.4" fill="#1273c4"/>
<text x="208" y="198" font-size="24" fill="#1c1e21">메모.txt - 메모장</text>
<circle cx="890" cy="188" r="4" fill="#9aa0a6"/>
<rect x="918" y="186" width="18" height="2.4" fill="#9aa0a6"/>
<rect x="914" y="179" width="18" height="18" fill="none" stroke="#9aa0a6" stroke-width="2"/>
<path d="M944 179l18 18m0-18l-18 18" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round"/>

<!-- menu bar -->
<g font-size="20" fill="#43474b">
  <text x="168" y="252">파일</text>
  <text x="222" y="252">편집</text>
  <text x="276" y="252">보기</text>
</g>
<line x1="140" y1="270" x2="960" y2="270" stroke="#eef0f3" stroke-width="1.4"/>

<!-- body text: big, three lines -->
<g fill="#1c1e21">
  <text x="176" y="342" font-size="32" font-weight="700">오늘 할 일</text>
  <text x="176" y="418" font-size="28">1. 이메일 답장하기</text>
  <text x="176" y="486" font-size="28">2. 자료 정리하기</text>
  <text x="176" y="554" font-size="28">3. 저녁 운동하기</text>
</g>
</svg>
