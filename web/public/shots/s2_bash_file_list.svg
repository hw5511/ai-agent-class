<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Pretendard, 'Malgun Gothic', sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/></filter>
</defs>
<rect width="1000" height="760" fill="#eef0f3"/>

<g filter="url(#sh)">
  <rect x="16" y="16" width="968" height="728" rx="14" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/>
</g>

<!-- title bar -->
<path d="M16 30a14 14 0 0 1 14-14h920a14 14 0 0 1 14 14v46h-948z" fill="#fafafb"/>
<rect x="16" y="16" width="968" height="60" fill="none" stroke="#e2e4e8" stroke-width="1.5"/>
<rect x="48" y="26" width="22" height="17" rx="2.5" fill="#f4c542" stroke="#c79a1c" stroke-width="1.2"/>
<text x="82" y="50" font-size="26" fill="#1c1e21">agent1</text>
<circle cx="880" cy="46" r="4" fill="#9aa0a6"/>
<rect x="910" y="43" width="18" height="2.4" fill="#9aa0a6"/>
<rect x="906" y="36" width="18" height="18" fill="none" stroke="#9aa0a6" stroke-width="2"/>
<path d="M936 36l18 18m0-18l-18 18" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round"/>

<!-- breadcrumb -->
<g font-size="22" fill="#43474b">
  <text x="48" y="108">이 PC</text>
  <text x="116" y="108">&gt;</text>
  <text x="140" y="108">로컬 디스크 (C:)</text>
  <text x="320" y="108">&gt;</text>
  <text x="344" y="108" font-weight="700" fill="#1273c4">agent1</text>
</g>
<line x1="16" y1="128" x2="984" y2="128" stroke="#e2e4e8" stroke-width="1.4"/>

<!-- column headers -->
<g font-size="18" fill="#6b7280">
  <text x="48" y="158">이름</text>
  <text x="820" y="158">유형</text>
</g>
<line x1="40" y1="172" x2="960" y2="172" stroke="#e2e4e8" stroke-width="1.4"/>

<!-- rows: 6 items, big filenames -->
<g font-size="28" fill="#1c1e21">
  <!-- 자기소개서.txt -->
  <rect x="48" y="196" width="26" height="32" rx="3" fill="#ffffff" stroke="#8a94a3" stroke-width="1.6"/>
  <text x="90" y="222">자기소개서.txt</text>
  <text x="820" y="222" font-size="20" fill="#6b7280">텍스트</text>

  <!-- 강아지.svg -->
  <rect x="48" y="284" width="26" height="26" rx="4" fill="#d6e6ff" stroke="#7fa8e0" stroke-width="1.6"/>
  <text x="90" y="310">강아지.svg</text>
  <text x="820" y="310" font-size="20" fill="#6b7280">SVG</text>

  <!-- 포스터.html -->
  <rect x="48" y="372" width="26" height="26" rx="4" fill="#ffe3c2" stroke="#e0a860" stroke-width="1.6"/>
  <text x="90" y="398">포스터.html</text>
  <text x="820" y="398" font-size="20" fill="#6b7280">HTML</text>

  <!-- 계산기.html -->
  <rect x="48" y="460" width="26" height="26" rx="4" fill="#ffe3c2" stroke="#e0a860" stroke-width="1.6"/>
  <text x="90" y="486">계산기.html</text>
  <text x="820" y="486" font-size="20" fill="#6b7280">HTML</text>

  <!-- 테트리스.html -->
  <rect x="48" y="548" width="26" height="26" rx="4" fill="#ffe3c2" stroke="#e0a860" stroke-width="1.6"/>
  <text x="90" y="574">테트리스.html</text>
  <text x="820" y="574" font-size="20" fill="#6b7280">HTML</text>

  <!-- practice_files 폴더 -->
  <rect x="46" y="634" width="30" height="24" rx="3" fill="#f4c542" stroke="#c79a1c" stroke-width="1.4"/>
  <text x="90" y="658">practice_files</text>
  <text x="820" y="658" font-size="20" fill="#6b7280">폴더</text>
</g>
<line x1="40" y1="256" x2="960" y2="256" stroke="#f3f4f6" stroke-width="1.2"/>
<line x1="40" y1="344" x2="960" y2="344" stroke="#f3f4f6" stroke-width="1.2"/>
<line x1="40" y1="432" x2="960" y2="432" stroke="#f3f4f6" stroke-width="1.2"/>
<line x1="40" y1="520" x2="960" y2="520" stroke="#f3f4f6" stroke-width="1.2"/>
<line x1="40" y1="608" x2="960" y2="608" stroke="#f3f4f6" stroke-width="1.2"/>

<!-- status bar -->
<line x1="16" y1="700" x2="984" y2="700" stroke="#e2e4e8" stroke-width="1.4"/>
<text x="48" y="726" font-size="20" fill="#6b7280">6개 항목</text>
</svg>
