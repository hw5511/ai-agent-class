<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Pretendard, 'Malgun Gothic', sans-serif">
<defs>
  <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
</defs>
<rect width="1000" height="760" fill="url(#wp)"/>

<!-- desktop icons, big -->
<g text-anchor="middle">
  <rect x="32" y="28" width="64" height="56" rx="8" fill="#9aa0a6" stroke="#8a94a3" stroke-width="1.6"/>
  <text x="64" y="106" font-size="22" fill="#1c1e21">휴지통</text>

  <rect x="32" y="128" width="64" height="56" rx="8" fill="#f4c542" stroke="#c79a1c" stroke-width="1.6"/>
  <text x="64" y="206" font-size="22" fill="#1c1e21">agent1</text>
</g>

<!-- taskbar -->
<line x1="0" y1="700" x2="1000" y2="700" stroke="#c7d4e2" stroke-width="1.4"/>
<rect x="0" y="700" width="1000" height="60" fill="#ffffff" opacity="0.9"/>
<circle cx="920" cy="730" r="10" fill="#48c46e"/>
<text x="960" y="737" font-size="18" fill="#43474b" text-anchor="middle">오후 3:00</text>

<!-- slime, freshly launched, resting on desktop -->
<g>
  <ellipse cx="500" cy="600" rx="120" ry="18" fill="#0f172a" opacity="0.12"/>
  <path d="M380 584 C380 460 428 388 500 388 C572 388 620 460 620 584 Z" fill="#7ed957" stroke="#3f9a2b" stroke-width="5"/>
  <ellipse cx="450" cy="440" rx="22" ry="24" fill="#ffffff" opacity=".7"/>
  <circle cx="462" cy="512" r="13" fill="#1d3b12"/>
  <circle cx="538" cy="512" r="13" fill="#1d3b12"/>
  <path d="M478 542 q22 20 44 0" fill="none" stroke="#1d3b12" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="436" cy="534" rx="18" ry="11" fill="#ff9aa2" opacity=".8"/>
  <ellipse cx="564" cy="534" rx="18" ry="11" fill="#ff9aa2" opacity=".8"/>
</g>

</svg>
